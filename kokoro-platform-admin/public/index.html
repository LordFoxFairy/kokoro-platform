<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kokoro 运营后台</title>
<style>
  :root {
    --fg: #1a1a1a;
    --fg2: #666;
    --bg: #ffffff;
    --panel: #fafafa;
    --line: #e2e2e2;
    --line2: #ededed;
    --accent: #0d6e63;
    --danger: #b3261e;
    --ok: #1a7f37;
    --warn: #9a6700;
    --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); font-size: 13px; color: var(--fg); background: var(--bg); line-height: 1.45; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top .name { font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
  .top .name span { color: var(--accent); }
  .top .grow { flex: 1; }
  .top label { color: var(--fg2); margin-right: 5px; }
  select, input { font-family: var(--sans); font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; }
  input { font-family: var(--mono); }
  select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  /* tabs */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); padding: 0 16px; background: var(--bg); }
  .tab { padding: 8px 14px; cursor: pointer; color: var(--fg2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tab.on { color: var(--fg); border-bottom-color: var(--accent); }

  main { padding: 16px; max-width: 1200px; }
  .hide { display: none !important; }

  /* search row */
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .bar label { color: var(--fg2); }
  button { font-family: var(--sans); font-size: 13px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 4px; padding: 5px 12px; font-weight: 500; }
  button:hover { background: #0b5d54; }
  button.sec { background: var(--bg); color: var(--fg); border-color: var(--line); }
  button.sec:hover { background: var(--panel); }
  button.danger { background: var(--danger); border-color: var(--danger); }
  button.danger:hover { background: #97201a; }
  button.sm { padding: 3px 8px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* account strip + actions */
  .row2 { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; }
  .box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 280px; }
  .box h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .04em; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; }
  .kv dt { color: var(--fg2); }
  .kv dd { margin: 0; font-family: var(--mono); text-align: right; word-break: break-all; }
  .nums { display: flex; gap: 20px; margin-bottom: 8px; }
  .nums div { font-size: 12px; color: var(--fg2); }
  .nums b { display: block; font-family: var(--mono); font-size: 17px; color: var(--fg); font-weight: 600; }
  .nums .hi b { color: var(--accent); }
  .acts { display: flex; flex-direction: column; gap: 6px; }
  .acts .lbl { font-size: 11px; color: var(--fg2); text-transform: uppercase; letter-spacing: .04em; }

  /* tables */
  .tw { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .03em; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  td { padding: 7px 12px; border-bottom: 1px solid var(--line2); font-family: var(--mono); font-size: 12.5px; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #fbfbfb; }
  .cap { display: flex; justify-content: space-between; align-items: center; margin: 0 0 6px; }
  .cap h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .cap .n { color: var(--fg2); font-family: var(--mono); font-size: 12px; }

  .st { font-weight: 600; }
  .st.active, .st.paid, .st.ok { color: var(--ok); }
  .st.disabled, .st.refunded, .st.canceled, .st.error { color: var(--danger); }
  .st.pending { color: var(--warn); }
  .empty { color: var(--fg2); padding: 16px 12px; }
  .muted { color: var(--fg2); font-family: var(--sans); }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: none; align-items: center; justify-content: center; }
  .scrim.on { display: flex; }
  .modal { width: 380px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .modal h2 { margin: 0 0 2px; font-size: 14px; }
  .modal .ctx { color: var(--fg2); font-family: var(--mono); font-size: 11.5px; margin-bottom: 12px; word-break: break-all; }
  .modal .f { margin-bottom: 10px; }
  .modal .f label { display: block; color: var(--fg2); margin-bottom: 3px; font-size: 12px; }
  .modal .f label .req { color: var(--danger); }
  .modal .f input, .modal .f select { width: 100%; }
  .modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  #toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .toast { font-size: 12.5px; padding: 8px 12px; border: 1px solid var(--line); border-left-width: 3px; border-radius: 4px; background: var(--bg); box-shadow: 0 4px 14px rgba(0,0,0,.12); max-width: 340px; }
  .toast.ok { border-left-color: var(--ok); }
  .toast.err { border-left-color: var(--danger); }
  .toast b { font-weight: 600; }
</style>
</head>
<body>
<div class="top">
  <div class="name">Kokoro <span>运营后台</span></div>
  <div class="grow"></div>
  <div><label>站点</label><select id="site"><option value="">…</option></select></div>
  <div><label>操作员</label><select id="operator"><option value="">…</option></select></div>
</div>
<div class="tabs">
  <div class="tab on" data-tab="desk">工作台</div>
  <div class="tab" id="tabApprovals" data-tab="approvals">审批</div>
  <div class="tab" id="tabAudit" data-tab="audit">审计流水</div>
  <div class="tab" id="tabPerms" data-tab="perms">权限管理</div>
  <div class="tab" data-tab="docs">接口文档</div>
</div>

<main id="desk">
  <div class="bar">
    <label>Owner</label>
    <select id="ownerKind"><option value="team">team</option><option value="user">user</option></select>
    <input id="ownerId" placeholder="owner id" size="28" autocomplete="off" />
    <button id="lookup">查账</button>
  </div>
  <div id="result"><div class="empty">选站点 + 填 owner，点查账。</div></div>
</main>

<main id="audit" class="hide">
  <div class="bar">
    <button class="sec" id="auditReload">刷新</button>
    <span class="muted" id="auditNote">显示当前站点最近 50 条操作审计。</span>
  </div>
  <div class="tw">
    <table>
      <thead><tr><th>时间</th><th>操作员</th><th>动作</th><th>目标</th><th>结果</th><th>理由</th></tr></thead>
      <tbody id="auditRows"><tr><td colspan="6" class="empty">—</td></tr></tbody>
    </table>
  </div>
</main>

<main id="approvals" class="hide">
  <div class="bar">
    <button class="sec" id="approvalsReload">刷新</button>
    <span class="muted">待复核的高危/大额操作（不能批自己提交的）。</span>
  </div>
  <div class="tw">
    <table>
      <thead><tr><th>时间</th><th>申请人</th><th>动作</th><th>目标</th><th>理由</th><th>状态</th><th></th></tr></thead>
      <tbody id="approvalRows"><tr><td colspan="7" class="empty">—</td></tr></tbody>
    </table>
  </div>
</main>

<main id="perms" class="hide">
  <div class="bar">
    <button class="sec" id="permsReload">刷新</button>
    <button id="newOp">新建 operator</button>
    <span class="muted">超管级：管理运营账号与角色权限。</span>
  </div>
  <div class="cap"><h2>Operators</h2><span class="n" id="opCount">—</span></div>
  <div class="tw"><table>
    <thead><tr><th>email</th><th>角色</th><th>作用域</th><th>状态</th><th></th></tr></thead>
    <tbody id="opRows"><tr><td colspan="5" class="empty">—</td></tr></tbody>
  </table></div>
  <div class="cap" style="margin-top:16px"><h2>Roles</h2><span class="n" id="roleCount">—</span></div>
  <div class="tw"><table>
    <thead><tr><th>key</th><th>name</th><th>permissions</th></tr></thead>
    <tbody id="roleRows"><tr><td colspan="3" class="empty">—</td></tr></tbody>
  </table></div>
</main>

<main id="docs" class="hide">
  <div class="bar"><span class="muted">各业务模块的 OpenAPI JSON 契约（在线模块可点开）。</span></div>
  <div class="tw"><table><thead><tr><th>模块</th><th>状态</th><th>文档</th></tr></thead><tbody id="docsRows"><tr><td colspan="3" class="empty">—</td></tr></tbody></table></div>
</main>

<div class="scrim" id="scrim">
  <div class="modal">
    <h2 id="mTitle">操作</h2>
    <div class="ctx" id="mCtx"></div>
    <div id="mFields"></div>
    <div class="btns"><button class="sec" id="mCancel">取消</button><button id="mSubmit">确认</button></div>
  </div>
</div>
<div id="toasts"></div>

<script>
const $ = (s) => document.querySelector(s);
const micros = (m) => (Number(m || 0) / 1e6).toLocaleString("zh-CN", { maximumFractionDigits: 6 });
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const fmtTime = (s) => { const d = new Date(s); return Number.isNaN(d.getTime()) ? esc(s) : d.toLocaleString("zh-CN", { hour12: false }); };
let SITE = "";
let OPERATOR = "";
let CURRENT = null;
let ME = null;

function toast(kind, title, msg) {
  const el = document.createElement("div");
  el.className = "toast " + (kind === "ok" ? "ok" : "err");
  el.innerHTML = `<b>${esc(title)}</b> ${esc(msg)}`;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), 6000);
}

// 每个请求都带操作员身份，服务端据此做 RBAC + 租户作用域。
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (OPERATOR) headers["x-kokoro-operator"] = OPERATOR;
  const res = await fetch(path, { ...opts, headers });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body?.error?.message || `HTTP ${res.status}`);
  return body.data;
}

// 权限 glob（与服务端 permits 一致）：* / 精确 / prefix.*。
function can(p) {
  return (ME?.permissions || []).some((g) => g === "*" || g === p || (g.endsWith(".*") && p.startsWith(g.slice(0, -1))));
}

async function loadSites() {
  try {
    const sites = await api("/api/sites");
    $("#site").innerHTML = sites.length
      ? sites.map((s) => `<option value="${esc(s.id)}">${esc(s.name || s.key || s.id)}</option>`).join("")
      : `<option value="">（无站点）</option>`;
    SITE = $("#site").value;
  } catch (e) { $("#site").innerHTML = `<option value="">站点离线</option>`; toast("err", "站点", e.message); }
}

async function loadOperators() {
  try {
    const ops = await api("/api/operators");
    $("#operator").innerHTML = ops.map((o) => `<option value="${esc(o.email)}">${esc(o.displayName)} · ${esc(o.roleKey)}</option>`).join("");
    OPERATOR = $("#operator").value;
  } catch (e) { $("#operator").innerHTML = `<option value="">—</option>`; }
}

function stat(s) { return `<span class="st ${esc(s)}">${esc(s)}</span>`; }

async function lookup() {
  if (!SITE) { toast("err", "缺站点", "请先选站点"); return; }
  const ownerKind = $("#ownerKind").value;
  const ownerId = $("#ownerId").value.trim();
  if (!ownerId) { toast("err", "缺 owner", "请输入 owner id"); return; }
  $("#lookup").disabled = true;
  try {
    const q = new URLSearchParams({ siteId: SITE, ownerKind, ownerId });
    CURRENT = { ownerKind, ownerId, data: await api("/api/user360?" + q) };
    render();
  } catch (e) { toast("err", "查账失败", e.message); }
  finally { $("#lookup").disabled = false; }
}

function render() {
  const { ownerKind, ownerId, data } = CURRENT;
  const acc = data.creditAccount;
  const id = data.identity;
  const avail = acc ? Number(acc.balanceMicros) - Number(acc.heldMicros) : 0;

  const idRows = ownerKind === "user"
    ? (id ? `<dt>用户</dt><dd>${esc(id.displayName || id.email || "—")}</dd><dt>id</dt><dd>${esc(id.id)}</dd><dt>状态</dt><dd>${stat(id.status)}</dd>`
          : `<dt>用户</dt><dd class="muted">站内未找到</dd>`)
    : `<dt>teamId</dt><dd>${esc(ownerId)}</dd><dt>站点</dt><dd>${esc(SITE)}</dd>`;

  const accBox = acc
    ? `<div class="nums"><div class="hi">可用<b>${micros(avail)}</b></div><div>余额<b>${micros(acc.balanceMicros)}</b></div><div>冻结<b>${micros(acc.heldMicros)}</b></div></div>
       <dl class="kv"><dt>accountId</dt><dd>${esc(acc.id)}</dd><dt>状态</dt><dd>${stat(acc.status)}</dd></dl>`
    : `<div class="muted">站内暂无账户（发积分自动创建）</div>`;

  const canRefund = can("payment.order.refund");
  const orders = data.orders || [];
  const orderRows = orders.length
    ? orders.map((o) => `<tr><td>${esc(o.id)}</td><td>${esc(o.planId || "—")}</td><td>${esc(o.amountMinor)} ${esc(o.currency || "")}</td><td>${stat(o.status)}</td><td>${o.status === "paid" && canRefund ? `<button class="danger sm" data-refund="${esc(o.id)}">退款</button>` : ""}</td></tr>`).join("")
    : `<tr><td colspan="5" class="empty">无订单</td></tr>`;

  const userToggle = ownerKind === "user" && id && can("user.disable")
    ? (id.status === "active" ? `<button class="danger" data-act="disable-user">禁用用户</button>` : `<button class="sec" data-act="enable-user">启用用户</button>`) : "";
  const acts = [
    can("credit.grant") ? `<button data-act="grant">发积分</button>` : "",
    ownerKind === "team" && can("payment.plan.grant") ? `<button class="sec" data-act="grant-plan">授予套餐</button>` : "",
    userToggle,
  ].filter(Boolean).join("");

  $("#result").innerHTML = `
    <div class="row2">
      <div class="box"><h3>${ownerKind === "user" ? "身份" : "团队"}</h3><dl class="kv">${idRows}</dl></div>
      <div class="box"><h3>积分账户</h3>${accBox}</div>
      <div class="acts"><span class="lbl">操作</span>${acts || '<span class="muted">无可用操作</span>'}</div>
    </div>
    <div class="cap"><h2>订单</h2><span class="n">${orders.length}</span></div>
    <div class="tw"><table><thead><tr><th>订单</th><th>套餐</th><th>金额</th><th>状态</th><th></th></tr></thead><tbody>${orderRows}</tbody></table></div>`;

  $("#result").querySelectorAll("[data-act]").forEach((b) => b.onclick = () => openAction(b.dataset.act));
  $("#result").querySelectorAll("[data-refund]").forEach((b) => b.onclick = () => openAction("refund", b.dataset.refund));
}

// audit
async function loadAudit() {
  if (!SITE) { $("#auditRows").innerHTML = `<tr><td colspan="6" class="empty">先选站点</td></tr>`; return; }
  try {
    const rows = await api("/api/audit?" + new URLSearchParams({ siteId: SITE, limit: "50" }));
    $("#auditRows").innerHTML = rows.length
      ? rows.map((r) => `<tr><td>${fmtTime(r.createdAt)}</td><td>${esc(r.actorEmail || "—")}</td><td>${esc(r.moduleId)}.${esc(r.actionId)}</td><td>${esc(r.targetRoute)}</td><td>${stat(r.result)} ${esc(r.statusCode)}</td><td class="muted">${esc(r.reason || "")}</td></tr>`).join("")
      : `<tr><td colspan="6" class="empty">本站点暂无审计记录</td></tr>`;
  } catch (e) { toast("err", "审计", e.message); }
}

// operations
const scrim = $("#scrim");
let pending = null;
const FORMS = {
  grant: () => ({ title: "发积分", danger: false,
    fields: [{ name: "amount", label: "积分数", req: true, type: "number" }, { name: "reason", label: "原因", req: true, type: "select", options: ["manual_adjustment", "refund", "subscription"] }],
    build: (v) => ({ moduleId: "credit", resourceId: "credit-accounts", actionId: "grant", siteId: SITE, reason: v.reason, body: { ownerKind: CURRENT.ownerKind, ownerId: CURRENT.ownerId, amountMicros: String(Math.round(Number(v.amount) * 1e6)), reason: v.reason } }) }),
  "grant-plan": () => ({ title: "授予套餐", danger: false,
    fields: [{ name: "planId", label: "套餐 planId", req: true, type: "text" }],
    build: (v) => ({ moduleId: "payment", resourceId: "plans", actionId: "grant-to-team", siteId: SITE, body: { teamId: CURRENT.ownerId, planId: v.planId } }) }),
  "disable-user": () => ({ title: "禁用用户", danger: true,
    fields: [{ name: "reason", label: "禁用原因", req: true, type: "text" }],
    build: (v) => ({ moduleId: "user", resourceId: "users", actionId: "disable", siteId: SITE, params: { id: CURRENT.data.identity.id }, reason: v.reason, body: {} }) }),
  "enable-user": () => ({ title: "启用用户", danger: false, fields: [],
    build: () => ({ moduleId: "user", resourceId: "users", actionId: "enable", siteId: SITE, params: { id: CURRENT.data.identity.id }, body: {} }) }),
  refund: (orderId) => ({ title: "退款", danger: true, ctx: "订单 " + orderId,
    fields: [{ name: "reason", label: "退款原因", req: true, type: "text" }],
    build: (v) => ({ moduleId: "payment", resourceId: "orders", actionId: "refund", siteId: SITE, params: { id: orderId }, reason: v.reason, body: {} }) }),
};

function openAction(kind, arg) {
  const def = FORMS[kind](arg);
  pending = def;
  $("#mTitle").textContent = def.title;
  $("#mCtx").textContent = (def.ctx || `${CURRENT.ownerKind} ${CURRENT.ownerId} @ ${SITE}`) + ` · 操作员 ${OPERATOR}`;
  $("#mSubmit").className = def.danger ? "danger" : "";
  $("#mFields").innerHTML = def.fields.map((f) => {
    const lab = `<label>${esc(f.label)}${f.req ? ' <span class="req">*</span>' : ""}</label>`;
    if (f.type === "select") return `<div class="f">${lab}<select data-f="${f.name}">${f.options.map((o) => `<option>${o}</option>`).join("")}</select></div>`;
    return `<div class="f">${lab}<input data-f="${f.name}" type="${f.type}" /></div>`;
  }).join("") || `<div class="muted">确认执行该操作？</div>`;
  scrim.classList.add("on");
}
function closeModal() { scrim.classList.remove("on"); pending = null; $("#mFields").innerHTML = ""; }

async function submitAction() {
  if (!pending) return;
  if (pending.perms) return submitNewOperator();
  const v = {}; let missing = false;
  $("#mFields").querySelectorAll("[data-f]").forEach((el) => {
    v[el.dataset.f] = typeof el.value === "string" ? el.value.trim() : el.value;
    const def = pending.fields.find((f) => f.name === el.dataset.f);
    if (def?.req && !v[el.dataset.f]) missing = true;
  });
  if (missing) { toast("err", "缺必填", "请填写 * 字段"); return; }
  $("#mSubmit").disabled = true;
  try {
    const res = await api("/api/action", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(pending.build(v)) });
    if (res && res.pendingApproval) {
      toast("ok", pending.title, "已提交审批，待复核");
    } else {
      toast("ok", pending.title, "成功 · 已留审计");
    }
    closeModal();
    await lookup();
  } catch (e) { toast("err", pending.title + "失败", e.message); }
  finally { $("#mSubmit").disabled = false; }
}

// perms (超管 CRUD operators/roles)
let ROLES = [];
async function loadPerms() {
  try {
    const [ops, roles] = await Promise.all([api("/api/operators"), api("/api/roles")]);
    ROLES = roles;
    $("#opCount").textContent = ops.length;
    $("#opRows").innerHTML = ops.length
      ? ops.map((o) => {
          const scope = (o.scopeSites || []).join(", ") || "—";
          const toggle = o.status === "active"
            ? `<button class="danger sm" data-op-disable="${esc(o.id)}">禁用</button>`
            : `<button class="sec sm" data-op-enable="${esc(o.id)}">启用</button>`;
          return `<tr><td>${esc(o.email)}</td><td>${esc(o.roleKey)}</td><td>${esc(scope)}</td><td>${stat(o.status)}</td><td>${toggle}</td></tr>`;
        }).join("")
      : `<tr><td colspan="5" class="empty">无 operator</td></tr>`;
    $("#roleCount").textContent = roles.length;
    $("#roleRows").innerHTML = roles.length
      ? roles.map((r) => `<tr><td>${esc(r.key)}</td><td>${esc(r.name)}</td><td>${esc((r.permissions || []).join(" "))}</td></tr>`).join("")
      : `<tr><td colspan="3" class="empty">无角色</td></tr>`;
    $("#opRows").querySelectorAll("[data-op-disable]").forEach((b) => b.onclick = () => setOpStatus(b.dataset.opDisable, "disabled"));
    $("#opRows").querySelectorAll("[data-op-enable]").forEach((b) => b.onclick = () => setOpStatus(b.dataset.opEnable, "active"));
  } catch (e) { toast("err", "权限管理", e.message); }
}

async function setOpStatus(id, status) {
  try {
    await api("/api/operators/" + encodeURIComponent(id) + "/status", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ status }) });
    toast("ok", "操作员", status === "active" ? "已启用" : "已禁用");
    await loadPerms();
  } catch (e) { toast("err", "状态更新失败", e.message); }
}

function openNewOperator() {
  pending = { perms: true, title: "新建 operator" };
  $("#mTitle").textContent = "新建 operator";
  $("#mCtx").textContent = "运营账号；scopeSites 用逗号分隔，* 表示跨租户。";
  $("#mSubmit").className = "";
  const roleOpts = ROLES.map((r) => `<option value="${esc(r.key)}">${esc(r.name)} · ${esc(r.key)}</option>`).join("");
  $("#mFields").innerHTML = `
    <div class="f"><label>email <span class="req">*</span></label><input data-pf="email" type="text" /></div>
    <div class="f"><label>displayName <span class="req">*</span></label><input data-pf="displayName" type="text" /></div>
    <div class="f"><label>角色 <span class="req">*</span></label><select data-pf="roleKey">${roleOpts}</select></div>
    <div class="f"><label>scopeSites（逗号分隔）<span class="req">*</span></label><input data-pf="scopeSites" type="text" placeholder="site-demo, site-x  或  *" /></div>`;
  scrim.classList.add("on");
}

async function submitNewOperator() {
  const v = {};
  $("#mFields").querySelectorAll("[data-pf]").forEach((el) => { v[el.dataset.pf] = el.value.trim(); });
  if (!v.email || !v.displayName || !v.roleKey || !v.scopeSites) { toast("err", "缺必填", "请填写 * 字段"); return; }
  const scopeSites = v.scopeSites.split(",").map((s) => s.trim()).filter(Boolean);
  if (!scopeSites.length) { toast("err", "缺作用域", "至少一个 site，或填 *"); return; }
  $("#mSubmit").disabled = true;
  try {
    await api("/api/operators", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: v.email, displayName: v.displayName, roleKey: v.roleKey, scopeSites }) });
    toast("ok", "新建 operator", "成功");
    closeModal();
    await loadPerms();
  } catch (e) { toast("err", "新建失败", e.message); }
  finally { $("#mSubmit").disabled = false; }
}

async function loadDocs() {
  try {
    const mods = await api("/api/manifests");
    $("#docsRows").innerHTML = mods.map((m) => `<tr><td>${esc(m.id)}</td><td>${m.online ? '<span class="st ok">online</span>' : '<span class="st error">offline</span>'}</td><td>${m.online ? `<a href="${esc(m.baseUrl)}/docs/json" target="_blank" rel="noopener">${esc(m.baseUrl)}/docs/json</a>` : "—"}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">无模块</td></tr>`;
  } catch (e) { toast("err", "文档", e.message); }
}

async function loadApprovals() {
  if (!SITE) { $("#approvalRows").innerHTML = `<tr><td colspan="7" class="empty">先选站点</td></tr>`; return; }
  try {
    const rows = await api("/api/approvals?" + new URLSearchParams({ siteId: SITE, status: "pending" }));
    $("#approvalRows").innerHTML = rows.length
      ? rows.map((r) => {
          const mine = ME && r.requestedByEmail === ME.email;
          const target = esc(r.actionId === "refund" && r.params ? (r.params.id || "") : (r.siteId || ""));
          const act = mine
            ? `<span class="muted">本人提交</span>`
            : `<button class="sm" data-approve="${esc(r.id)}">批准</button> <button class="danger sm" data-reject="${esc(r.id)}">驳回</button>`;
          return `<tr><td>${fmtTime(r.requestedAt)}</td><td>${esc(r.requestedByEmail)}</td><td>${esc(r.moduleId)}.${esc(r.actionId)}</td><td>${target}</td><td class="muted">${esc(r.reason || "")}</td><td>${stat(r.status)}</td><td>${act}</td></tr>`;
        }).join("")
      : `<tr><td colspan="7" class="empty">无待审批</td></tr>`;
    $("#approvalRows").querySelectorAll("[data-approve]").forEach((b) => b.onclick = () => decideApproval(b.dataset.approve, "approve"));
    $("#approvalRows").querySelectorAll("[data-reject]").forEach((b) => b.onclick = () => decideApproval(b.dataset.reject, "reject"));
  } catch (e) { toast("err", "审批", e.message); }
}

async function decideApproval(id, kind) {
  try {
    const body = kind === "reject" ? JSON.stringify({}) : JSON.stringify({});
    const res = await api("/api/approvals/" + encodeURIComponent(id) + "/" + kind, { method: "POST", headers: { "content-type": "application/json" }, body });
    toast("ok", kind === "approve" ? "批准" : "驳回", res && res.status ? ("→ " + res.status) : "已处理");
    await loadApprovals();
  } catch (e) { toast("err", kind === "approve" ? "批准失败" : "驳回失败", e.message); }
}

// nav
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
  const tab = t.dataset.tab;
  ["desk", "approvals", "audit", "perms", "docs"].forEach((id) => $("#" + id).classList.toggle("hide", tab !== id));
  if (tab === "approvals") loadApprovals();
  if (tab === "audit") loadAudit();
  if (tab === "perms") loadPerms();
  if (tab === "docs") loadDocs();
});
async function loadMe() {
  try { ME = await api("/api/me"); } catch (e) { ME = null; toast("err", "身份", e.message); }
}
function applyVisibility() {
  $("#tabApprovals").classList.toggle("hide", !can("approval.read"));
  $("#tabAudit").classList.toggle("hide", !can("audit.read"));
  $("#tabPerms").classList.toggle("hide", !can("operator.manage"));
}
async function reloadContext() {
  await loadMe();
  await loadSites();
  applyVisibility();
  CURRENT = null;
  $("#result").innerHTML = `<div class="empty">选站点 + 填 owner，点查账。</div>`;
}

$("#site").onchange = (e) => { SITE = e.target.value; if (CURRENT) lookup(); };
$("#operator").onchange = async (e) => { OPERATOR = e.target.value; await reloadContext(); };
$("#lookup").onclick = lookup;
$("#ownerId").addEventListener("keydown", (e) => { if (e.key === "Enter") lookup(); });
$("#auditReload").onclick = loadAudit;
$("#approvalsReload").onclick = loadApprovals;
$("#permsReload").onclick = loadPerms;
$("#newOp").onclick = openNewOperator;
$("#mCancel").onclick = closeModal;
$("#mSubmit").onclick = submitAction;
scrim.addEventListener("click", (e) => { if (e.target === scrim) closeModal(); });

(async () => {
  await loadOperators();
  OPERATOR = $("#operator").value;
  await reloadContext();
})();
</script>
</body>
</html>
