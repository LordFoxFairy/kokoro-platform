<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kokoro 平台后台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14171c;
        --ink-2: #1b1f27;
        --ink-line: #2b313c;
        --paper: #f4f1ea;
        --paper-2: #fbf9f4;
        --paper-line: #e3ddd0;
        --text: #20242b;
        --muted: #6a7180;
        --muted-2: #9aa0ab;
        --accent: #0f8f78;
        --accent-soft: #d7efe8;
        --amber: #c9831f;
        --rose: #c0473f;
        --slate: #5b6472;
        --on-ink: #e9ece f;
        --on-ink: #e9ecef;
        --on-ink-dim: #9aa3b2;
        --radius: 12px;
        --shadow: 0 1px 0 rgba(0, 0, 0, 0.02), 0 18px 40px -28px rgba(20, 23, 28, 0.45);
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --sans: "Noto Sans SC", system-ui, sans-serif;
        --display: "Bricolage Grotesque", "Noto Sans SC", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--sans);
        color: var(--text);
        background: var(--paper);
        display: grid;
        grid-template-columns: 268px 1fr;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- Sidebar ---------- */
      .side {
        background:
          radial-gradient(120% 60% at 0% 0%, #1f2632 0%, transparent 60%),
          linear-gradient(180deg, #171b22 0%, #12151b 100%);
        color: var(--on-ink);
        border-right: 1px solid #0c0e12;
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: sticky;
        top: 0;
        overflow-y: auto;
      }
      .brand {
        padding: 22px 22px 16px;
        border-bottom: 1px solid var(--ink-line);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand .mark {
        width: 34px; height: 34px; border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), #16b89b);
        display: grid; place-items: center;
        font-family: var(--display); font-weight: 800; color: #04231d; font-size: 18px;
        box-shadow: 0 6px 18px -8px rgba(15, 143, 120, 0.8);
      }
      .brand h1 {
        font-family: var(--display); font-weight: 700; font-size: 17px; margin: 0; letter-spacing: 0.2px;
      }
      .brand .sub { font-size: 11px; color: var(--on-ink-dim); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }

      .nav { padding: 10px 12px 24px; flex: 1; }
      .mod { margin: 14px 0 6px; }
      .mod-head {
        display: flex; align-items: center; gap: 9px;
        padding: 6px 10px; color: var(--on-ink-dim);
        font-size: 11.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      }
      .mod-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(15,143,120,0.18); }
      .mod-head.off .dot { background: #5b6472; box-shadow: none; }
      .mod-head .off-tag { margin-left: auto; font-size: 10px; color: #6f7787; text-transform: none; letter-spacing: 0; }
      .res {
        display: flex; align-items: center; justify-content: space-between;
        width: 100%; text-align: left; cursor: pointer;
        background: transparent; border: 0; color: #c4cad6;
        font-family: var(--sans); font-size: 13.5px;
        padding: 8px 12px 8px 28px; border-radius: 9px; margin: 1px 0;
        transition: background 0.15s, color 0.15s;
      }
      .res:hover { background: rgba(255,255,255,0.05); color: #fff; }
      .res.active { background: var(--accent); color: #04231d; font-weight: 600; }
      .res .count { font-family: var(--mono); font-size: 11px; color: var(--on-ink-dim); }
      .res.active .count { color: #0a3a30; }

      /* ---------- Main ---------- */
      .main { height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
      .topbar {
        position: sticky; top: 0; z-index: 5;
        background: rgba(244,241,234,0.82); backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--paper-line);
        padding: 16px 30px;
        display: flex; align-items: baseline; gap: 14px;
      }
      .crumb { font-size: 12px; color: var(--muted); letter-spacing: 0.3px; }
      .crumb b { color: var(--text); }
      .topbar h2 { font-family: var(--display); font-weight: 700; font-size: 23px; margin: 0; }
      .rowchip {
        margin-left: auto; font-family: var(--mono); font-size: 12px;
        color: var(--accent); background: var(--accent-soft);
        padding: 4px 11px; border-radius: 999px; border: 1px solid #bfe4da;
      }
      .content { padding: 26px 30px 60px; }

      .card {
        background: var(--paper-2); border: 1px solid var(--paper-line);
        border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
      }
      .tablewrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      thead th {
        position: sticky; top: 0;
        text-align: left; font-weight: 700; color: var(--slate);
        font-size: 11.5px; letter-spacing: 0.5px;
        padding: 13px 16px; background: #efeae0; border-bottom: 1px solid var(--paper-line);
        white-space: nowrap;
      }
      tbody td { padding: 12px 16px; border-bottom: 1px solid #eee8db; vertical-align: top; }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: #f3eee3; }
      td.mono, th.mono { font-family: var(--mono); font-size: 12px; color: #3a4150; }
      td.id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
      td.num { font-family: var(--mono); text-align: right; }

      .badge {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
        border: 1px solid transparent;
      }
      .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .badge.active { color: #0f8f78; background: #def0ea; border-color: #c2e6dc; }
      .badge.disabled, .badge.canceled, .badge.failed, .badge.down { color: #b14a43; background: #f6e1df; border-color: #eccbc7; }
      .badge.pending, .badge.received, .badge.degraded, .badge.recorded, .badge.unknown, .badge.draft { color: #a9781d; background: #f6ecd6; border-color: #ecdcb6; }
      .badge.paid, .badge.captured, .badge.settled, .badge.processed, .badge.succeeded, .badge.healthy, .badge.released { color: #2f7d4f; background: #e0efe2; border-color: #c8e2cd; }

      .state { padding: 60px 20px; text-align: center; color: var(--muted); }
      .state .big { font-family: var(--display); font-size: 20px; color: var(--text); margin-bottom: 6px; }
      .state.err .big { color: var(--rose); }
      .spinner {
        width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 16px;
        border: 3px solid var(--paper-line); border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .reveal { animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      @media (max-width: 820px) {
        body { grid-template-columns: 1fr; }
        .side { position: static; height: auto; }
        .main { height: auto; }
      }
    </style>
  </head>
  <body>
    <aside class="side">
      <div class="brand">
        <div class="mark">K</div>
        <div>
          <h1>Kokoro 平台后台</h1>
          <div class="sub">Platform Console</div>
        </div>
      </div>
      <nav class="nav" id="nav"><div class="state"><div class="spinner"></div>加载模块…</div></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="crumb" id="crumb">平台后台</div>
          <h2 id="title">概览</h2>
        </div>
        <span class="rowchip" id="rowchip" hidden></span>
      </header>
      <section class="content" id="content">
        <div class="state"><div class="big">选择左侧资源查看数据</div>统一查看 站点 / 用户 / 模型 / 积分 / 支付 各模块的数据。</div>
      </section>
    </main>

    <script>
      // labelKey / 字段 → 中文（找不到则人性化兜底，绝不直接甩 key）
      const MODULE_CN = { site: "站点", user: "用户", model: "模型", credit: "积分", payment: "支付" };
      const RES_CN = {
        "admin.site.resources.sites": "站点", "admin.site.resources.domains": "域名",
        "admin.site.resources.apps": "应用", "admin.site.resources.policies": "策略",
        "admin.user.resources.users": "用户", "admin.user.resources.teams": "团队",
        "admin.user.resources.memberships": "成员关系", "admin.user.resources.serviceAccounts": "服务账号",
        "admin.model.resources.providerAccounts": "Provider 账号", "admin.model.resources.modelBindings": "模型绑定",
        "admin.model.resources.modelLabels": "模型标签",
        "admin.credit.resources.accounts": "积分账户", "admin.credit.resources.ledgerEntries": "账本流水",
        "admin.credit.resources.usageRecords": "用量记录", "admin.credit.resources.pricingRules": "计价规则",
        "admin.payment.resources.plans": "套餐", "admin.payment.resources.orders": "订单",
        "admin.payment.resources.subscriptions": "订阅", "admin.payment.resources.paymentEvents": "支付事件",
        "admin.payment.resources.refunds": "退款",
      };
      const FIELD_CN = {
        id: "ID", createdAt: "创建时间", updatedAt: "更新时间", status: "状态",
        ownerKind: "归属类型", ownerId: "归属 ID", balanceMicros: "余额", heldMicros: "冻结",
        amountMicros: "金额", balanceAfterMicros: "余额(后)", reason: "原因", idempotencyKey: "幂等键",
        requestId: "请求 ID", featureKey: "能力键", modelBindingId: "模型绑定", unit: "单位",
        labelKey: "标签键", effectiveFrom: "生效起", effectiveUntil: "生效止",
        key: "标识", name: "名称", currency: "币种", amountMinor: "金额(分)", creditMicros: "授予积分",
        billingInterval: "计费周期", teamId: "团队 ID", planId: "套餐 ID", provider: "供应商",
        eventId: "事件 ID", eventType: "事件类型", payload: "负载", expiresAt: "过期时间",
        externalUserId: "外部用户 ID", email: "邮箱", displayName: "显示名", avatarUrl: "头像",
        userId: "用户 ID", role: "角色", slug: "标识串", type: "类型", ownerUserId: "拥有者",
        tokenPrefix: "Token 前缀", lastUsedAt: "最近使用",
        modelName: "模型名", gatewayModelName: "网关模型", transportKind: "传输方式",
        healthStatus: "健康", priority: "优先级", secretRef: "密钥引用", label: "标签",
        inputModalities: "输入模态", outputModalities: "输出模态", labelKeys: "标签", contextWindow: "上下文窗口",
        host: "域名", canonicalHost: "规范域名", isPrimary: "主域名", appKey: "应用键",
        surface: "界面", defaultRoute: "默认路由", value: "值", metadata: "元数据", tier: "档位",
        defaultBindingId: "默认绑定", periodStart: "周期起", periodEnd: "周期止",
      };
      const STATUS_FIELDS = new Set(["status", "healthStatus"]);
      const AMOUNT_HINT = /(Micros|Minor)$/;

      function humanize(k) {
        const seg = String(k).split(".").pop();
        return seg.replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase());
      }
      const resName = (lk) => RES_CN[lk] || humanize(lk);
      const fieldName = (f) => FIELD_CN[f] || humanize(f);

      function fmt(field, v) {
        if (v === null || v === undefined) return '<span style="color:var(--muted-2)">—</span>';
        if (STATUS_FIELDS.has(field) && typeof v === "string")
          return `<span class="badge ${v}">${v}</span>`;
        if (typeof v === "boolean") return `<span class="badge ${v ? "active" : "disabled"}">${v ? "是" : "否"}</span>`;
        if ((field === "createdAt" || field === "updatedAt" || /At$/.test(field)) && typeof v === "string" && v.includes("T")) {
          const d = new Date(v); if (!isNaN(d)) return `<span class="mono">${d.toLocaleString("zh-CN", { hour12: false })}</span>`;
        }
        if (Array.isArray(v)) return v.length ? v.map((x) => `<code>${esc(String(x))}</code>`).join(" ") : '<span style="color:var(--muted-2)">[]</span>';
        if (typeof v === "object") return `<span class="mono" title="${esc(JSON.stringify(v))}">${esc(JSON.stringify(v)).slice(0, 60)}</span>`;
        const s = String(v);
        if (AMOUNT_HINT.test(field)) return `<span class="num">${esc(Number(s).toLocaleString())}</span>`;
        if (field === "id" || /Id$/.test(field) || field === "idempotencyKey") return `<span class="id">${esc(s)}</span>`;
        return esc(s);
      }
      function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

      let CURRENT = null;
      async function loadNav() {
        const nav = document.getElementById("nav");
        try {
          const res = await fetch("/api/manifests");
          const body = await res.json();
          const mods = body.data || body;
          nav.innerHTML = "";
          mods.forEach((m) => {
            const online = !!m.manifest;
            const wrap = document.createElement("div");
            wrap.className = "mod";
            const head = document.createElement("div");
            head.className = "mod-head" + (online ? "" : " off");
            head.innerHTML = `<span class="dot"></span>${MODULE_CN[m.id] || m.label || m.id}` +
              (online ? "" : `<span class="off-tag">离线</span>`);
            wrap.appendChild(head);
            (m.manifest?.resources || []).forEach((r) => {
              const b = document.createElement("button");
              b.className = "res";
              b.innerHTML = `<span>${resName(r.labelKey)}</span>`;
              b.onclick = () => selectResource(m, r, b);
              wrap.appendChild(b);
            });
            nav.appendChild(wrap);
          });
          if (!mods.some((m) => m.manifest))
            nav.innerHTML = `<div class="state err"><div class="big">模块都离线</div>启动各平台服务后刷新。</div>`;
        } catch (e) {
          nav.innerHTML = `<div class="state err"><div class="big">连不上网关</div>${esc(String(e))}</div>`;
        }
      }

      async function selectResource(m, r, btn) {
        document.querySelectorAll(".res.active").forEach((x) => x.classList.remove("active"));
        btn.classList.add("active");
        CURRENT = { m, r };
        document.getElementById("crumb").innerHTML = `${MODULE_CN[m.id] || m.label} <b>/</b> 资源`;
        document.getElementById("title").textContent = resName(r.labelKey);
        const chip = document.getElementById("rowchip");
        chip.hidden = true;
        const content = document.getElementById("content");
        content.innerHTML = `<div class="state"><div class="spinner"></div>加载数据…</div>`;
        try {
          const res = await fetch(`/api/resource?moduleId=${encodeURIComponent(m.id)}&route=${encodeURIComponent(r.route)}`);
          const body = await res.json();
          if (!res.ok) throw new Error(body?.error?.message || `HTTP ${res.status}`);
          const rows = body.data || body;
          renderTable(rows);
        } catch (e) {
          content.innerHTML = `<div class="state err"><div class="big">加载失败</div>${esc(String(e.message || e))}</div>`;
        }
      }

      function renderTable(rows) {
        const content = document.getElementById("content");
        const chip = document.getElementById("rowchip");
        chip.hidden = false; chip.textContent = `${rows.length} 行`;
        if (!rows.length) {
          content.innerHTML = `<div class="card reveal"><div class="state"><div class="big">暂无数据</div>该资源当前没有记录。</div></div>`;
          return;
        }
        const cols = [];
        rows.forEach((row) => Object.keys(row).forEach((k) => { if (!cols.includes(k)) cols.push(k); }));
        const ordered = cols.sort((a, b) => {
          const pa = a === "id" ? -2 : /At$/.test(a) ? 2 : 0;
          const pb = b === "id" ? -2 : /At$/.test(b) ? 2 : 0;
          return pa - pb;
        });
        const thead = ordered.map((c) => `<th${AMOUNT_HINT.test(c) ? ' class="num"' : ""}>${fieldName(c)}</th>`).join("");
        const tbody = rows
          .map((row) => `<tr>${ordered.map((c) => `<td${AMOUNT_HINT.test(c) ? ' class="num"' : ""}>${fmt(c, row[c])}</td>`).join("")}</tr>`)
          .join("");
        content.innerHTML = `<div class="card reveal"><div class="tablewrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div></div>`;
      }

      loadNav();
    </script>
  </body>
</html>
