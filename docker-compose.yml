services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: kokoro_root
      MYSQL_DATABASE: kokoro
      MYSQL_USER: kokoro
      MYSQL_PASSWORD: kokoro
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ukokoro -pkokoro --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - kokoro-platform-mysql:/var/lib/mysql

  # 能力中台(kokoro-hub)基建:Mongo 元数据库 + MinIO 包体存储(dev 口径 27017/9100)。
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1})'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - kokoro-platform-mongo:/data/db

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: kokoro
      MINIO_ROOT_PASSWORD: kokoro-secret
    command: ["server", "/data", "--address", ":9100"]
    ports:
      - "9100:9100"
    volumes:
      - kokoro-platform-minio:/data

volumes:
  kokoro-platform-mysql:
  kokoro-platform-mongo:
  kokoro-platform-minio:
