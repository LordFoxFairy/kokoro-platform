# Dev 档网关配置：零真实凭据可跑（mock 模型），用于本地 Model Gateway LiteLLM 档 smoke。
# 真实 provider 接入请以 litellm.config.example.yaml 为模板另起部署档，勿在 dev 档填真 key。
model_list:
  # 稳定网关名：与 Model Control 为 adapterKind `litellm` 发布的 gatewayModel 对齐。
  - model_name: kokoro-dev-mock
    litellm_params:
      model: openai/gpt-4o-mini
      # litellm 内建 mock：不出网、不要 key，恒回固定文本——网关链路 smoke 专用。
      mock_response: "kokoro litellm dev mock response"
      api_key: example-not-used

  # 对外别名 claude-code -> 单个显式选择的 OpenAI-compatible 后端。model/base/key 全由
  # 启动前配置注入；LiteLLM 运行期间不跨 adapter 或模型静默 fallback。
  - model_name: claude-code
    litellm_params:
      model: os.environ/CLAUDE_CODE_MODEL
      api_base: os.environ/CLAUDE_CODE_BASE_URL
      api_key: os.environ/CLAUDE_CODE_API_KEY

litellm_settings:
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
