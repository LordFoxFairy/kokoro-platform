# `model_name` is the stable gateway name used by Kokoro.
# It must match `kokoro-model` ModelBinding.gatewayModelName.
model_list:
  - model_name: kokoro-openai-gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: kokoro-anthropic-claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: kokoro-openai-compatible
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: os.environ/OPENAI_COMPAT_BASE_URL
      api_key: os.environ/OPENAI_COMPAT_API_KEY

litellm_settings:
  # Keep client-specific unsupported params from breaking provider calls.
  drop_params: true
  # Example config should not emit telemetry by default.
  telemetry: false

general_settings:
  # Do not commit real keys. Set this in .env or secret manager.
  master_key: os.environ/LITELLM_MASTER_KEY
