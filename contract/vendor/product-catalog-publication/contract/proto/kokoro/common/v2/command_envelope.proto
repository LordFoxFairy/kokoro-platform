syntax = "proto3";

package kokoro.common.v2;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v1/error.proto";

// This V2 type is intentionally separate from kokoro.common.v1.CommandDigestAlgorithm. V1 hashes
// only a method Effect and remains byte-frozen for already published AdminAuth and Admission
// consumers. New privileged commands must not represent this algorithm with a V1 enum value.
enum CommandDigestAlgorithmV2 {
  COMMAND_DIGEST_ALGORITHM_V2_UNSPECIFIED = 0;
  // SHA-256(UTF8(type_name) || NUL || deterministic known-field protobuf bytes) where type_name is
  // kokoro.common.v2.CanonicalCommandEnvelopeV2. Command id, idempotency key, request digest and
  // unknown fields are deliberately absent. The shared helper sorts security epochs by axis and
  // target refs lexicographically, rejects duplicates, and rejects present-but-empty optional axes.
  COMMAND_DIGEST_ALGORITHM_V2_SHA256_COMMAND_ENVELOPE = 1;
}

// One vocabulary is shared by the authenticated operator context and the canonical trust axes so
// an implementation cannot reinterpret assurance through a transport-specific string or boolean.
enum OperatorAssuranceLevel {
  OPERATOR_ASSURANCE_LEVEL_UNSPECIFIED = 0;
  OPERATOR_ASSURANCE_LEVEL_PASSWORD = 1;
  OPERATOR_ASSURANCE_LEVEL_MFA = 2;
  OPERATOR_ASSURANCE_LEVEL_PHISHING_RESISTANT = 3;
}

message CanonicalTypedProtobufV2 {
  string type_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // Deterministic protobuf bytes with unknown fields discarded. Empty bytes are valid for an
  // empty typed message and remain unambiguous because type_name is mandatory.
  bytes known_field_protobuf = 2 [(buf.validate.field).bytes.max_len = 1048576];
}

message CanonicalSecurityEpochV2 {
  string axis = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint64 value = 2;
}

message CanonicalCommandTrustAxesV2 {
  // Optional means the boundary has no such axis. A present empty value is invalid. Boundary
  // wrappers must require every axis their typed request/security context promises; the common
  // helper never infers an omitted value from another field or from runtime reflection.
  optional string workload_identity_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string audience = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string environment = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string site_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  optional string actor_ref = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  optional string actor_session_ref = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  optional string managed_device_ref = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated CanonicalSecurityEpochV2 security_epochs = 9 [(buf.validate.field).repeated.max_items = 32];
  optional uint64 actor_generation = 10 [(buf.validate.field).uint64.gt = 0];
  optional OperatorAssuranceLevel assurance_level = 11 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // Canonicalization sorts these values and rejects duplicates before digesting.
  repeated string factor_classes = 12 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  optional google.protobuf.Timestamp authenticated_at = 13;
  optional google.protobuf.Timestamp step_up_at = 14;
  optional string operator_attestation_ref = 15 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string operator_attestation_digest = 16 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

message CanonicalCommandEnvelopeV2 {
  string contract_version = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string operation = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CanonicalCommandTrustAxesV2 trust = 3 [(buf.validate.field).required = true];
  optional CanonicalTypedProtobufV2 scope = 4;
  // Target refs are authority bindings, not an ordered business payload. The helper sorts them;
  // any semantically ordered target collection remains in the typed Effect bytes.
  repeated string target_refs = 5 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  CanonicalTypedProtobufV2 effect = 6 [(buf.validate.field).required = true];
}

message CommandIdentityV2 {
  string command_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string idempotency_key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  CommandDigestAlgorithmV2 digest_algorithm = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string request_digest = 4 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

enum CommandReceiptStateV2 {
  COMMAND_RECEIPT_STATE_V2_UNSPECIFIED = 0;
  COMMAND_RECEIPT_STATE_V2_ACCEPTED = 1;
  COMMAND_RECEIPT_STATE_V2_COMMITTED = 2;
  COMMAND_RECEIPT_STATE_V2_REJECTED = 3;
  COMMAND_RECEIPT_STATE_V2_OUTCOME_UNKNOWN = 4;
}

message CommandReceiptV2 {
  CommandIdentityV2 identity = 1 [(buf.validate.field).required = true];
  string operation = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CommandReceiptStateV2 state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  google.protobuf.Timestamp recorded_at = 4 [(buf.validate.field).required = true];
  optional kokoro.common.v1.KokoroErrorDetail error = 5;
}
