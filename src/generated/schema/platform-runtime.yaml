# Platform runtime APIs consumed by Session. Root contract is the cross-repository truth;
# generated mirrors are committed in both independent repositories.
enums:
  model_transport_kind: [litellm, direct, internal]

objects:
  - name: UsageHoldRequest
    fields:
      # Site is the Platform business isolation boundary. It travels in the body so the
      # owner can persist and enforce it, rather than trusting hop-level metadata.
      - {name: siteId, type: string_nonempty}
      - {name: namespace, type: string_nonempty}
      - {name: featureKey, type: string_nonempty}
      - {name: labelKey, type: string_nonempty, optional: true}
      - {name: idempotencyKey, type: string_nonempty}
      - {name: modelBindingId, type: string_nonempty, optional: true}
      - {name: requestId, type: string_nonempty, optional: true}
  - name: UsageSettleUsage
    fields:
      - {name: inputTokens, type: nonnegative_int}
      - {name: outputTokens, type: nonnegative_int}
  - name: UsageSettleRequest
    fields:
      - {name: siteId, type: string_nonempty}
      - {name: holdId, type: string_nonempty}
      - {name: usage, type: object:UsageSettleUsage}
      - {name: idempotencyKey, type: string_nonempty}
  - name: ReleaseCreditRequest
    fields:
      - {name: siteId, type: string_nonempty}
      - {name: holdId, type: string_nonempty}
      - {name: idempotencyKey, type: string_nonempty}
  - name: ResolveModelBindingsQuery
    fields:
      # Required so resolution cannot silently fall back to an unfiltered catalogue:
      # an absent site previously disabled the per-site hide list entirely, letting the
      # caller choose whether Site policy applied.
      - {name: siteId, type: string_nonempty}
      - {name: featureKey, type: string_nonempty}
      - {name: labelKey, type: string_nonempty, optional: true}
      - {name: transportKind, type: enum:model_transport_kind, optional: true}
  - name: ListModelLabelsQuery
    fields:
      # Required for the same reason as resolution, and it must be the same value: the
      # catalogue and the resolver have to agree about a Site's hidden labels. An
      # unscoped catalogue offers labels the Site hid, which only fail once selected.
      - {name: siteId, type: string_nonempty}
      - {name: featureKey, type: string_nonempty, optional: true}
  - name: ResolvedModelBinding
    fields:
      - {name: id, type: string_nonempty}
      - {name: transportKind, type: enum:model_transport_kind}
      - {name: gatewayModelName, type: string_nonempty, nullable: true}
  - name: ModelLabelCatalogItem
    fields:
      - {name: key, type: string_nonempty}
      - {name: displayName, type: string_nonempty}
