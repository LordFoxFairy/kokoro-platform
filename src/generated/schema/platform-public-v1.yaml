      additionalProperties: false
      properties:
        entryRef: *memoryEntryRefSchema
        state:
          type: string
          const: purged
        purgeReceiptRef:
          type: string
          minLength: 3
          maxLength: 128
        purgedAt:
          type: string
          format: date-time
      required: [entryRef, state, purgeReceiptRef, purgedAt]
    MemoryEntryView:
      description: >-
        Current owner projection of one stable entry identity. An entryRef is never reused after
        logical revocation or physical purge.
      discriminator:
        propertyName: state
        mapping:
          active: '#/components/schemas/MemoryEntryActiveView'
          revoked_purge_pending: '#/components/schemas/MemoryEntryRevokedView'
          purged: '#/components/schemas/MemoryEntryPurgedView'
      oneOf:
        - $ref: '#/components/schemas/MemoryEntryActiveView'
        - $ref: '#/components/schemas/MemoryEntryRevokedView'
        - $ref: '#/components/schemas/MemoryEntryPurgedView'
    MemoryOwnerSnapshot:
      type: object
      additionalProperties: false
      description: >-
        Opaque owner-issued list snapshot. snapshotRef is bound to the authenticated personal
        Memory space, normalized filters, ordering, spaceVersion, and a bounded expiry. Every
        mutation that can change a public entry's content/current revision, priority, active
        membership, revocation or reset state advances spaceVersion. A continuation cursor is
        valid only while the owner remains at this exact version.
      properties:
        snapshotRef:
          type: string
          minLength: 3
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,255}$'
        spaceVersion:
          $ref: '#/components/schemas/PositiveUint64String'
      required: [snapshotRef, spaceVersion]
    MemoryEntryPage:
      type: object
      additionalProperties: false
      x-kokoro-continuation-requires-same-owner-snapshot: true
      x-kokoro-stale-owner-snapshot-rejected: true
      description: >-
        The first page creates ownerSnapshot. Every continuation returns the identical snapshotRef
        and spaceVersion. If the owner version changed, the cursor is rejected instead of serving
        an old snapshot; callers restart from a new first page.
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MemoryEntryActiveView'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
        ownerSnapshot:
          $ref: '#/components/schemas/MemoryOwnerSnapshot'
      required: [items, pageInfo, ownerSnapshot]
    MemoryEntryResponse:
      type: object
      additionalProperties: false
      properties:
        entry:
          $ref: '#/components/schemas/MemoryEntryView'
        observedSpaceVersion:
          description: Owner space version at which this current entry projection was authorized.
          $ref: '#/components/schemas/PositiveUint64String'
      required: [entry, observedSpaceVersion]
    MemoryRevisionAvailableView:
      type: object
      additionalProperties: false
      properties:
        revisionRef: *memoryRevisionRefSchema
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        state:
          type: string
          const: available
        reason:
          type: string
          enum: [explicit, corrected, imported, restored]
        content:
          type: string
          minLength: 1
          maxLength: 16384
          x-kokoro-max-utf8-bytes: 16384
        supersedesRevisionRef:
          $ref: '#/components/schemas/MemoryNullableRevisionRef'
        validFrom:
          type: [string, 'null']
          format: date-time
        validTo:
          type: [string, 'null']
          format: date-time
        recordedAt:
          type: string
          format: date-time
        restorable:
          type: boolean
      required:
        - revisionRef
        - revision
        - state
        - reason
        - content
        - supersedesRevisionRef
        - validFrom
        - validTo
        - recordedAt
        - restorable
    MemoryNullableRevisionRef:
      type: [string, 'null']
      minLength: 3
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    MemoryRevisionPurgedView:
      type: object
      additionalProperties: false
      properties:
        revisionRef: *memoryRevisionRefSchema
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        state:
          type: string
          const: purged
        reason:
          type: string
          enum: [explicit, corrected, imported, restored]
        recordedAt:
          type: string
          format: date-time
        restorable:
          type: boolean
          const: false
      required: [revisionRef, revision, state, reason, recordedAt, restorable]
    MemoryRevisionView:
      discriminator:
        propertyName: state
        mapping:
          available: '#/components/schemas/MemoryRevisionAvailableView'
          purged: '#/components/schemas/MemoryRevisionPurgedView'
      oneOf:
        - $ref: '#/components/schemas/MemoryRevisionAvailableView'
        - $ref: '#/components/schemas/MemoryRevisionPurgedView'
    MemoryEntryHistoryPage:
      type: object
      additionalProperties: false
      x-kokoro-immutable-history: true
      x-kokoro-continuation-requires-same-owner-snapshot: true
      x-kokoro-stale-owner-snapshot-rejected: true
      description: >-
        Revision identities and lineage are append-only, while the public availability of revision
        payloads may still change after forget, reset, or purge. The first page creates
        ownerSnapshot and every continuation returns the identical snapshotRef and spaceVersion.
        If the owner version changed, the cursor is rejected instead of returning an older plaintext
        projection. Restoring an available payload always appends a new current revision; it never
        mutates an existing revision or rewinds the current head.
      properties:
        entryRef: *memoryEntryRefSchema
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MemoryRevisionView'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
        ownerSnapshot:
          $ref: '#/components/schemas/MemoryOwnerSnapshot'
      required: [entryRef, items, pageInfo, ownerSnapshot]
    MemoryPurgeState:
      type: string
      enum: [revoked_purge_pending, purged]
    MemoryArtifactDownloadRequest:
      type: object
      additionalProperties: false
      description: >-
        Non-bearer Artifact authorization request identity. It is safe to repeat in status and command
        recovery, grants no byte access, and must be exchanged under the current Site workload and user
        session for a fresh short-lived Artifact delivery authorization.
      properties:
        artifactRef: *artifactRefSchema
        artifactVersionRef: *artifactVersionRefSchema
        deliveryRequestRef:
          type: string
          minLength: 3
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
        purpose:
          type: string
          const: export
      required: [artifactRef, artifactVersionRef, deliveryRequestRef, purpose]
    MemoryExportState:
      type: string
      enum: [queued, running, ready, failed, expired, purged]
    MemoryExportStatus:
      type: object
      additionalProperties: false
      x-kokoro-monotonic-status-version: true
      x-kokoro-allowed-state-transitions:
        queued: [running, failed, expired, purged]
        running: [ready, failed, expired, purged]
        ready: [expired, purged]
        failed: [purged]
        expired: [purged]
        purged: []
      description: >-
        statusVersion starts at one and increases on every persisted change to this public status
        projection. For one exportRef, a lower version is stale and must never replace a higher one;
        a replay at the same version is byte-equivalent. State transitions are restricted to the
        declared directed graph, so ready, expired, failed, or purged cannot regress to active work.
      properties:
        exportRef: *memoryExportRefSchema
        statusVersion:
          $ref: '#/components/schemas/PositiveUint64String'
        state:
          $ref: '#/components/schemas/MemoryExportState'
        format:
          type: string
          const: kokoro_memory_export_v1
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        artifactDownloadRequest:
          oneOf:
            - $ref: '#/components/schemas/MemoryArtifactDownloadRequest'
            - type: 'null'
        failureCode:
          type: [string, 'null']
          enum: [null, policy_rejected, source_unavailable, temporarily_unavailable]
      required:
        - exportRef
        - statusVersion
        - state
        - format
        - requestedAt
        - updatedAt
        - expiresAt
        - artifactDownloadRequest
        - failureCode
    MemoryExportResponse:
      type: object
      additionalProperties: false
      properties:
        export:
          $ref: '#/components/schemas/MemoryExportStatus'
      required: [export]
    MemoryImportState:
      type: string
      enum: [queued, validating, quarantined, applying, completed, rejected, failed]
    MemoryImportStatus:
      discriminator:
        propertyName: state
        mapping:
          queued: '#/components/schemas/MemoryImportActiveStatus'
          validating: '#/components/schemas/MemoryImportActiveStatus'
          applying: '#/components/schemas/MemoryImportActiveStatus'
          quarantined: '#/components/schemas/MemoryImportQuarantinedStatus'
          completed: '#/components/schemas/MemoryImportCompletedStatus'
          rejected: '#/components/schemas/MemoryImportRejectedStatus'
          failed: '#/components/schemas/MemoryImportFailedStatus'
      oneOf:
        - $ref: '#/components/schemas/MemoryImportActiveStatus'
        - $ref: '#/components/schemas/MemoryImportQuarantinedStatus'
        - $ref: '#/components/schemas/MemoryImportCompletedStatus'
        - $ref: '#/components/schemas/MemoryImportRejectedStatus'
        - $ref: '#/components/schemas/MemoryImportFailedStatus'
      x-kokoro-monotonic-status-version: true
      x-kokoro-allowed-state-transitions:
        queued: [validating, rejected, failed]
        validating: [quarantined, applying, rejected, failed]
        quarantined: [applying, rejected, failed]
        applying: [completed, failed]
        completed: []
        rejected: []
        failed: []
      description: >-
        statusVersion starts at one and increases on every persisted change to this public status
        projection. For one importRef, a lower version is stale and must never replace a higher one;
        a replay at the same version is byte-equivalent. State transitions are restricted to the
        declared directed graph. completed is terminal and carries the exact resultingSpaceVersion
        committed by the apply transaction; every other state carries null.
    MemoryImportActiveStatus:
      type: object
      additionalProperties: false
      properties:
        importRef: *memoryImportRefSchema
        statusVersion:
          $ref: '#/components/schemas/PositiveUint64String'
        state:
          type: string
          enum: [queued, validating, applying]
        assetRef: *assetRefSchema
        assetVersionRef: *assetVersionRefSchema
        format:
          type: string
          const: kokoro_memory_export_v1
        acceptedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        rejectedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        safeStatusCode:
          type: 'null'
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resultingSpaceVersion:
          type: 'null'
      required:
        - importRef
        - statusVersion
        - state
        - assetRef
        - assetVersionRef
        - format
        - acceptedEntryCount
        - rejectedEntryCount
        - safeStatusCode
        - requestedAt
        - updatedAt
        - resultingSpaceVersion
    MemoryImportQuarantinedStatus:
      type: object
      additionalProperties: false
      properties:
        importRef: *memoryImportRefSchema
        statusVersion:
          $ref: '#/components/schemas/PositiveUint64String'
        state:
          type: string
          const: quarantined
        assetRef: *assetRefSchema
        assetVersionRef: *assetVersionRefSchema
        format:
          type: string
          const: kokoro_memory_export_v1
        acceptedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        rejectedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        safeStatusCode:
          type: string
          const: awaiting_review
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resultingSpaceVersion:
          type: 'null'
      required:
        - importRef
        - statusVersion
        - state
        - assetRef
        - assetVersionRef
        - format
        - acceptedEntryCount
        - rejectedEntryCount
        - safeStatusCode
        - requestedAt
        - updatedAt
        - resultingSpaceVersion
    MemoryImportCompletedStatus:
      type: object
      additionalProperties: false
      properties:
        importRef: *memoryImportRefSchema
        statusVersion:
          $ref: '#/components/schemas/PositiveUint64String'
        state:
          type: string
          const: completed
        assetRef: *assetRefSchema
        assetVersionRef: *assetVersionRefSchema
        format:
          type: string
          const: kokoro_memory_export_v1
        acceptedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        rejectedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        safeStatusCode:
          type: 'null'
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resultingSpaceVersion:
          description: >-
            Exact owner space version committed by the apply transaction, including a zero-entry
            completion.
          $ref: '#/components/schemas/PositiveUint64String'
      required:
        - importRef
        - statusVersion
        - state
        - assetRef
        - assetVersionRef
        - format
        - acceptedEntryCount
        - rejectedEntryCount
        - safeStatusCode
        - requestedAt
        - updatedAt
        - resultingSpaceVersion
    MemoryImportRejectedStatus:
      type: object
      additionalProperties: false
      properties:
        importRef: *memoryImportRefSchema
        statusVersion:
          $ref: '#/components/schemas/PositiveUint64String'
        state:
          type: string
          const: rejected
        assetRef: *assetRefSchema
        assetVersionRef: *assetVersionRefSchema
        format:
          type: string
          const: kokoro_memory_export_v1
        acceptedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        rejectedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        safeStatusCode:
          type: string
          enum: [invalid_manifest, policy_rejected]
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resultingSpaceVersion:
          type: 'null'
      required:
        - importRef
        - statusVersion
        - state
        - assetRef
        - assetVersionRef
        - format
        - acceptedEntryCount
        - rejectedEntryCount
        - safeStatusCode
        - requestedAt
        - updatedAt
        - resultingSpaceVersion
    MemoryImportFailedStatus:
      type: object
      additionalProperties: false
      properties:
        importRef: *memoryImportRefSchema
        statusVersion:
          $ref: '#/components/schemas/PositiveUint64String'
        state:
          type: string
          const: failed
        assetRef: *assetRefSchema
        assetVersionRef: *assetVersionRefSchema
        format:
          type: string
          const: kokoro_memory_export_v1
        acceptedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        rejectedEntryCount:
          type: integer
          minimum: 0
          maximum: 100000
        safeStatusCode:
          type: string
          const: temporarily_unavailable
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resultingSpaceVersion:
          type: 'null'
      required:
        - importRef
        - statusVersion
        - state
        - assetRef
        - assetVersionRef
        - format
        - acceptedEntryCount
        - rejectedEntryCount
        - safeStatusCode
        - requestedAt
        - updatedAt
        - resultingSpaceVersion
    MemoryImportResponse:
      type: object
      additionalProperties: false
      properties:
        import:
          $ref: '#/components/schemas/MemoryImportStatus'
      required: [import]
    MemoryCommandKind:
      type: string
      enum:
        - updateMemorySettings
        - rememberMemoryEntry
        - correctMemoryEntry
