        - deprioritizeMemoryEntry
        - forgetMemoryEntry
        - resetMemorySpace
        - requestMemoryExport
        - requestMemoryImport
    MemoryCommandCursor:
      type: object
      additionalProperties: false
      properties:
        commandId: *commandIdSchema
