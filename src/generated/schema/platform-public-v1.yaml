        entitlementTemplateRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
        capabilityKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
        safeLabel:
          type: string
          minLength: 1
          maxLength: 160
        expiresAt:
          type: [string, 'null']
          format: date-time
      required: [entitlementTemplateRevisionRef, capabilityKey, safeLabel, expiresAt]
    RedemptionPreview:
      type: object
      additionalProperties: false
      properties:
        previewRef:
          type: string
          minLength: 1
          maxLength: 256
        previewCredential:
          type: string
          minLength: 32
          maxLength: 4096
          pattern: '^\S+$'
        previewDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        productRef:
          type: string
          minLength: 1
          maxLength: 256
        productVersionRef:
          type: string
          minLength: 1
          maxLength: 256
        productKind:
          type: string
          enum: [free, credit_pack, subscription, bundle]
        safeProductLabel:
          type: string
          minLength: 1
          maxLength: 160
        planRef:
          type: [string, 'null']
          maxLength: 256
        planVersionRef:
          type: [string, 'null']
          maxLength: 256
        safePlanLabel:
          type: [string, 'null']
          maxLength: 160
        term:
          $ref: '#/components/schemas/RedemptionTermPreview'
        credits:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/RedemptionCreditPreview'
        entitlements:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/RedemptionEntitlementPreview'
        legalTermRefs:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        expiresAt:
          type: string
          format: date-time
      required:
        - previewRef
        - previewCredential
        - previewDigest
        - productRef
        - productVersionRef
