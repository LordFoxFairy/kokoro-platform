        productContextRef:
          type: string
          minLength: 1
          maxLength: 256
        siteProjectBindingRef:
          type: string
          minLength: 1
          maxLength: 256
        deploymentRef:
          type: string
          minLength: 1
          maxLength: 256
        siteRef:
          type: string
          minLength: 1
          maxLength: 128
        siteReleaseRef:
          type: string
          minLength: 1
          maxLength: 128
        webArtifactDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        runtimeEnvironment:
          type: string
          enum: [development, preview, staging, production]
        region:
          type: string
          minLength: 1
          maxLength: 128
        sessionContractRevision:
          type: string
          minLength: 1
          maxLength: 128
        projectRef:
          type: string
          minLength: 1
          maxLength: 256
        subjectRef:
          type: string
          minLength: 1
          maxLength: 256
        subjectGeneration:
