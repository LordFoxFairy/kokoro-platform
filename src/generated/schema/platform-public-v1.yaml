        requestId:
          type: string
          maxLength: 128
        correlationId:
          type: string
          maxLength: 128
        safeMessage:
          type: string
          maxLength: 512
        receiptRef:
          type: string
          maxLength: 256
      required: [code, retryClass, requestId, correlationId, safeMessage]
