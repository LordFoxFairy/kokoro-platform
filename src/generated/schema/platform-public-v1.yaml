        - projectRef
        - subjectRef
        - subjectGeneration
        - identitySessionRef
        - issuer
        - keyRevision
        - notBefore
        - siteSecurityEpoch
        - identitySessionEpoch
        - membershipEpoch
        - authorizationEpoch
        - authorizationStreamSequence
        - restrictionEpoch
        - credentialEpoch
        - policyEpoch
        - revocationEpoch
        - resource
        - issuedAt
        - expiresAt
    SessionAccessGrant:
      type: object
      additionalProperties: false
      properties:
        grantRef:
          type: string
          minLength: 1
          maxLength: 256
        credential:
          type: string
          minLength: 32
          maxLength: 4096
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        binding:
          $ref: '#/components/schemas/SessionAccessGrantBinding'
        authorization:
          $ref: '#/components/schemas/SessionGrantAuthorization'
      required: [grantRef, credential, binding, authorization]
    SessionAccessGrantResponse:
      type: object
      additionalProperties: false
      properties:
        grant:
          $ref: '#/components/schemas/SessionAccessGrant'
      required: [grant]
    EmailVerificationTransaction:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        deliveryState:
          type: string
          enum: [queued, sent, rate_limited]
      required: [transactionRef, expiresAt, deliveryState]
    EmailVerificationTransactionResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        transaction:
          $ref: '#/components/schemas/EmailVerificationTransaction'
      required: [receipt, transaction]
    VerificationActivationResponse:
      type: object
      additionalProperties: false
      description: >-
        Durable proof that verification, Site-local account activation, and the complete personal
        Workspace bootstrap committed atomically. Email verification never creates a browser session.
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        accountRef:
          type: string
          minLength: 1
          maxLength: 128
      required: [receipt, accountRef]
    AuthPending:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        challengeKind:
          type: string
          enum: [totp, recovery]
        expiresAt:
          type: string
          format: date-time
      required: [transactionRef, challengeKind, expiresAt]
    AuthPendingResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        pending:
          $ref: '#/components/schemas/AuthPending'
      required: [receipt, pending]
    SessionCredentialPair:
      type: object
      additionalProperties: false
      properties:
        sessionCredential:
          type: string
          minLength: 32
          maxLength: 2048
        sessionCredentialExpiresAt:
          type: string
          format: date-time
        refreshCredential:
          type: string
          minLength: 32
          maxLength: 2048
        refreshCredentialExpiresAt:
          type: string
          format: date-time
        sessionRef:
          type: string
          minLength: 1
          maxLength: 128
      required:
        [sessionCredential, sessionCredentialExpiresAt, refreshCredential, refreshCredentialExpiresAt, sessionRef]
    OneTimeDeliveryUnavailable:
      type: object
      additionalProperties: false
      description: >-
        Returned by an exact idempotent retry after the first one-time delivery was claimed. The
        previous payload is never replayed; the caller must read the durable receipt and, when
        offered, start the permitted replacement command with the caller-held receipt recovery capability.
      properties:
        kind:
          type: string
          const: delivery_unavailable
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        receiptRef:
          type: string
          minLength: 1
          maxLength: 256
      required: [kind, commandId, requestDigest, receiptRef]
    OneTimeSessionCredentialDelivery:
      type: object
      additionalProperties: false
      description: Available only on the fresh command's first successful response claim.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        credentials:
          $ref: '#/components/schemas/SessionCredentialPair'
      required: [commandId, requestDigest, credentials]
    CreateSessionResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthPendingResponse'
        - $ref: '#/components/schemas/OneTimeSessionCredentialDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    SessionCredentialPairResponse:
      oneOf:
        - $ref: '#/components/schemas/OneTimeSessionCredentialDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    IdentitySession:
      type: object
      additionalProperties: false
      properties:
        sessionRef:
          type: string
          minLength: 1
          maxLength: 128
        deviceLabel:
          type: string
          maxLength: 128
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
        status:
          type: string
          enum: [active, revoked, expired]
      required: [sessionRef, deviceLabel, createdAt, lastSeenAt, expiresAt, current, status]
    IdentitySessionList:
      type: object
      additionalProperties: false
      properties:
        sessions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/IdentitySession'
        revision:
          type: string
          minLength: 1
          maxLength: 128
      required: [sessions, revision]
    PasswordResetTransaction:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
      required: [transactionRef, expiresAt]
    PasswordResetTransactionResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        transaction:
          $ref: '#/components/schemas/PasswordResetTransaction'
      required: [receipt, transaction]
    EmailChangeTransaction:
      type: object
      additionalProperties: false
      description: >-
        The current-address and replacement-address challenge references are distinct, independently
        hashed/consumed, and must both be confirmed before the primary identifier can change.
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        currentAddressChallengeRef:
          type: string
          minLength: 16
          maxLength: 128
        replacementAddressChallengeRef:
          type: string
          minLength: 16
          maxLength: 128
      required:
        [transactionRef, expiresAt, currentAddressChallengeRef, replacementAddressChallengeRef]
    EmailChangeTransactionResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        transaction:
          $ref: '#/components/schemas/EmailChangeTransaction'
      required: [receipt, transaction]
    TotpEnrollmentTransaction:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        otpauthUri:
          type: string
          minLength: 1
          maxLength: 2048
        manualEntrySecret:
          type: string
          minLength: 16
          maxLength: 256
      required: [transactionRef, expiresAt, otpauthUri, manualEntrySecret]
    TotpEnrollmentTransactionResponse:
      oneOf:
        - $ref: '#/components/schemas/OneTimeTotpEnrollmentDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    OneTimeTotpEnrollmentDelivery:
      type: object
      additionalProperties: false
      description: Available only on the fresh enrollment command's first successful response claim.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        transaction:
          $ref: '#/components/schemas/TotpEnrollmentTransaction'
      required: [commandId, requestDigest, transaction]
    RecoveryCodeSetResponse:
      oneOf:
        - $ref: '#/components/schemas/OneTimeRecoveryCodeSetDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    OneTimeRecoveryCodeSetDelivery:
      type: object
      additionalProperties: false
      description: Available only on the fresh code-set command's first successful response claim.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        recoveryCodes:
          type: array
          minItems: 8
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 8
            maxLength: 64
        generatedAt:
          type: string
          format: date-time
      required: [commandId, requestDigest, recoveryCodes, generatedAt]
    AccountRecoveryTransaction:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        recoveryState:
          type: string
          enum: [proof_required, review_required, ready]
      required: [transactionRef, expiresAt, recoveryState]
    AccountRecoveryTransactionResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        transaction:
          $ref: '#/components/schemas/AccountRecoveryTransaction'
      required: [receipt, transaction]
    OneTimeTotpRecoveryEnrollmentDelivery:
      type: object
      additionalProperties: false
      description: >-
        First-claim replacement ceremony delivery. Recovery does not commit and old factors remain
        authoritative until this pending seed is challenged successfully.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        factorReplacementCapability:
          type: string
          minLength: 32
          maxLength: 2048
        transaction:
          $ref: '#/components/schemas/TotpEnrollmentTransaction'
      required: [commandId, requestDigest, factorReplacementCapability, transaction]
    AccountRecoveryCompletionResponse:
      oneOf:
        - $ref: '#/components/schemas/CommandReceiptResponse'
        - $ref: '#/components/schemas/OneTimeTotpRecoveryEnrollmentDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    ReauthenticationPending:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 16
          maxLength: 128
        challengeKind:
          type: string
          enum: [totp, recovery]
        expiresAt:
          type: string
          format: date-time
      required: [transactionRef, challengeKind, expiresAt]
    ReauthenticationPendingResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        pending:
          $ref: '#/components/schemas/ReauthenticationPending'
      required: [receipt, pending]
    ReauthenticationProof:
      type: object
      additionalProperties: false
      properties:
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
        audience:
          type: string
          const: platform-public
        operationId:
          type: string
          enum:
            - beginTotpEnrollment
            - disableTotp
            - regenerateRecoveryCodes
        resourceKind:
          type: string
          const: identity_account
        sessionRef:
          type: string
          minLength: 16
          maxLength: 128
        userSecurityEpoch:
          $ref: '#/components/schemas/PositiveUint64String'
        sessionEpoch:
          $ref: '#/components/schemas/PositiveUint64String'
        authStrengthPolicyRevision:
          type: string
          minLength: 1
          maxLength: 128
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - reauthenticationProof
        - audience
        - operationId
        - resourceKind
        - sessionRef
        - userSecurityEpoch
        - sessionEpoch
        - authStrengthPolicyRevision
        - issuedAt
        - expiresAt
    OneTimeReauthenticationProofDelivery:
      type: object
      additionalProperties: false
      description: Available only on the fresh reauthentication command's first successful claim.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        proof:
          $ref: '#/components/schemas/ReauthenticationProof'
      required: [commandId, requestDigest, proof]
    ReauthenticationResponse:
      oneOf:
        - $ref: '#/components/schemas/ReauthenticationPendingResponse'
        - $ref: '#/components/schemas/OneTimeReauthenticationProofDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    PersonalContextActor:
      type: object
      additionalProperties: false
      properties:
        subjectRef:
          type: string
          minLength: 1
          maxLength: 256
        subjectGeneration:
          type: string
          pattern: '^(?:0|[1-9][0-9]{0,18})$'
        state:
          type: string
          const: active
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        avatarUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
      required: [subjectRef, subjectGeneration, state, displayName, avatarUrl]
    PersonalProjectSummary:
      type: object
      additionalProperties: false
      properties:
        projectRef:
          type: string
          minLength: 1
          maxLength: 256
        workspaceRef:
          type: string
          minLength: 1
          maxLength: 256
        executionSpaceRef:
          type: string
          minLength: 1
          maxLength: 256
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        membershipRevision:
          type: string
          minLength: 1
          maxLength: 128
      required: [projectRef, workspaceRef, executionSpaceRef, displayName, membershipRevision]
    PersonalContext:
      type: object
      additionalProperties: false
      description: Authenticated subject state for the workload-derived Site; never cache across users.
      properties:
        productContextRef:
          type: string
          minLength: 1
          maxLength: 256
        personalContextRef:
          type: string
          minLength: 1
          maxLength: 256
        actor:
          $ref: '#/components/schemas/PersonalContextActor'
        projects:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/PersonalProjectSummary'
        defaultProjectRef:
          type: string
          minLength: 1
          maxLength: 256
        contextRevision:
          type: string
          minLength: 1
          maxLength: 128
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        [productContextRef, personalContextRef, actor, projects, defaultProjectRef, contextRevision, issuedAt, expiresAt]
    AcceptedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: &publicCommandId
          type: string
          pattern: '^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
        requestDigest: &publicRequestDigest
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Server-side keyed audit digest; callers do not compute it from secret inputs.
        observedAt: &publicObservedAt
          type: string
          format: date-time
        state:
          type: string
          const: accepted
        deliveryState:
          type: string
          const: not_applicable
      required: &publicReceiptRequired [commandId, requestDigest, observedAt, state, deliveryState]
    OutcomeUnknownPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: outcome_unknown
        deliveryState:
          type: string
          const: not_applicable
      required: *publicReceiptRequired
    CommittedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: committed
        deliveryState:
          type: string
          const: not_applicable
      required: *publicReceiptRequired
    RejectedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: rejected
        deliveryState:
          type: string
          const: not_applicable
      required: *publicReceiptRequired
    CommittedDeliveryConsumedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: committed
        deliveryState:
          type: string
          const: first_claim_consumed
      required: *publicReceiptRequired
    CommittedDeliverySupersededPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: committed
        deliveryState:
          type: string
          const: superseded
      required: *publicReceiptRequired
    PendingCommandReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: pending
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 300
      required: [kind, retryAfterSeconds]
    CommittedCommandReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: terminal
        outcome:
          type: string
          const: committed
      required: [kind, outcome]
    RejectedCommandReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: terminal
        outcome:
          type: string
          const: rejected
      required: [kind, outcome]
    SupersedingCeremony:
      type: object
      additionalProperties: false
      description: >-
        Safe instruction naming the one new command allowed to consume the caller-held receipt recovery
        capability. The response returns no bearer capability. Its binding digest covers the Site release,
        workload, operation, original command, transaction, and expiry; consumption and orphan
        invalidation are atomic.
      properties:
        transactionRef:
          type: string
          minLength: 16
          maxLength: 128
        operationId:
          type: string
          enum:
            - createIdentitySession
            - completeSessionMfa
            - refreshIdentitySession
            - beginTotpEnrollment
            - regenerateRecoveryCodes
            - reauthenticateIdentitySession
            - completeAccountRecovery
        bindingDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        expiresAt:
          type: string
          format: date-time
        invalidatesPriorDelivery:
          type: boolean
          const: true
      required:
        - transactionRef
        - operationId
        - bindingDigest
        - expiresAt
        - invalidatesPriorDelivery
    SupersedingCeremonyReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: superseding_ceremony_required
        ceremony:
          $ref: '#/components/schemas/SupersedingCeremony'
      required: [kind, ceremony]
    AcceptedPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/AcceptedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/PendingCommandReconciliation'
      required: [receipt, reconciliation]
    OutcomeUnknownPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/OutcomeUnknownPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/PendingCommandReconciliation'
      required: [receipt, reconciliation]
    CommittedTerminalPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommittedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/CommittedCommandReconciliation'
      required: [receipt, reconciliation]
    RejectedTerminalPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/RejectedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/RejectedCommandReconciliation'
      required: [receipt, reconciliation]
    CommittedSupersedingPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommittedDeliveryConsumedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/SupersedingCeremonyReconciliation'
      required: [receipt, reconciliation]
    CommittedSupersededPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommittedDeliverySupersededPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/CommittedCommandReconciliation'
      required: [receipt, reconciliation]
    PublicCommandReceiptResponse:
      oneOf:
        - $ref: '#/components/schemas/AcceptedPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/OutcomeUnknownPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/CommittedTerminalPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/RejectedTerminalPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/CommittedSupersedingPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/CommittedSupersededPublicCommandReceiptResponse'
    CreditAmount:
      type: object
      additionalProperties: false
      description: Credit-owned exact amount. The integer is a decimal string to avoid JS precision loss.
      properties:
        creditUnit:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,63}$'
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]{0,39})$'
      required: [creditUnit, amount]
    CreditDecimalAmount:
      type: string
      description: Exact non-negative integer within an enclosing credit-unit scope.
      pattern: '^(0|[1-9][0-9]{0,39})$'
    ProjectionRevision:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,18})$'
    ProjectionFreshness:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [current, stale, rebuilding]
        revision:
          $ref: '#/components/schemas/ProjectionRevision'
        asOf:
          type: string
          format: date-time
        lagSeconds:
          type: integer
          minimum: 0
          maximum: 86400
      required: [state, revision, asOf, lagSeconds]
    RedemptionPreviewInput:
      type: object
      additionalProperties: false
      description: >-
        The only public request that carries a raw redeem Code. BFF and Platform must redact the
        field from logs, traces, metrics, analytics, errors, durable requests, and receipts.
      properties:
        code:
          type: string
          minLength: 16
          maxLength: 256
          pattern: '^[A-Za-z0-9-]+$'
