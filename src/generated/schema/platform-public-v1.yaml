    MemoryExportCommandResult:
      type: object
      additionalProperties: false
      properties:
        resultKind:
          type: string
          const: export
        export:
          $ref: '#/components/schemas/MemoryExportStatus'
      required: [resultKind, export]
    MemoryImportCommandResult:
      type: object
      additionalProperties: false
      properties:
        resultKind:
          type: string
          const: import
        import:
          $ref: '#/components/schemas/MemoryImportStatus'
      required: [resultKind, import]
    MemoryCommandResult:
      discriminator:
        propertyName: resultKind
        mapping:
          entry: '#/components/schemas/MemoryEntryCommandResult'
          restored: '#/components/schemas/MemoryRestoreCommandResult'
          purge: '#/components/schemas/MemoryPurgeCommandResult'
          settings: '#/components/schemas/MemorySettingsCommandResult'
          export: '#/components/schemas/MemoryExportCommandResult'
          import: '#/components/schemas/MemoryImportCommandResult'
      oneOf:
        - $ref: '#/components/schemas/MemoryEntryCommandResult'
        - $ref: '#/components/schemas/MemoryRestoreCommandResult'
        - $ref: '#/components/schemas/MemoryPurgeCommandResult'
        - $ref: '#/components/schemas/MemorySettingsCommandResult'
        - $ref: '#/components/schemas/MemoryExportCommandResult'
        - $ref: '#/components/schemas/MemoryImportCommandResult'
    MemoryCommandPendingResponse:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [accepted, executing, outcome_unknown]
        command:
          $ref: '#/components/schemas/MemoryCommandCursor'
        retryAfter:
          type: string
          format: date-time
      required: [state, command, retryAfter]
    MemoryCommandSucceededResponse:
      type: object
      additionalProperties: false
      description: >-
        A recovered succeeded response repeats the original committedSpaceVersion. Pending and
        rejected outcomes never fabricate a committed owner version.
      properties:
        state:
          type: string
          const: succeeded
        command:
          $ref: '#/components/schemas/MemoryCommandCursor'
        result:
          $ref: '#/components/schemas/MemoryCommandResult'
        committedSpaceVersion:
          description: >-
            Monotonic owner version committed by this command, or the current observed version for
            a succeeded command that does not change the entry/list projection.
          $ref: '#/components/schemas/PositiveUint64String'
      required: [state, command, result, committedSpaceVersion]
    MemoryCommandRejection:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - input_rejected
            - version_conflict
            - policy_rejected
            - not_restorable
            - unavailable
        retryClass:
          type: string
          enum: [never, after_delay, after_user_action]
        retryAfter:
          type: [string, 'null']
          format: date-time
      required: [code, retryClass, retryAfter]
    MemoryCommandRejectedResponse:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          const: rejected
        command:
          $ref: '#/components/schemas/MemoryCommandCursor'
        rejection:
          $ref: '#/components/schemas/MemoryCommandRejection'
      required: [state, command, rejection]
    MemoryCommandResponse:
      discriminator:
        propertyName: state
        mapping:
          accepted: '#/components/schemas/MemoryCommandPendingResponse'
          executing: '#/components/schemas/MemoryCommandPendingResponse'
          outcome_unknown: '#/components/schemas/MemoryCommandPendingResponse'
          succeeded: '#/components/schemas/MemoryCommandSucceededResponse'
          rejected: '#/components/schemas/MemoryCommandRejectedResponse'
      oneOf:
        - $ref: '#/components/schemas/MemoryCommandPendingResponse'
        - $ref: '#/components/schemas/MemoryCommandSucceededResponse'
        - $ref: '#/components/schemas/MemoryCommandRejectedResponse'
    ErrorCode:
