  schemas:
    CommandInput:
      type: object
      additionalProperties: false
      properties:
        commandRef:
          type: string
          maxLength: 128
      required: [commandRef]
    RegistrationInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 191
        password:
          type: string
          minLength: 15
          maxLength: 1024
        legalAcceptanceRefs:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 128
      required: [email, password, legalAcceptanceRefs]
    IdentifierInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 191
      required: [email]
    CreateSessionInput:
      oneOf:
        - $ref: '#/components/schemas/PasswordLoginInput'
        - $ref: '#/components/schemas/SupersedeSessionCredentialDeliveryInput'
    PasswordLoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 191
        password:
          type: string
          maxLength: 1024
        returnIntentRef:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z][a-z0-9_.-]{0,127}$'
          description: Opaque reference resolved only through Platform's registered allowlist.
      required: [email, password]
    SupersedeSessionCredentialDeliveryInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: supersede_session_delivery
        priorCommandId: *commandIdSchema
      required: [recoveryAction, priorCommandId]
    SessionMfaCompletionInput:
      oneOf:
        - $ref: '#/components/schemas/CompleteSessionMfaInput'
        - $ref: '#/components/schemas/SupersedeSessionCredentialDeliveryInput'
    CompleteSessionMfaInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 32
      required: [code]
    OtpInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 32
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
      required: [code, reauthenticationProof]
    RefreshSessionInput:
      oneOf:
        - $ref: '#/components/schemas/RefreshCredentialInput'
        - $ref: '#/components/schemas/SupersedeRefreshCredentialDeliveryInput'
    RefreshCredentialInput:
      type: object
      additionalProperties: false
      properties:
        opaqueCredential:
          type: string
          minLength: 32
          maxLength: 2048
      required: [opaqueCredential]
    SupersedeRefreshCredentialDeliveryInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: supersede_refresh_delivery
        priorCommandId: *commandIdSchema
      required: [recoveryAction, priorCommandId]
    RevokeInput:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          enum: [current, single, others, all]
        sessionRef:
          type: string
          maxLength: 128
      required: [target]
    PasswordInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          maxLength: 2048
        newPassword:
          type: string
          minLength: 15
          maxLength: 1024
      required: [transactionSecret, newPassword]
    PasswordChangeInput:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          minLength: 15
          maxLength: 1024
      required: [currentPassword, newPassword]
    RecoveryInput:
      oneOf:
        - $ref: '#/components/schemas/PasswordRecoveryCompletionInput'
        - $ref: '#/components/schemas/BeginTotpRecoveryReplacementInput'
        - $ref: '#/components/schemas/ConfirmTotpRecoveryReplacementInput'
        - $ref: '#/components/schemas/SupersedeTotpRecoveryReplacementInput'
    PasswordRecoveryCompletionInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          minLength: 32
          maxLength: 2048
        proofCode:
          type: string
          minLength: 8
          maxLength: 256
        replacementFactor:
          type: string
          const: password
        replacementPassword:
          type: string
          minLength: 15
          maxLength: 1024
      required:
        [transactionSecret, proofCode, replacementFactor, replacementPassword]
    BeginTotpRecoveryReplacementInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          minLength: 32
          maxLength: 2048
        proofCode:
          type: string
          minLength: 8
          maxLength: 256
        replacementFactor:
          type: string
          const: totp
        ceremonyAction:
          type: string
          const: begin
      required:
        [transactionSecret, proofCode, replacementFactor, ceremonyAction]
    ConfirmTotpRecoveryReplacementInput:
      type: object
      additionalProperties: false
      properties:
        replacementFactor:
          type: string
          const: totp
        ceremonyAction:
          type: string
          const: confirm
        factorReplacementCapability:
          type: string
          minLength: 32
          maxLength: 2048
        enrollmentTransactionRef:
          type: string
          minLength: 16
          maxLength: 128
        confirmationCode:
          type: string
          minLength: 6
          maxLength: 32
      required:
        - replacementFactor
        - ceremonyAction
        - factorReplacementCapability
        - enrollmentTransactionRef
        - confirmationCode
    SupersedeTotpRecoveryReplacementInput:
      type: object
      additionalProperties: false
      properties:
        replacementFactor:
          type: string
          const: totp
        ceremonyAction:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
        priorEnrollmentTransactionRef:
          type: string
          minLength: 16
          maxLength: 128
      required:
        - replacementFactor
        - ceremonyAction
        - priorCommandId
        - priorEnrollmentTransactionRef
    TransactionSecretInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          minLength: 32
          maxLength: 2048
      required: [transactionSecret]
    TotpConfirmationInput:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 6
          maxLength: 32
      required: [transactionRef, code]
    TotpEnrollmentStartInput:
      oneOf:
        - $ref: '#/components/schemas/BeginTotpEnrollmentInput'
        - $ref: '#/components/schemas/SupersedeTotpEnrollmentInput'
    BeginTotpEnrollmentInput:
      type: object
      additionalProperties: false
      properties:
        ceremonyAction:
          type: string
          const: begin
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
      required: [ceremonyAction, reauthenticationProof]
    SupersedeTotpEnrollmentInput:
      type: object
      additionalProperties: false
      properties:
        ceremonyAction:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
        priorTransactionRef:
          type: string
          minLength: 16
          maxLength: 128
      required: [ceremonyAction, priorCommandId, priorTransactionRef]
    RecoveryCodeRegenerationInput:
      oneOf:
        - $ref: '#/components/schemas/RegenerateRecoveryCodesInput'
        - $ref: '#/components/schemas/SupersedeRecoveryCodeSetInput'
    RegenerateRecoveryCodesInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: regenerate
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
      required: [recoveryAction, reauthenticationProof]
    SupersedeRecoveryCodeSetInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
      required: [recoveryAction, priorCommandId]
    EmailChangeStartInput:
      type: object
      additionalProperties: false
      properties:
        replacementEmail:
          type: string
          format: email
          maxLength: 191
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
      required: [replacementEmail, reauthenticationProof]
    ChannelChallengeProofInput:
      type: object
      additionalProperties: false
      properties:
        challengeRef:
          type: string
          minLength: 16
          maxLength: 128
        proofSecret:
          type: string
          minLength: 16
          maxLength: 2048
      required: [challengeRef, proofSecret]
    EmailChangeCompletionInput:
      type: object
      additionalProperties: false
      properties:
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
        currentAddressChallenge:
          $ref: '#/components/schemas/ChannelChallengeProofInput'
        replacementAddressChallenge:
          $ref: '#/components/schemas/ChannelChallengeProofInput'
      required:
        - reauthenticationProof
        - currentAddressChallenge
        - replacementAddressChallenge
    IdentityAccountReauthenticationResource:
      type: object
      additionalProperties: false
      description: >-
        The current authenticated session's identity account. The server resolves
        the account reference; callers cannot select another account.
      properties:
        kind:
          type: string
          const: identity_account
      required: [kind]
    ReauthenticationTarget:
      type: object
      additionalProperties: false
      description: >-
        Exact one-time proof audience and sensitive mutation. A proof issued for
        one operation cannot authorize another operation or another account.
      properties:
        audience:
          type: string
          const: platform-public
        operationId:
          type: string
          enum:
            - beginTotpEnrollment
            - disableTotp
            - regenerateRecoveryCodes
        resource:
          $ref: '#/components/schemas/IdentityAccountReauthenticationResource'
      required: [audience, operationId, resource]
    ReauthenticationInput:
      oneOf:
        - $ref: '#/components/schemas/PasswordReauthenticationInput'
        - $ref: '#/components/schemas/MfaReauthenticationInput'
        - $ref: '#/components/schemas/SupersedeReauthenticationProofInput'
    PasswordReauthenticationInput:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          const: password
        password:
          type: string
          maxLength: 1024
        target:
          $ref: '#/components/schemas/ReauthenticationTarget'
      required: [stage, password, target]
    MfaReauthenticationInput:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          const: mfa
        transactionRef:
          type: string
          minLength: 16
          maxLength: 128
        challengeKind:
          type: string
          enum: [totp, recovery]
        proofCode:
          type: string
          minLength: 6
          maxLength: 64
        target:
          $ref: '#/components/schemas/ReauthenticationTarget'
      required: [stage, transactionRef, challengeKind, proofCode, target]
    SupersedeReauthenticationProofInput:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
      required: [stage, priorCommandId]
    CommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        receiptRef:
          type: string
          minLength: 1
          maxLength: 256
        state:
          type: string
          const: committed
        committedAt:
          type: string
          format: date-time
      required: [commandId, requestDigest, receiptRef, state, committedAt]
    CommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
      required: [receipt]
    LocalePolicy:
      type: object
      additionalProperties: false
      properties:
        defaultLocale:
          type: string
          minLength: 2
          maxLength: 35
        allowedLocales:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 35
      required: [defaultLocale, allowedLocales]
    PositiveUint64String:
      type: string
      description: A canonical positive unsigned 64-bit integer encoded as a decimal string.
      minLength: 1
      maxLength: 20
      pattern: '^[1-9][0-9]{0,19}$'
      x-kokoro-maximum: '18446744073709551615'
    AssetUploadIntentInput:
      type: object
      additionalProperties: false
      properties:
        purpose: *assetPurposeSchema
        filename:
          type: string
          minLength: 1
          maxLength: 255
        clientMediaType:
          type: string
          minLength: 3
          maxLength: 255
          pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'
        expectedSize:
          $ref: '#/components/schemas/PositiveUint64String'
        expectedChecksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
      required: [purpose, filename, clientMediaType, expectedSize, expectedChecksumSha256]
    AssetUploadCompleteInput:
      type: object
      additionalProperties: false
      properties:
        sessionRef:
          type: string
          minLength: 3
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
        expectedVersion:
          $ref: '#/components/schemas/PositiveUint64String'
      required: [sessionRef, expectedVersion]
    AssetUploadOwnerReceipt:
      type: object
      additionalProperties: false
      description: >-
        Durable owner command cursor. It deliberately excludes the upload capability and all
        object-storage facts, so command recovery cannot replay a credential.
      properties:
        commandId: *commandIdSchema
        receiptRef:
          type: string
          minLength: 1
          maxLength: 256
        operation:
          type: string
          enum: [create_asset_upload_intent, complete_asset_upload]
        state:
          type: string
          enum: [pending, succeeded, failed, outcome_unknown]
        receivedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [commandId, receiptRef, operation, state, receivedAt, updatedAt]
    AssetUploadCapability:
      type: object
      additionalProperties: false
      description: >-
        Short-lived credential for one registered upload data plane. The endpoint is a shared
        service endpoint, never a provider object URL or presigned request.
      properties:
        protocolRevision:
          type: string
          const: s3-multipart-v1
        uploadEndpoint:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 512
        credential:
          type: string
          minLength: 32
          maxLength: 4096
          pattern: '^\S+$'
        capabilityEpoch:
          $ref: '#/components/schemas/PositiveUint64String'
        expiresAt:
          type: string
          format: date-time
        minimumPartBytes:
          $ref: '#/components/schemas/PositiveUint64String'
        maximumPartBytes:
          $ref: '#/components/schemas/PositiveUint64String'
      required:
        - protocolRevision
        - uploadEndpoint
        - credential
        - capabilityEpoch
        - expiresAt
        - minimumPartBytes
        - maximumPartBytes
    AssetUploadStatus:
      type: object
      additionalProperties: false
      properties:
        intentRef: *assetUploadIntentRefSchema
        sessionRef:
          type: string
          minLength: 3
          maxLength: 128
        projectRef: *projectRefSchema
        purpose: *assetPurposeSchema
        safeDisplayName:
          type: string
          minLength: 1
          maxLength: 255
        clientMediaType:
          type: string
          minLength: 3
          maxLength: 255
        expectedSize:
          $ref: '#/components/schemas/PositiveUint64String'
        expectedVersion:
          $ref: '#/components/schemas/PositiveUint64String'
        stage:
          type: string
          enum:
            - upload_interrupted
            - uploading
            - upload_verification
            - scan_waiting
            - scanning
            - promotion_recovering
            - ready
            - rejected
            - aborted
        terminal:
          type: boolean
        retryClass:
          type: string
          enum: [never, immediate, after_delay, after_user_action]
        retryAfter:
          type: [string, 'null']
          format: date-time
        safeReasonCode:
          type: [string, 'null']
          maxLength: 128
          pattern: '^[A-Z][A-Z0-9_]{0,127}$'
        trustedGrant:
          oneOf:
            - $ref: '#/components/schemas/TrustedAssetGrant'
            - type: 'null'
      required:
        - intentRef
        - sessionRef
        - projectRef
        - purpose
        - safeDisplayName
        - clientMediaType
        - expectedSize
        - expectedVersion
        - stage
        - terminal
        - retryClass
        - retryAfter
        - safeReasonCode
        - trustedGrant
    AssetUploadIntentResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/AssetUploadOwnerReceipt'
        upload:
          $ref: '#/components/schemas/AssetUploadStatus'
        capability:
          $ref: '#/components/schemas/AssetUploadCapability'
      required: [receipt, upload, capability]
    AssetUploadCommandResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/AssetUploadOwnerReceipt'
        upload:
          oneOf:
            - $ref: '#/components/schemas/AssetUploadStatus'
            - type: 'null'
      required: [receipt, upload]
    AssetUploadStatusResponse:
      type: object
      additionalProperties: false
      properties:
        upload:
          $ref: '#/components/schemas/AssetUploadStatus'
      required: [upload]
    TrustedAssetGrant:
      type: object
      additionalProperties: false
      description: >-
        Current owner eligibility projection. The opaque assetGrantRef is consumed by Platform
        Admission; it does not directly authorize storage access.
      properties:
        assetRef: *assetRefSchema
        assetVersionRef: *assetVersionRefSchema
        assetGrantRef: *assetGrantRefSchema
        projectRef: *projectRefSchema
        purpose: *assetPurposeSchema
        subjectGeneration:
          $ref: '#/components/schemas/PositiveUint64String'
        eligibilityEpoch:
          $ref: '#/components/schemas/PositiveUint64String'
        detectedMediaType:
          type: string
          minLength: 3
          maxLength: 255
        size:
          $ref: '#/components/schemas/PositiveUint64String'
        state:
          type: string
          const: ready
      required:
        - assetRef
        - assetVersionRef
        - assetGrantRef
        - projectRef
        - purpose
        - subjectGeneration
        - eligibilityEpoch
        - detectedMediaType
        - size
        - state
    TrustedAssetGrantResponse:
      type: object
      additionalProperties: false
      properties:
        grant:
          $ref: '#/components/schemas/TrustedAssetGrant'
      required: [grant]
    PublishedModelOption:
      type: object
      additionalProperties: false
      description: >-
        Immutable, Site-release-published product option safe for an end-user selector. Provider,
        route, credential, price internals, fallback order, and the hidden orchestration model are
        deliberately absent. Admission resolves the revision reference to the complete bundle.
      properties:
        modelOptionRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,255}$'
        optionKey:
          type: string
          pattern: '^[a-z][a-z0-9._-]{1,127}$'
        label:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 512
        inputModalities:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9._-]{0,63}$'
        outputModalities:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9._-]{0,63}$'
        supportedEfforts:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        badges:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        availability:
          type: string
          enum: [available, temporarily_unavailable]
      required:
        - modelOptionRevisionRef
        - optionKey
        - label
        - inputModalities
        - outputModalities
        - supportedEfforts
        - badges
        - availability
    SurfaceModelOptionCatalog:
      type: object
      additionalProperties: false
      description: >-
        The complete safe selector snapshot for one enabled product surface. A music, image, or
        video option may resolve internally to both a generation model and a main chat/orchestration
        model; the browser never selects or learns those base bindings independently.
      properties:
        surfaceId:
          type: string
          minLength: 1
          maxLength: 128
        catalogRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
        defaultModelOptionRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
        options:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/PublishedModelOption'
        publishedAt:
          type: string
          format: date-time
      required:
        - surfaceId
        - catalogRevisionRef
        - defaultModelOptionRevisionRef
        - options
        - publishedAt
    ProductContext:
      type: object
      additionalProperties: false
      description: >-
        Deployment-level Site authority. It is resolved exclusively from the authenticated
        ProductWorkload and registered deployment; it never contains user-specific state.
      properties:
        productContextRef:
          type: string
          minLength: 1
          maxLength: 256
        siteProjectBindingRef:
          type: string
          minLength: 1
          maxLength: 256
        deploymentRef:
          type: string
          minLength: 1
          maxLength: 256
        siteRef:
          type: string
          minLength: 1
          maxLength: 128
        siteReleaseRef:
          type: string
          minLength: 1
          maxLength: 128
        webArtifactDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        runtimeEnvironment:
          type: string
          enum: [development, preview, staging, production]
        region:
          type: string
          minLength: 1
          maxLength: 128
        audience:
          type: string
          minLength: 1
          maxLength: 256
        sessionContractRevision:
          type: string
          minLength: 1
          maxLength: 128
        policyEpoch:
          $ref: '#/components/schemas/PositiveUint64String'
        revocationEpoch:
          $ref: '#/components/schemas/PositiveUint64String'
        enabledSurfaceIds:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        featurePolicyRevision:
          type: string
          minLength: 1
          maxLength: 128
        modelOptionCatalogRef:
          type: string
          minLength: 1
          maxLength: 256
        modelOptionCatalogs:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/SurfaceModelOptionCatalog'
        agentCatalogRef:
          type: string
          minLength: 1
          maxLength: 256
        localePolicy:
          $ref: '#/components/schemas/LocalePolicy'
        cacheMaxAgeSeconds:
          type: integer
          minimum: 0
          maximum: 300
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - productContextRef
        - siteProjectBindingRef
        - deploymentRef
        - siteRef
        - siteReleaseRef
        - webArtifactDigest
        - runtimeEnvironment
        - region
        - audience
        - sessionContractRevision
        - policyEpoch
        - revocationEpoch
        - enabledSurfaceIds
        - featurePolicyRevision
        - modelOptionCatalogRef
        - modelOptionCatalogs
        - agentCatalogRef
        - localePolicy
        - cacheMaxAgeSeconds
        - issuedAt
        - expiresAt
    ProductContextExchangeResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        context:
          $ref: '#/components/schemas/ProductContext'
      required: [receipt, context]
    SessionAccessGrantInput:
