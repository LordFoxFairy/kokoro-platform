          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
      required: [previewCredential, legalAcceptanceRefs]
    RedemptionTermPreview:
      type: object
      additionalProperties: false
