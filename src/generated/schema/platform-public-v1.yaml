openapi: 3.1.0
info:
  title: Kokoro Platform Public API
  version: 1.0.0
  description: >-
    Public BFF contract for independently deployed Site products. Site authority is derived from
    the authenticated workload binding; host names and browser input are never authoritative.
servers:
  - url: https://platform.invalid
security:
  - ProductWorkload: []
paths:
  /v1/product-context:exchange:
    post:
      operationId: exchangeProductContext
      parameters: &mutationParameters
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/CommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProductContextExchangeResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/session-access-grants:
    post:
      operationId: issueSessionAccessGrant
      description: >-
        Issues a short-lived, purpose-specific credential for the registered Session service. The
        authenticated workload and UserSession are authoritative; Site, release, deployment,
        artifact, subject, and generation are resolved by Platform and cannot be supplied by a
        browser. A retry may issue another independently revocable grant and therefore callers must
        never treat the credential as an idempotent command response. Platform emits HTTP 201 only
        after the corresponding GrantDelivered event commits; authorizationStreamSequence in the
        signed binding identifies that exact projection authority point.
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/SessionAccessGrantRequest'
      responses:
        '201':
          $ref: '#/components/responses/SessionAccessGrantResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/registrations:
    post:
      operationId: beginRegistration
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/RegistrationRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmailVerificationTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/verifications/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeEmailVerification
      parameters: &secretMutationParameters
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/TransactionSecretRequest'
      responses:
        '200':
          $ref: '#/components/responses/VerificationActivationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/verifications:resend:
    post:
      operationId: resendEmailVerification
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/IdentifierRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmailVerificationTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:
    post:
      operationId: createIdentitySession
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/CreateSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateSessionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      operationId: listIdentitySessions
      parameters: &readParameters
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/IdentitySessionList'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions/{id}:verify-mfa:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeSessionMfa
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/SessionMfaCompletionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:refresh:
    post:
      operationId: refreshIdentitySession
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/RefreshSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:revoke:
    post:
      operationId: revokeIdentitySessions
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/RevokeRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/password-resets:
    post:
      operationId: beginPasswordReset
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/IdentifierRequest'
      responses:
        '200':
          $ref: '#/components/responses/PasswordResetTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/password-resets/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completePasswordReset
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/password:change:
    post:
      operationId: changePassword
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/email-changes:
    post:
      operationId: beginEmailChange
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/EmailChangeStartRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmailChangeTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/email-changes/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeEmailChange
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/EmailChangeCompletionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/totp/enroll:
    post:
      operationId: beginTotpEnrollment
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/TotpEnrollmentStartRequest'
      responses:
        '200':
          $ref: '#/components/responses/TotpEnrollmentTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/totp/confirm:
    post:
      operationId: confirmTotpEnrollment
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/TotpConfirmationRequest'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodeSetResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/totp/disable:
    post:
      operationId: disableTotp
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/OtpRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/recovery-codes:regenerate:
    post:
      operationId: regenerateRecoveryCodes
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/RecoveryCodeRegenerationRequest'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodeSetResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/account-recoveries:
    post:
      operationId: beginAccountRecovery
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/IdentifierRequest'
      responses:
        '200':
          $ref: '#/components/responses/AccountRecoveryTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/account-recoveries/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeAccountRecovery
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/RecoveryRequest'
      responses:
        '200':
          $ref: '#/components/responses/AccountRecoveryCompletionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:reauthenticate:
    post:
      operationId: reauthenticateIdentitySession
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/ReauthenticationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReauthenticationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/personal-context:
    get:
      operationId: getPersonalContext
      parameters: *readParameters
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/PersonalContext'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/redemptions:preview:
    post:
      operationId: previewRedemption
      description: >-
        Resolves a redeem Code without claiming or reserving it. Platform derives Site and
        BillingAccount authority from the authenticated workload and user session. The response
        contains only a short-lived opaque preview credential and safe immutable product terms;
        it never echoes the Code or exposes inventory, HMAC, Batch, or lookup facts.
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/RedemptionPreviewRequest'
      responses:
        '200':
          $ref: '#/components/responses/RedemptionPreviewResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/redemptions:confirm:
    post:
      operationId: confirmRedemption
      description: >-
        Atomically claims the Code represented by a live preview credential and executes the
        frozen Fulfillment output plan. The same command identity and idempotency key always
        recover the same result; a different payload conflicts before any business lock or effect.
        Platform revalidates every live Site, Program, Batch, Code, account, risk, and stacking fact
        at the effect point and never creates a Payment acquisition.
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/RedemptionConfirmRequest'
      responses:
        '200':
          $ref: '#/components/responses/RedemptionCommandResponse'
        '202':
          $ref: '#/components/responses/RedemptionCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/redemption-commands:recover:
    get:
      operationId: recoverRedemptionCommand
      description: >-
        Recovers the caller's durable redemption command by the exact Idempotency-Key after a lost
        or unknown HTTP response. Unknown, cross-Site, cross-subject, stale-generation, or
        mismatched commands are indistinguishable. The operation never replays a Code or preview
        credential.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/RedemptionCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/redemptions/{id}:
    get:
      operationId: getRedemptionReceipt
      description: >-
        Returns the authenticated subject's immutable redemption and Fulfillment receipt. It uses
        safe display facts and source references only; Code material and internal inventory facts
        are never returned.
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/RedemptionReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/products:
    get:
      operationId: listAccountProducts
      parameters: *readParameters
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/AccountProductsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/credits:
    get:
      operationId: getCreditSummary
      parameters: *readParameters
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/CreditSummaryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/credit-grants/{id}:
    get:
      operationId: getCreditGrant
      parameters:
        - $ref: '#/components/parameters/CreditGrantId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/CreditGrantResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/usage/{id}:
    get:
      operationId: getUsageDetail
      parameters:
        - $ref: '#/components/parameters/UsageId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/UsageDetailResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/asset-upload-intents:
    post:
      operationId: createAssetUploadIntent
      description: >-
        Reserves upload quota and issues a short-lived, single-session capability for the
        authenticated owner. Platform derives Site and subject authority from the trusted workload
        and UserSession. The capability never contains an object-store URL, bucket, key, or
        presigned request and is never persisted in an owner receipt.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/AssetUploadIntentRequest'
      responses:
        '201':
          $ref: '#/components/responses/AssetUploadIntentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/asset-upload-intents/{intentRef}:complete:
    post:
      operationId: completeAssetUpload
      description: >-
        Freezes the canonical upload session and requests server-side object verification. A byte
        complete upload is not an Asset and remains unusable until scan and promotion receipts are
        current and closed.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/AssetUploadIntentRef'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/AssetUploadCompleteRequest'
      responses:
        '202':
          $ref: '#/components/responses/AssetUploadCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/asset-upload-intents/{intentRef}:
    get:
      operationId: getAssetUploadStatus
      description: >-
        Returns the real owner-visible upload, scan, and promotion state. Scanner outages and
        promotion reconciliation remain waiting states and never appear as ready.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/AssetUploadIntentRef'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/AssetUploadStatusResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/asset-upload-commands/{commandId}:
    get:
      operationId: recoverAssetUploadCommand
      description: >-
        Recovers only the durable owner receipt and current upload state after an unknown response.
        It never returns or replays an upload capability. Unknown and mismatched authority are
        indistinguishable.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/AssetCommandId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/AssetUploadCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/assets/{assetRef}/versions/{assetVersionRef}/grants/{assetGrantRef}:
    get:
      operationId: getTrustedAssetGrant
      description: >-
        Returns a ready owner projection only when the exact Site, Project, subject generation,
        purpose, AssetVersion, AssetGrant, and eligibility epoch are current. Any mismatch is an
        existence-safe denial and no storage locator is disclosed.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/AssetRef'
        - $ref: '#/components/parameters/AssetVersionRef'
        - $ref: '#/components/parameters/AssetGrantRef'
        - $ref: '#/components/parameters/AssetPurpose'
        - $ref: '#/components/parameters/AssetEligibilityEpoch'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/TrustedAssetGrantResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/media-operation-definitions:
    get:
      operationId: listMediaOperationDefinitions
      description: Lists immutable, Site-release-published media capabilities available to this product.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/ContractVersion'
      security: &mediaUserSecurity
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/MediaOperationDefinitionPageResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/media-operation-definitions/{definitionRef}:
    get:
      operationId: getMediaOperationDefinition
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/MediaDefinitionRef'
        - $ref: '#/components/parameters/ContractVersion'
      security: *mediaUserSecurity
      responses:
        '200':
          $ref: '#/components/responses/MediaOperationDefinitionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/media-operation-definitions/{definitionRef}/model-options:
    get:
      operationId: listMediaOperationModelOptions
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/MediaDefinitionRef'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/ContractVersion'
      security: *mediaUserSecurity
      responses:
        '200':
          $ref: '#/components/responses/MediaDefinitionModelOptionPageResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/media-operation-quotes:
    post:
      operationId: quoteMediaOperation
      description: Returns non-binding owner-safe cost guidance; it does not reserve credit or execution capacity.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security: *mediaUserSecurity
      requestBody:
        $ref: '#/components/requestBodies/MediaOperationQuoteRequest'
      responses:
        '200':
          $ref: '#/components/responses/MediaOperationQuoteResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/media-operations:
    post:
      operationId: submitMediaOperation
      description: >-
        Submits one deterministic product intent. The caller fingerprint covers the canonical public
        intent only; Platform privately binds ownership and idempotency without exposing its digest.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CallerRequestFingerprint'
      security: *mediaUserSecurity
      requestBody:
        $ref: '#/components/requestBodies/MediaOperationSubmitRequest'
      responses:
        '201':
          $ref: '#/components/responses/MediaOperationCommandResponse'
        '202':
          $ref: '#/components/responses/MediaOperationCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      operationId: listMediaOperations
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/ContractVersion'
      security: *mediaUserSecurity
      responses:
        '200':
          $ref: '#/components/responses/MediaOperationPageResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/media-operations/{operationRef}:
    get:
      operationId: getMediaOperation
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/MediaOperationRef'
        - $ref: '#/components/parameters/ContractVersion'
      security: *mediaUserSecurity
      responses:
        '200':
          $ref: '#/components/responses/MediaOperationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/media-operations/{operationRef}:cancel:
    post:
      operationId: cancelMediaOperation
      description: Requests cancellation without claiming that already committed work can be reversed.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/MediaOperationRef'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security: *mediaUserSecurity
      requestBody:
        $ref: '#/components/requestBodies/MediaOperationCancelRequest'
      responses:
        '200':
          $ref: '#/components/responses/MediaOperationCommandResponse'
        '202':
          $ref: '#/components/responses/MediaOperationCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/media-operation-commands/{commandId}:
    get:
      operationId: recoverMediaOperationCommand
      description: Recovers the durable owner receipt after an ambiguous submit or cancellation response.
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/MediaCommandId'
        - $ref: '#/components/parameters/ContractVersion'
      security: *mediaUserSecurity
      responses:
        '200':
          $ref: '#/components/responses/MediaOperationCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/projects/{projectRef}/artifacts:
    get:
      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/ProjectRef'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/ContractVersion'
      security: *mediaUserSecurity
