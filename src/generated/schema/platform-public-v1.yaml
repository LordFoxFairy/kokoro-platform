          minLength: 1
          maxLength: 256
        bucketClass:
          type: string
          enum: [daily, period, permanent]
        unit:
          type: string
          minLength: 1
          maxLength: 64
        amount:
          $ref: '#/components/schemas/CreditDecimalAmount'
        expiresAt:
          type: [string, 'null']
          format: date-time
      required: [creditProgramRevisionRef, bucketClass, unit, amount, expiresAt]
    RedemptionEntitlementPreview:
      type: object
      additionalProperties: false
