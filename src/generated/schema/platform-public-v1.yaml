          $ref: '#/components/schemas/MemoryCommandKind'
        receiptRef:
          type: string
          minLength: 3
          maxLength: 128
        receivedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [commandId, commandKind, receiptRef, receivedAt, updatedAt]
    MemoryEntryCommandResult:
      type: object
      additionalProperties: false
      properties:
        resultKind:
          type: string
          const: entry
        entry:
          $ref: '#/components/schemas/MemoryEntryView'
      required: [resultKind, entry]
    MemoryRestoreCommandResult:
      type: object
      additionalProperties: false
      description: A restore appends a successor and never mutates the referenced historical revision.
      properties:
        resultKind:
          type: string
          const: restored
        restoredFromRevisionRef: *memoryRevisionRefSchema
        newRevisionRef: *memoryRevisionRefSchema
        newRevision:
          type: integer
          minimum: 2
          maximum: 2147483647
        entry:
          $ref: '#/components/schemas/MemoryEntryActiveView'
      required:
        - resultKind
        - restoredFromRevisionRef
        - newRevisionRef
        - newRevision
        - entry
    MemoryPurgeCommandResult:
      type: object
      additionalProperties: false
      properties:
        resultKind:
          type: string
          const: purge
        purgeScope:
          type: string
          enum: [entry, space]
        entryRef:
          type: [string, 'null']
          minLength: 3
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
        purgeState:
          $ref: '#/components/schemas/MemoryPurgeState'
        purgeReceiptRef:
          type: string
          minLength: 3
          maxLength: 128
        effectiveAt:
          type: string
          format: date-time
