      parameters:
        - $ref: '#/components/parameters/MemoryCommandId'
        - $ref: '#/components/parameters/ContractVersion'
      security: *memoryUserSecurity
      responses:
        '200':
          $ref: '#/components/responses/MemoryCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/artifact-delivery-authorizations/{authorizationRef}/content:
    get:
      operationId: redeemArtifactDeliveryAuthorization
      x-kokoro-max-range-bytes: 8388608
      description: >-
        Redeems one exact audience-bound delivery capability and streams owner-authorized bytes.
        The BFF must stream with backpressure; it must not buffer the artifact as JSON or base64.
      parameters:
        - $ref: '#/components/parameters/ArtifactDeliveryAuthorizationRef'
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/ArtifactByteRange'
        - $ref: '#/components/parameters/RequestDeadline'
      security:
        - ProductWorkload: []
          ArtifactDeliveryCapability: []
      responses:
        '200':
          description: Authorized artifact byte stream.
          headers:
            Content-Disposition:
              description: RFC 6266 disposition with RFC 8187 encoding for any non-ASCII filename.
              schema: {type: string, maxLength: 2048}
            Content-Length:
              schema: {$ref: '#/components/schemas/PositiveUint64String'}
            Cache-Control:
              schema: {type: string, const: 'private, no-store'}
            Accept-Ranges:
              required: true
              schema: {type: string, const: bytes}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: Authorized bounded single byte range.
          headers:
            Content-Disposition:
              description: RFC 6266 disposition with RFC 8187 encoding for any non-ASCII filename.
              schema: {type: string, maxLength: 2048}
            Content-Length:
              required: true
              schema: {$ref: '#/components/schemas/PositiveUint64String'}
            Content-Range:
              required: true
              schema: {type: string, pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'}
            Accept-Ranges:
              required: true
              schema: {type: string, const: bytes}
            Cache-Control:
              required: true
              schema: {type: string, const: 'private, no-store'}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '416':
          description: The single byte range is malformed, exceeds 8 MiB, or is not satisfiable.
          headers:
            Content-Range:
              required: true
              schema: {type: string, pattern: '^bytes \*/[0-9]+$'}
            Accept-Ranges:
              required: true
              schema: {type: string, const: bytes}
            Cache-Control:
              required: true
              schema: {type: string, const: 'private, no-store'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/commands/{id}/receipt:
    get:
      operationId: getPublicCommandReceipt
      description: >-
        Returns only durable status and a typed recovery action, never a previously delivered
        credential, TOTP seed, recovery code, reauthentication proof, or new bearer capability. The
        caller-generated command id makes the receipt reachable even when the first response contains
        zero response bytes; the lookup does not require the caller to know the server-side request digest.
        An authenticated lookup is restricted to the same caller. Anonymous login, MFA, refresh,
        password-reset, account-recovery, and other secret-delivery lookups present the same
        X-Kokoro-Receipt-Recovery-Capability generated before the original command. Receipt lookup
        does not consume it. Platform verifies its domain-separated hash bound to the workload-derived
        Site, workload binding, purpose, subject generation, transaction, command, and expiry. A later
        superseding command atomically consumes that same capability and invalidates the orphaned
        delivery before producing fresh material. Unknown, consumed-for-supersession, mismatched, or
        conflicting inputs produce the same rate-limited not-found response.
      parameters:
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      responses:
        '200':
          $ref: '#/components/responses/PublicCommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    ProductWorkload:
      type: mutualTLS
      description: Deployment workload identity bound by Platform to one Site release and audience.
    UserSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-platform-session
    ReceiptRecoveryCapability:
      type: apiKey
      in: header
      name: X-Kokoro-Receipt-Recovery-Capability
      description: >-
        caller-generated high-entropy capability created before a secret-bearing or anonymous-completion
        command. Platform stores only a domain-separated hash. A receipt read repeatedly verifies it and
        does not consume it; the new command named by a superseding action atomically consumes the same
        capability while invalidating the orphaned delivery. It never returns in a response body.
    ArtifactDeliveryCapability:
      type: apiKey
      in: header
      name: X-Kokoro-Artifact-Delivery-Capability
      description: >-
        Short-lived opaque capability bound to one authorization, artifact version, purpose, Site BFF
        workload audience, and subject generation. It is independently revocable and never placed in a URL.
  parameters:
    ContractVersion:
      name: Kokoro-Contract-Version
      in: header
      required: true
      schema:
        type: string
        const: '1'
    CommandIdentity:
      name: X-Kokoro-Command-Id
      in: header
      required: true
      description: >-
        Stable caller-generated 128-bit command identity, encoded as lowercase 32-hex or UUIDv7. It
        must not be derived from Idempotency-Key, password, OTP, or request content. Platform owns a
        unique workload/Site/caller/command row and rejects the same command id with a different payload
        using an internal keyed digest; all responses and receipts echo this exact id.
      schema: &commandIdSchema
        type: string
        pattern: '^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 191
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 512
    TransactionRef:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CommandId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
    RedemptionId:
      name: id
      in: path
      required: true
      schema: &redemptionIdSchema
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    CreditGrantId:
      name: id
      in: path
      required: true
      schema: &creditGrantIdSchema
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    UsageId:
      name: id
      in: path
      required: true
      schema: &usageIdSchema
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ProjectRef:
      name: projectRef
      in: path
      required: true
      schema: &projectRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    AssetUploadIntentRef:
      name: intentRef
      in: path
      required: true
      schema: &assetUploadIntentRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    AssetCommandId:
      name: commandId
      in: path
      required: true
      schema: *commandIdSchema
    AssetRef:
      name: assetRef
      in: path
      required: true
      schema: &assetRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    AssetVersionRef:
      name: assetVersionRef
      in: path
      required: true
      schema: &assetVersionRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    AssetGrantRef:
      name: assetGrantRef
      in: path
      required: true
      schema: &assetGrantRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    AssetPurpose:
      name: purpose
      in: query
      required: true
      schema: &assetPurposeSchema
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-z][a-z0-9._-]{0,127}$'
    AssetEligibilityEpoch:
      name: eligibilityEpoch
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/PositiveUint64String'
    MediaDefinitionRef:
      name: definitionRef
      in: path
      required: true
      schema: &mediaDefinitionRefSchema
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,255}$'
    MediaOperationRef:
      name: operationRef
      in: path
      required: true
      schema: &mediaOperationRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    MediaCommandId:
      name: commandId
      in: path
      required: true
      schema: *commandIdSchema
    CallerRequestFingerprint:
      name: X-Kokoro-Caller-Request-Fingerprint
      in: header
      required: true
      description: Lowercase SHA-256 of the versioned, deterministic protobuf caller-intent preimage.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    ArtifactRef:
      name: artifactRef
      in: path
      required: true
      schema: &artifactRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    ArtifactVersionRef:
      name: artifactVersionRef
      in: path
      required: true
      schema: &artifactVersionRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    ArtifactDeliveryAuthorizationRef:
      name: authorizationRef
      in: path
      required: true
      schema: &artifactDeliveryAuthorizationRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    MemoryEntryRef:
      name: entryRef
      in: path
      required: true
      schema: &memoryEntryRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    MemoryRevisionRef:
      name: revisionRef
      in: path
      required: true
      schema: &memoryRevisionRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    MemoryExportRef:
      name: exportRef
      in: path
      required: true
      schema: &memoryExportRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    MemoryImportRef:
      name: importRef
      in: path
      required: true
      schema: &memoryImportRefSchema
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    MemoryCommandId:
      name: commandId
      in: path
      required: true
      schema: *commandIdSchema
    MemoryCategoryFilter:
      name: category
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MemoryCategory'
    MemorySourceFilter:
      name: source
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MemorySourceKind'
    ArtifactByteRange:
      name: Range
      in: header
      required: false
      description: >-
        One bounded RFC 9110 byte range only. A start/end range and a suffix range are supported;
        multipart and open-ended ranges are rejected. The requested span must not exceed 8 MiB.
      schema:
        type: string
        maxLength: 64
        pattern: '^bytes=([0-9]+-[0-9]+|-[1-9][0-9]*)$'
    RequestDeadline:
      name: X-Kokoro-Request-Deadline-Ms
      in: header
      required: true
      description: >-
        Caller-owned non-zero deadline. The generated caller seam requires an AbortSignal and
        transports this deadline; expiration aborts the upstream stream rather than buffering it.
      schema:
        type: integer
        minimum: 1
        maximum: 30000
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque owner-bound cursor. Clients must never inspect or synthesize it.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
