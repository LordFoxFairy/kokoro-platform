schemaVersion: 1
image:
  buildRoot: .
  owner: platform
deployables:
  - id: platform-api
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-api
    processRole: api
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      authorityMode: transition-candidate
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_API_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-api
      permissions: bounded-transactional-api
      ddl: forbidden
    activationAuthorized: false
    runtimeTraffic: false
    inboundContracts: []
    declaredInboundContracts: [platform-public-http, platform-admission-connect]
    outboundContracts: []
    secretClasses: [platform-api-database, workload-verification]
    audience: platform-api
    scalingKey: http-concurrency
    readiness: /health/ready
    drain: http-graceful
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-worker
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-worker
    processRole: worker
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      authorityMode: transition-candidate
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_WORKER_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-worker
      permissions: bounded-transactional-worker
      ddl: forbidden
    inboundContracts: []
    activationAuthorized: false
    runtimeTraffic: false
    outboundContracts: []
    secretClasses: [platform-worker-database]
    audience: platform-worker
    scalingKey: queue-lag
    readiness: process-state
    drain: stop-claim-then-return-lease
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-authorization
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-authorization
    processRole: authorization
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      authorityMode: transition-candidate
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_AUTHORIZATION_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-authorization
      permissions: authorization-feed-read-snapshot
      ddl: forbidden
    activationAuthorized: false
    runtimeTraffic: false
    inboundContracts: []
    declaredInboundContracts: [platform-session-authorization-connect]
    outboundContracts: []
    secretClasses: [platform-authorization-database, authorization-verification-keys, mtls-server, mtls-peer-registry]
    audience: platform-session-authorization
    scalingKey: connect-long-poll-concurrency
    readiness: /health/ready
    drain: http2-graceful
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-admin
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-admin
    processRole: admin
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      authorityMode: transition-candidate
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_ADMIN_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-admin
      permissions: signed-control-plane-functions-only
      ddl: forbidden
    inboundContracts: []
    declaredInboundContracts: [platform-admin-connect]
    activationAuthorized: false
    runtimeTraffic: false
    outboundContracts: []
    secretClasses: [platform-admin-database, workload-verification]
    audience: platform-admin
    scalingKey: admin-command-concurrency
    readiness: /health/ready
    drain: http-graceful
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-migrator
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-migrator
    processRole: migrator
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      authorityMode: transition-candidate
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      apiRoleEnvironmentVariable: PLATFORM_DATABASE_API_ROLE
      workerRoleEnvironmentVariable: PLATFORM_DATABASE_WORKER_ROLE
      authorizationRoleEnvironmentVariable: PLATFORM_DATABASE_AUTHORIZATION_ROLE
      adminRoleEnvironmentVariable: PLATFORM_DATABASE_ADMIN_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-migrator
      permissions: migration-ddl
      runtimeTraffic: forbidden
    inboundContracts: []
    activationAuthorized: false
    runtimeTraffic: false
    outboundContracts: []
    secretClasses: [platform-migrator-database]
    audience: platform-migrator
    scalingKey: singleton-advisory-lock
    readiness: one-shot-exit-code
    drain: advisory-lock-release
    sloOwner: platform-data
    runbookOwner: platform-data
    releaseOwner: platform-data
