schemaVersion: 1
image:
  buildRoot: .
  owner: platform
deployables:
  - id: platform-api
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-api
    processRole: api
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_API_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-api
      permissions: bounded-transactional-api
      ddl: forbidden
    activationAuthorized: false
    runtimeTraffic: false
    inboundContracts: []
    declaredInboundContracts: [platform-public-http]
    outboundContracts: []
    secretClasses:
      - platform-api-database
      - product-workload-registry
      - session-access-signing-keyring
      - authorization-event-signing-keyring
      - mtls-server
      - mtls-client-ca
      - commerce-redemption-keyring
      - asset-upload-policy-registry
      - asset-upload-capability-keyring
      - identity-password-pepper-keyring
      - identity-verification-digest-key
      - identity-session-digest-key
      - identity-refresh-digest-key
      - identity-reauthentication-digest-key
      - identity-audit-digest-key
      - identity-delivery-encryption-key
      - identity-totp-encryption-keyring
    ports:
      - { name: public, containerPort: 4100, protocol: https, exposure: service, mtls: true }
      - { name: health, containerPort: 4101, protocol: http, exposure: pod-only, mtls: false }
    fileContract:
      trustRootEnvironment: PLATFORM_API_FILE_TRUST_ROOT
      mountPath: /run/secrets/platform-api
      defaultMode: "0440"
      requiredEnvironment:
        - PLATFORM_PRODUCT_WORKLOAD_REGISTRY_FILE
        - PLATFORM_SESSION_ACCESS_KEY_RING_FILE
        - PLATFORM_AUTHORIZATION_EVENT_KEY_RING_FILE
        - PLATFORM_PUBLIC_TLS_KEY_FILE
        - PLATFORM_PUBLIC_TLS_CERT_FILE
        - PLATFORM_PUBLIC_TLS_CLIENT_CA_FILE
        - PLATFORM_COMMERCE_REDEMPTION_KEY_RING_FILE
        - PLATFORM_ASSET_UPLOAD_POLICY_REGISTRY_FILE
        - PLATFORM_ASSET_UPLOAD_CAPABILITY_KEY_RING_FILE
        - PLATFORM_IDENTITY_PASSWORD_PEPPER_RING_FILE
        - PLATFORM_IDENTITY_VERIFICATION_DIGEST_KEY_FILE
        - PLATFORM_IDENTITY_SESSION_DIGEST_KEY_FILE
        - PLATFORM_IDENTITY_REFRESH_DIGEST_KEY_FILE
        - PLATFORM_IDENTITY_REAUTH_DIGEST_KEY_FILE
        - PLATFORM_IDENTITY_AUDIT_DIGEST_KEY_FILE
        - PLATFORM_IDENTITY_DELIVERY_KEY_FILE
        - PLATFORM_IDENTITY_TOTP_KEY_RING_FILE
    probes:
      liveness: { path: /health/live, port: health, scheme: HTTP }
      readiness: { path: /health/ready, port: health, scheme: HTTP }
    audience: platform-api
    scalingKey: http-concurrency
    readiness: /health/ready
    drain: http-graceful
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-admission
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-admission
    processRole: admission
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_ADMISSION_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-admission
      permissions: admission-owner-transaction-only
      ddl: forbidden
    activationAuthorized: false
    runtimeTraffic: false
    inboundContracts: []
    declaredInboundContracts: [platform-admission-connect, platform-asset-eligibility-connect]
    outboundContracts:
      [session-admission-owner-connect, session-dispatch-owner-evidence-connect, agent-execution-evidence-connect]
    secretClasses:
      [
        platform-admission-database,
        mtls-server,
        mtls-peer-registry,
        mtls-client,
        session-peer-ca,
        agent-peer-ca,
        admission-hpke-public-key-ring,
      ]
    audience: platform-admission
    scalingKey: connect-request-concurrency
    readiness: /health/ready
    drain: http2-graceful
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-worker
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-worker
    processRole: worker
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_WORKER_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-worker
      permissions: bounded-transactional-worker
      ddl: forbidden
    inboundContracts: []
    activationAuthorized: false
    runtimeTraffic: false
    outboundContracts: [identity-verification-delivery-https]
    secretClasses:
      [platform-worker-database, authorization-event-signing-keyring,
       identity-audit-digest-key, identity-delivery-hmac-key]
    audience: platform-worker
    scalingKey: queue-lag
    readiness: process-state
    drain: stop-claim-then-return-lease
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-model-gateway
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-model-gateway
    processRole: model-gateway
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_MODEL_GATEWAY_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-model-gateway
      permissions: opaque-authorization-attempt-producer-only
      ddl: forbidden
    activationAuthorized: false
    runtimeTraffic: false
    inboundContracts: []
    declaredInboundContracts: [platform-model-gateway-connect-v1]
    outboundContracts: [litellm-openai-chat-completions, platform-model-gateway-reconciliation-https]
    secretClasses:
      [platform-model-gateway-database, mtls-server, mtls-peer-registry,
       model-gateway-response-keyring, litellm-api-key]
    audience: platform-model-gateway
    scalingKey: provider-request-concurrency
    readiness: /health/ready
    drain: http2-graceful-then-abort
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-authorization
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-authorization
    processRole: authorization
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_AUTHORIZATION_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-authorization
      permissions: authorization-feed-read-snapshot
      ddl: forbidden
    activationAuthorized: false
    runtimeTraffic: false
    inboundContracts: []
    declaredInboundContracts: [platform-session-authorization-connect]
    outboundContracts: []
    secretClasses:
      [
        platform-authorization-database,
        authorization-verification-keys,
        authorization-feed-cursor-key,
        mtls-server,
        mtls-peer-registry,
      ]
    audience: platform-session-authorization
    scalingKey: connect-long-poll-concurrency
    readiness: /health/ready
    drain: http2-graceful
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-asset-data-plane
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-asset-data-plane
    processRole: asset-data-plane
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_ASSET_DATA_PLANE_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-asset-data-plane
      permissions: capability-scoped-multipart-effects-only
      ddl: forbidden
    activationAuthorized: false
    runtimeTraffic: false
    inboundContracts: []
    declaredInboundContracts: [platform-asset-upload-https]
    outboundContracts: [s3-multipart-api]
    secretClasses:
      [platform-asset-data-plane-database, tls-server, asset-upload-policy-registry,
       asset-upload-capability-keyring, asset-storage-route-registry]
    audience: platform-asset-data-plane
    scalingKey: multipart-request-concurrency
    readiness: /health/ready
    drain: https-graceful
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-admin
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-admin
    processRole: admin
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_ADMIN_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-admin
      permissions: typed-admin-control-plane-transactions
      ddl: forbidden
    inboundContracts: []
    declaredInboundContracts: [platform-admin-connect]
    activationAuthorized: false
    runtimeTraffic: false
    outboundContracts: []
    secretClasses:
      [
        platform-admin-database,
        mtls-server,
        mtls-peer-registry,
        oidc-client-registry,
        oidc-client-secret,
        oidc-transaction-encryption-key,
        admin-session-jose-key-ring,
        admin-page-cursor-key,
        authorization-event-signing-keyring,
        site-release-certification-verification-keyring,
      ]
    audience: platform-admin
    scalingKey: admin-command-concurrency
    readiness: /health/ready
    drain: http2-graceful
    sloOwner: platform
    runbookOwner: platform
    releaseOwner: platform

  - id: platform-hub-connect
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-hub-connect
    processRole: hub-connect-runtime
    inboundContracts: []
    declaredInboundContracts: [hub-runtime, hub-capability-catalog]
    outboundContracts: [platform-capability-projection]
    activationAuthorized: false
    runtimeTraffic: true
    secretClasses:
      [
        hub-mongo,
        hub-package-storage,
        hub-secret-keyring,
        capability-catalog-signing-key,
        mtls-server,
        mtls-peer-registry,
        mtls-client,
        platform-admission-peer-ca,
      ]
    audience: platform-hub-connect
    scalingKey: connect-request-concurrency
    readiness: /health/ready
    drain: http2-graceful
    sloOwner: platform-hub
    runbookOwner: platform-hub
    releaseOwner: platform

  - id: platform-migrator
    command: node --conditions=kokoro-runtime deploy/docker/runtime-entrypoint.mjs
    selectorEnvironment: KOKORO_SERVICE_PACKAGE=platform-migrator
    processRole: migrator
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      apiRoleEnvironmentVariable: PLATFORM_DATABASE_API_ROLE
      admissionRoleEnvironmentVariable: PLATFORM_DATABASE_ADMISSION_ROLE
      workerRoleEnvironmentVariable: PLATFORM_DATABASE_WORKER_ROLE
      authorizationRoleEnvironmentVariable: PLATFORM_DATABASE_AUTHORIZATION_ROLE
      assetDataPlaneRoleEnvironmentVariable: PLATFORM_DATABASE_ASSET_DATA_PLANE_ROLE
      adminRoleEnvironmentVariable: PLATFORM_DATABASE_ADMIN_ROLE
      modelGatewayRoleEnvironmentVariable: PLATFORM_DATABASE_MODEL_GATEWAY_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-migrator
      permissions: migration-ddl
      runtimeTraffic: forbidden
    inboundContracts: []
    activationAuthorized: false
    runtimeTraffic: false
    outboundContracts: []
    secretClasses: [platform-migrator-database]
    audience: platform-migrator
    scalingKey: singleton-advisory-lock
    readiness: one-shot-exit-code
    drain: advisory-lock-release
    sloOwner: platform-data
    runbookOwner: platform-data
    releaseOwner: platform-data

  - id: platform-admin-authority-bootstrap
    command: node --conditions=kokoro-runtime dist/src/process/admin-authority-bootstrap.js --file /run/secrets/kokoro/admin-authority-bootstrap.json
    processRole: bootstrap
    database:
      environmentVariable: DATABASE_URL_PLATFORM
      expectedUserEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      migratorRoleEnvironmentVariable: PLATFORM_DATABASE_MIGRATOR_ROLE
      expectedDatabaseEnvironmentVariable: PLATFORM_DATABASE_EXPECTED_DATABASE
      credentialClass: platform-migrator
      permissions: sealed-initial-admin-authority-only
      runtimeTraffic: forbidden
    inboundContracts: []
    activationAuthorized: false
    runtimeTraffic: false
    outboundContracts: []
    secretClasses: [platform-migrator-database, initial-admin-authority-document]
    audience: platform-admin-authority-bootstrap
    scalingKey: fresh-install-singleton
    readiness: one-shot-sealed-exit-code
    drain: transaction-completion
    sloOwner: platform-security
    runbookOwner: platform-security
    releaseOwner: platform-security
