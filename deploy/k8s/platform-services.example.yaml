      template:
        metadata: { labels: { app: platform-artifact-data-plane } }
        spec:
          terminationGracePeriodSeconds: 30
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: platform-artifact-data-plane
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-artifact-data-plane-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-artifact-data-plane }
                - { name: PLATFORM_ARTIFACT_DATA_PLANE_PORT, value: "4248" }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: artifact-data-plane }
                - { name: PLATFORM_ARTIFACT_DATA_PLANE_OWNER_ADAPTER_REVISION, value: postgres-s3-v1 }
                - { name: PLATFORM_ARTIFACT_DATA_PLANE_FILE_TRUST_ROOT, value: /run/secrets/platform-artifact-data-plane }
                - { name: PLATFORM_ARTIFACT_DATA_PLANE_PRODUCT_WORKLOAD_REGISTRY_FILE, value: /run/secrets/platform-artifact-data-plane/product-workloads.json }
                - { name: PLATFORM_ARTIFACT_DELIVERY_CAPABILITY_KEY_FILE, value: /run/secrets/platform-artifact-data-plane/capability-key.json }
                - { name: PLATFORM_ARTIFACT_PRIVATE_OBJECT_ROUTE_FILE, value: /run/secrets/platform-artifact-data-plane/object-route.json }
                - { name: PLATFORM_ARTIFACT_DATA_PLANE_TLS_KEY_FILE, value: /run/secrets/platform-artifact-data-plane/tls.key }
                - { name: PLATFORM_ARTIFACT_DATA_PLANE_TLS_CERT_FILE, value: /run/secrets/platform-artifact-data-plane/tls.crt }
                - { name: PLATFORM_ARTIFACT_DATA_PLANE_TLS_CLIENT_CA_FILE, value: /run/secrets/platform-artifact-data-plane/client-ca.crt }
              ports:
                - { name: https, containerPort: 4248 }
                - { name: health, containerPort: 4249 }
              startupProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
              livenessProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
              readinessProbe:
                httpGet: { path: /health/ready, port: health, scheme: HTTP }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: "2", memory: 512Mi }
              volumeMounts:
