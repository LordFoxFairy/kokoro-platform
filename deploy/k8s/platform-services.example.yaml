apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: platform-migrator
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: platform-migrator
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-migrator-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-migrator }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: migrator }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-api }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-api } }
      template:
        metadata: { labels: { app: platform-api } }
        spec:
          containers:
            - name: platform-api
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-api-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-api }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: api }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-admission }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-admission } }
      template:
        metadata: { labels: { app: platform-admission } }
        spec:
          containers:
            - name: platform-admission
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-admission-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-admission }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: admission }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-authorization }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-authorization } }
      template:
        metadata: { labels: { app: platform-authorization } }
        spec:
          containers:
            - name: platform-authorization
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-authorization-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-authorization }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: authorization }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-model-gateway }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-model-gateway } }
      template:
        metadata: { labels: { app: platform-model-gateway } }
        spec:
          containers:
            - name: platform-model-gateway
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-model-gateway-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-model-gateway }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: model-gateway }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-worker }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-worker } }
      template:
        metadata: { labels: { app: platform-worker } }
        spec:
          containers:
            - name: platform-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-worker-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: worker }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-admin }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-admin } }
      template:
        metadata: { labels: { app: platform-admin } }
        spec:
          containers:
            - name: platform-admin
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-admin-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-admin }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: admin }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-asset-data-plane }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-asset-data-plane } }
      template:
        metadata: { labels: { app: platform-asset-data-plane } }
        spec:
          containers:
            - name: platform-asset-data-plane
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-asset-data-plane-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-asset-data-plane }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: api }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: kokoro-hub }
    spec:
      replicas: 2
      selector: { matchLabels: { app: kokoro-hub } }
      template:
        metadata: { labels: { app: kokoro-hub } }
        spec:
          containers:
            - name: kokoro-hub
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - secretRef: { name: kokoro-hub-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: "@kokoro/hub" }
                - { name: KOKORO_HUB_PORT, value: "4251" }
              ports:
                - { name: http, containerPort: 4251 }
