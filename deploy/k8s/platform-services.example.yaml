apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: platform-migrator
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: platform-migrator
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-migrator-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-migrator }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: migrator }

  - apiVersion: v1
    kind: ServiceAccount
    metadata: { name: platform-api }
    automountServiceAccountToken: false

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-api }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-api } }
      strategy:
        type: RollingUpdate
        rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
      template:
        metadata: { labels: { app: platform-api } }
        spec:
          serviceAccountName: platform-api
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: platform-api
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-api-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-api }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: api }
                - { name: PLATFORM_API_PORT, value: "4100" }
                - { name: PLATFORM_API_HEALTH_PORT, value: "4101" }
                - { name: PLATFORM_API_FILE_TRUST_ROOT, value: /run/secrets/platform-api }
                - { name: PLATFORM_PRODUCT_WORKLOAD_REGISTRY_FILE, value: /run/secrets/platform-api/product-workloads.json }
                - { name: PLATFORM_SESSION_ACCESS_KEY_RING_FILE, value: /run/secrets/platform-api/session-access-keys.json }
                - { name: PLATFORM_AUTHORIZATION_EVENT_KEY_RING_FILE, value: /run/secrets/platform-api/authorization-event-keys.json }
                - { name: PLATFORM_PUBLIC_TLS_KEY_FILE, value: /run/secrets/platform-api/public-tls.key }
                - { name: PLATFORM_PUBLIC_TLS_CERT_FILE, value: /run/secrets/platform-api/public-tls.crt }
                - { name: PLATFORM_PUBLIC_TLS_CLIENT_CA_FILE, value: /run/secrets/platform-api/public-client-ca.crt }
                - { name: PLATFORM_COMMERCE_REDEMPTION_KEY_RING_FILE, value: /run/secrets/platform-api/commerce-redemption-keys.json }
                - { name: PLATFORM_ASSET_UPLOAD_POLICY_REGISTRY_FILE, value: /run/secrets/platform-api/asset-upload-policies.json }
                - { name: PLATFORM_ASSET_UPLOAD_CAPABILITY_KEY_RING_FILE, value: /run/secrets/platform-api/asset-upload-capability-keys.json }
                - { name: PLATFORM_IDENTITY_PASSWORD_PEPPER_RING_FILE, value: /run/secrets/platform-api/identity-password-peppers.json }
                - { name: PLATFORM_IDENTITY_VERIFICATION_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-verification-digest.key }
                - { name: PLATFORM_IDENTITY_SESSION_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-session-digest.key }
                - { name: PLATFORM_IDENTITY_REFRESH_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-refresh-digest.key }
                - { name: PLATFORM_IDENTITY_REAUTH_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-reauth-digest.key }
                - { name: PLATFORM_IDENTITY_AUDIT_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-audit-digest.key }
                - { name: PLATFORM_IDENTITY_DELIVERY_KEY_FILE, value: /run/secrets/platform-api/identity-delivery.key }
                - { name: PLATFORM_IDENTITY_TOTP_KEY_RING_FILE, value: /run/secrets/platform-api/identity-totp-keys.json }
              ports:
                - { name: public, containerPort: 4100 }
                - { name: health, containerPort: 4101 }
              startupProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
                failureThreshold: 30
                periodSeconds: 2
              livenessProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 3
              readinessProbe:
                httpGet: { path: /health/ready, port: health, scheme: HTTP }
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 2
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "2", memory: 1Gi }
              volumeMounts:
                - { name: platform-api-files, mountPath: /run/secrets/platform-api, readOnly: true }
          volumes:
            - name: platform-api-files
              secret:
                secretName: platform-api-files
                defaultMode: 288
                items:
                  - { key: product-workloads.json, path: product-workloads.json }
                  - { key: session-access-keys.json, path: session-access-keys.json }
                  - { key: authorization-event-keys.json, path: authorization-event-keys.json }
                  - { key: public-tls.key, path: public-tls.key }
                  - { key: public-tls.crt, path: public-tls.crt }
                  - { key: public-client-ca.crt, path: public-client-ca.crt }
                  - { key: commerce-redemption-keys.json, path: commerce-redemption-keys.json }
                  - { key: asset-upload-policies.json, path: asset-upload-policies.json }
                  - { key: asset-upload-capability-keys.json, path: asset-upload-capability-keys.json }
                  - { key: identity-password-peppers.json, path: identity-password-peppers.json }
                  - { key: identity-verification-digest.key, path: identity-verification-digest.key }
                  - { key: identity-session-digest.key, path: identity-session-digest.key }
                  - { key: identity-refresh-digest.key, path: identity-refresh-digest.key }
                  - { key: identity-reauth-digest.key, path: identity-reauth-digest.key }
                  - { key: identity-audit-digest.key, path: identity-audit-digest.key }
                  - { key: identity-delivery.key, path: identity-delivery.key }
                  - { key: identity-totp-keys.json, path: identity-totp-keys.json }

  - apiVersion: v1
    kind: Service
    metadata: { name: platform-api }
    spec:
      selector: { app: platform-api }
      ports:
        - { name: public, port: 4100, targetPort: public }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-admission }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-admission } }
      template:
        metadata: { labels: { app: platform-admission } }
        spec:
          containers:
            - name: platform-admission
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-admission-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-admission }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: admission }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-authorization }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-authorization } }
      template:
        metadata: { labels: { app: platform-authorization } }
        spec:
          containers:
            - name: platform-authorization
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-authorization-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-authorization }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: authorization }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-model-gateway }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-model-gateway } }
      template:
        metadata: { labels: { app: platform-model-gateway } }
        spec:
          containers:
            - name: platform-model-gateway
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-model-gateway-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-model-gateway }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: model-gateway }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-worker }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-worker } }
      template:
        metadata: { labels: { app: platform-worker } }
        spec:
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: platform-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-worker-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: worker }
                - { name: PLATFORM_WORKER_HEALTH_PORT, value: "4190" }
                - name: PLATFORM_WORKER_ID
                  valueFrom: { fieldRef: { fieldPath: metadata.uid } }
                - name: PLATFORM_OUTBOX_DELIVERY_ENDPOINT
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_OUTBOX_DELIVERY_ENDPOINT } }
                - name: PLATFORM_OUTBOX_DELIVERY_KEY_ID
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_OUTBOX_DELIVERY_KEY_ID } }
                - { name: PLATFORM_SITE_PROVIDER_REGISTRY_FILE, value: /var/run/config/kokoro/site/provider-registry.json }
                - { name: PLATFORM_AUTHORIZATION_EVENT_KEY_RING_FILE, value: /var/run/secrets/kokoro/authorization/event-key-ring.json }
              ports:
                - { name: health, containerPort: 4190, protocol: TCP }
              startupProbe:
                httpGet: { path: /health/live, port: health }
                periodSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet: { path: /health/ready, port: health }
                periodSeconds: 2
                failureThreshold: 1
              livenessProbe:
                httpGet: { path: /health/live, port: health }
                periodSeconds: 10
                failureThreshold: 3
              volumeMounts:
                - { name: platform-worker-site-registry, mountPath: /var/run/config/kokoro/site, readOnly: true }
                - { name: platform-worker-site-secrets, mountPath: /var/run/secrets/kokoro/site/providers, readOnly: true }
                - { name: platform-worker-authorization-secrets, mountPath: /var/run/secrets/kokoro/authorization, readOnly: true }
          volumes:
            - name: platform-worker-site-registry
              configMap: { name: platform-worker-site-registry }
            - name: platform-worker-site-secrets
              secret:
                secretName: platform-worker-site-secrets
                defaultMode: 0440
            - name: platform-worker-authorization-secrets
              secret:
                secretName: platform-worker-authorization-secrets
                defaultMode: 0440

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-identity-worker }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-identity-worker } }
      template:
        metadata: { labels: { app: platform-identity-worker } }
        spec:
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: platform-identity-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-identity-worker-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-identity-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: identity-worker }
                - { name: PLATFORM_WORKER_HEALTH_PORT, value: "4190" }
                - name: PLATFORM_WORKER_ID
                  valueFrom: { fieldRef: { fieldPath: metadata.uid } }
                - { name: PLATFORM_IDENTITY_AUDIT_DIGEST_KEY_FILE, value: /var/run/secrets/kokoro/identity/audit-digest.key }
                - { name: PLATFORM_IDENTITY_SECRET_TRUST_ROOT, value: /var/run/secrets/kokoro/identity }
                - { name: PLATFORM_IDENTITY_DELIVERY_HMAC_SECRET_FILE, value: /var/run/secrets/kokoro/identity/delivery-hmac.key }
                - name: PLATFORM_IDENTITY_DELIVERY_ENDPOINT
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_IDENTITY_DELIVERY_ENDPOINT } }
                - name: PLATFORM_IDENTITY_DELIVERY_HMAC_KEY_ID
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_IDENTITY_DELIVERY_HMAC_KEY_ID } }
              ports:
                - { name: health, containerPort: 4190, protocol: TCP }
              startupProbe:
                httpGet: { path: /health/live, port: health }
                periodSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet: { path: /health/ready, port: health }
                periodSeconds: 2
                failureThreshold: 1
              livenessProbe:
                httpGet: { path: /health/live, port: health }
                periodSeconds: 10
                failureThreshold: 3
              volumeMounts:
                - { name: platform-identity-worker-secrets, mountPath: /var/run/secrets/kokoro/identity, readOnly: true }
          volumes:
            - name: platform-identity-worker-secrets
              secret:
                secretName: platform-identity-worker-secrets
                defaultMode: 0440

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-admin }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-admin } }
      template:
        metadata: { labels: { app: platform-admin } }
        spec:
          containers:
            - name: platform-admin
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-admin-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-admin }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: admin }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-asset-data-plane }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-asset-data-plane } }
      template:
        metadata: { labels: { app: platform-asset-data-plane } }
        spec:
          containers:
            - name: platform-asset-data-plane
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-asset-data-plane-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-asset-data-plane }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: asset-data-plane }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: kokoro-hub }
    spec:
      replicas: 2
      selector: { matchLabels: { app: kokoro-hub } }
      template:
        metadata: { labels: { app: kokoro-hub } }
        spec:
          containers:
            - name: kokoro-hub
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - secretRef: { name: kokoro-hub-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: "@kokoro/hub" }
                - { name: KOKORO_HUB_PORT, value: "4251" }
              ports:
                - { name: http, containerPort: 4251 }

  - apiVersion: v1
    kind: ServiceAccount
    metadata: { name: platform-hub-connect }
    automountServiceAccountToken: false

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-hub-connect }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-hub-connect } }
      strategy:
        type: RollingUpdate
        rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
      template:
        metadata: { labels: { app: platform-hub-connect } }
        spec:
          serviceAccountName: platform-hub-connect
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: platform-hub-connect
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              envFrom:
                - configMapRef: { name: platform-hub-connect-runtime }
                - secretRef: { name: platform-hub-connect-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-hub-connect }
                - { name: KOKORO_HUB_CONNECT_PORT, value: "4252" }
                - { name: KOKORO_HUB_CONNECT_HEALTH_PORT, value: "4253" }
                - { name: KOKORO_WORKSPACE_CONFIG, value: /run/config/kokoro/storage.yaml }
                - { name: KOKORO_HUB_CONNECT_TRUST_ROOT, value: /run/secrets/hub-connect }
                - { name: KOKORO_HUB_CONNECT_TLS_KEY_FILE, value: /run/secrets/hub-connect/server.key }
                - { name: KOKORO_HUB_CONNECT_TLS_CERT_FILE, value: /run/secrets/hub-connect/server.crt }
                - { name: KOKORO_HUB_CONNECT_TLS_CLIENT_CA_FILE, value: /run/secrets/hub-connect/client-ca.crt }
                - { name: KOKORO_HUB_CONNECT_MTLS_PEERS_FILE, value: /run/secrets/hub-connect/inbound-peers.json }
                - { name: KOKORO_HUB_CAPABILITY_SIGNING_KEY_FILE, value: /run/secrets/hub-connect/catalog-signing.key }
                - { name: KOKORO_HUB_PLATFORM_PROJECTION_CLIENT_KEY_FILE, value: /run/secrets/hub-connect/platform-client.key }
                - { name: KOKORO_HUB_PLATFORM_PROJECTION_CLIENT_CERT_FILE, value: /run/secrets/hub-connect/platform-client.crt }
                - { name: KOKORO_HUB_PLATFORM_PROJECTION_SERVER_CA_FILE, value: /run/secrets/hub-connect/platform-ca.crt }
              ports:
                - { name: connect, containerPort: 4252 }
                - { name: health, containerPort: 4253 }
              startupProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
                failureThreshold: 30
                periodSeconds: 2
              livenessProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 3
              readinessProbe:
                httpGet: { path: /health/ready, port: health, scheme: HTTP }
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 2
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "2", memory: 1Gi }
              volumeMounts:
                - { name: hub-connect-mtls, mountPath: /run/secrets/hub-connect, readOnly: true }
                - { name: hub-storage-config, mountPath: /run/config/kokoro, readOnly: true }
          volumes:
            - name: hub-connect-mtls
              secret:
                secretName: platform-hub-connect-files
                defaultMode: 256
            - name: hub-storage-config
              configMap:
                name: platform-hub-connect-storage
                defaultMode: 292

  - apiVersion: v1
    kind: Service
    metadata: { name: platform-hub-connect }
    spec:
      selector: { app: platform-hub-connect }
      ports:
        - { name: connect, port: 4252, targetPort: connect }
