apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: platform-migrator
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: platform-migrator
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-migrator-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-migrator }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: migrator }

  - apiVersion: v1
    kind: ServiceAccount
    metadata: { name: platform-api }
    automountServiceAccountToken: false

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-api }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-api } }
      strategy:
        type: RollingUpdate
        rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
      template:
        metadata: { labels: { app: platform-api } }
        spec:
          serviceAccountName: platform-api
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: platform-api
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-api-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-api }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: api }
                - { name: PLATFORM_API_PORT, value: "4100" }
                - { name: PLATFORM_API_HEALTH_PORT, value: "4101" }
                - { name: PLATFORM_API_FILE_TRUST_ROOT, value: /run/secrets/platform-api }
                - { name: PLATFORM_PRODUCT_WORKLOAD_REGISTRY_FILE, value: /run/secrets/platform-api/product-workloads.json }
                - { name: PLATFORM_SESSION_ACCESS_KEY_RING_FILE, value: /run/secrets/platform-api/session-access-keys.json }
                - { name: PLATFORM_AUTHORIZATION_EVENT_KEY_RING_FILE, value: /run/secrets/platform-api/authorization-event-keys.json }
                - { name: PLATFORM_PUBLIC_TLS_KEY_FILE, value: /run/secrets/platform-api/public-tls.key }
                - { name: PLATFORM_PUBLIC_TLS_CERT_FILE, value: /run/secrets/platform-api/public-tls.crt }
                - { name: PLATFORM_PUBLIC_TLS_CLIENT_CA_FILE, value: /run/secrets/platform-api/public-client-ca.crt }
                - { name: PLATFORM_COMMERCE_REDEMPTION_KEY_RING_FILE, value: /run/secrets/platform-api/commerce-redemption-keys.json }
                - { name: PLATFORM_ASSET_UPLOAD_POLICY_REGISTRY_FILE, value: /run/secrets/platform-api/asset-upload-policies.json }
                - { name: PLATFORM_ASSET_UPLOAD_CAPABILITY_KEY_RING_FILE, value: /run/secrets/platform-api/asset-upload-capability-keys.json }
                - { name: PLATFORM_ARTIFACT_DELIVERY_CAPABILITY_KEY_FILE, value: /run/secrets/platform-api/artifact-delivery-capability-key.json }
                - { name: PLATFORM_ARTIFACT_OWNER_CURSOR_KEY_FILE, value: /run/secrets/platform-api/artifact-owner-cursor-key.json }
                - { name: PLATFORM_IDENTITY_PASSWORD_PEPPER_RING_FILE, value: /run/secrets/platform-api/identity-password-peppers.json }
                - { name: PLATFORM_IDENTITY_VERIFICATION_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-verification-digest.key }
                - { name: PLATFORM_IDENTITY_SESSION_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-session-digest.key }
                - { name: PLATFORM_IDENTITY_REFRESH_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-refresh-digest.key }
                - { name: PLATFORM_IDENTITY_REAUTH_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-reauth-digest.key }
                - { name: PLATFORM_IDENTITY_AUDIT_DIGEST_KEY_FILE, value: /run/secrets/platform-api/identity-audit-digest.key }
                - { name: PLATFORM_IDENTITY_DELIVERY_KEY_FILE, value: /run/secrets/platform-api/identity-delivery.key }
                - { name: PLATFORM_IDENTITY_TOTP_KEY_RING_FILE, value: /run/secrets/platform-api/identity-totp-keys.json }
              ports:
                - { name: public, containerPort: 4100 }
                - { name: health, containerPort: 4101 }
              startupProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
                failureThreshold: 30
                periodSeconds: 2
              livenessProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 3
              readinessProbe:
                httpGet: { path: /health/ready, port: health, scheme: HTTP }
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 2
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "2", memory: 1Gi }
              volumeMounts:
                - { name: platform-api-files, mountPath: /run/secrets/platform-api, readOnly: true }
          volumes:
            - name: platform-api-files
              secret:
                secretName: platform-api-files
                defaultMode: 288
                items:
                  - { key: product-workloads.json, path: product-workloads.json }
                  - { key: session-access-keys.json, path: session-access-keys.json }
                  - { key: authorization-event-keys.json, path: authorization-event-keys.json }
                  - { key: public-tls.key, path: public-tls.key }
                  - { key: public-tls.crt, path: public-tls.crt }
                  - { key: public-client-ca.crt, path: public-client-ca.crt }
                  - { key: commerce-redemption-keys.json, path: commerce-redemption-keys.json }
                  - { key: asset-upload-policies.json, path: asset-upload-policies.json }
                  - { key: asset-upload-capability-keys.json, path: asset-upload-capability-keys.json }
                  - { key: artifact-delivery-capability-key.json, path: artifact-delivery-capability-key.json }
                  - { key: artifact-owner-cursor-key.json, path: artifact-owner-cursor-key.json }
                  - { key: identity-password-peppers.json, path: identity-password-peppers.json }
                  - { key: identity-verification-digest.key, path: identity-verification-digest.key }
                  - { key: identity-session-digest.key, path: identity-session-digest.key }
                  - { key: identity-refresh-digest.key, path: identity-refresh-digest.key }
                  - { key: identity-reauth-digest.key, path: identity-reauth-digest.key }
                  - { key: identity-audit-digest.key, path: identity-audit-digest.key }
                  - { key: identity-delivery.key, path: identity-delivery.key }
                  - { key: identity-totp-keys.json, path: identity-totp-keys.json }

  - apiVersion: v1
    kind: Service
    metadata: { name: platform-api }
    spec:
      selector: { app: platform-api }
      ports:
        - { name: public, port: 4100, targetPort: public }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-admission }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-admission } }
      template:
        metadata: { labels: { app: platform-admission } }
        spec:
          containers:
            - name: platform-admission
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-admission-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-admission }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: admission }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-authorization }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-authorization } }
      template:
        metadata: { labels: { app: platform-authorization } }
        spec:
          containers:
            - name: platform-authorization
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-authorization-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-authorization }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: authorization }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-model-gateway }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-model-gateway } }
      template:
        metadata: { labels: { app: platform-model-gateway } }
        spec:
          containers:
            - name: platform-model-gateway
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-model-gateway-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-model-gateway }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: model-gateway }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-commerce-worker }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-commerce-worker } }
      template:
        metadata: { labels: { app: platform-commerce-worker } }
        spec:
          terminationGracePeriodSeconds: 30
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
          containers:
            - name: platform-commerce-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-commerce-worker-database }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-commerce-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: commerce-worker }
                - { name: PLATFORM_WORKER_HEALTH_PORT, value: "4190" }
                - { name: PLATFORM_COMMERCE_WORKER_SECRET_TRUST_ROOT, value: /run/secrets/kokoro/commerce-worker }
                - { name: PLATFORM_COMMERCE_OUTBOX_DELIVERY_SECRET_FILE, value: /run/secrets/kokoro/commerce-worker/delivery-hmac.key }
                - name: PLATFORM_WORKER_ID
                  valueFrom: { fieldRef: { fieldPath: metadata.uid } }
              ports: [{ name: health, containerPort: 4190, protocol: TCP }]
              startupProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 2, failureThreshold: 30 }
              readinessProbe: { httpGet: { path: /health/ready, port: health }, periodSeconds: 2, failureThreshold: 1 }
              livenessProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 10, failureThreshold: 3 }
              volumeMounts:
                - { name: commerce-worker-secrets, mountPath: /run/secrets/kokoro/commerce-worker, readOnly: true }
          volumes:
            - name: commerce-worker-secrets
              secret: { secretName: commerce-credit-outbox-delivery-hmac-key, defaultMode: 0440 }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-model-image-worker }
    spec:
      replicas: 0 # Activation remains fail-closed until a certified provider adapter release is pinned.
      selector: { matchLabels: { app: platform-model-image-worker } }
      template:
        metadata: { labels: { app: platform-model-image-worker } }
        spec:
          terminationGracePeriodSeconds: 30
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
          containers:
            - name: platform-model-image-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-model-image-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: model-image-worker }
                - { name: PLATFORM_WORKER_HEALTH_PORT, value: "4190" }
                - { name: PLATFORM_MODEL_IMAGE_WORKER_SECRET_TRUST_ROOT, value: /run/secrets/kokoro/model-image-worker }
                - { name: PLATFORM_MODEL_IMAGE_WORKER_PROVIDER_REGISTRY_FILE, value: /run/secrets/kokoro/model-image-worker/providers.json }
                - { name: PLATFORM_MODEL_IMAGE_WORKER_RESPONSE_KEY_RING_FILE, value: /run/secrets/kokoro/model-image-worker/response-keys.json }
                - name: DATABASE_URL_PLATFORM
                  valueFrom: { secretKeyRef: { name: platform-model-image-worker-database, key: DATABASE_URL_PLATFORM } }
                - name: PLATFORM_DATABASE_EXPECTED_DATABASE
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_DATABASE_EXPECTED_DATABASE } }
                - name: PLATFORM_DATABASE_MIGRATOR_ROLE
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_DATABASE_MIGRATOR_ROLE } }
                - name: PLATFORM_DATABASE_MODEL_IMAGE_WORKER_ROLE
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_DATABASE_MODEL_IMAGE_WORKER_ROLE } }
                - name: PLATFORM_WORKER_ID
                  valueFrom: { fieldRef: { fieldPath: metadata.uid } }
              ports: [{ name: health, containerPort: 4190, protocol: TCP }]
              startupProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 2, failureThreshold: 30 }
              readinessProbe: { httpGet: { path: /health/ready, port: health }, periodSeconds: 2, failureThreshold: 1 }
              livenessProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 10, failureThreshold: 3 }
              volumeMounts:
                - { name: model-image-worker-secrets, mountPath: /run/secrets/kokoro/model-image-worker, readOnly: true }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: model-image-worker-secrets
              projected:
                defaultMode: 0440
                sources:
                  - secret: { name: model-image-provider-registry }
                  - secret: { name: model-image-provider-credentials }
                  - secret: { name: model-image-response-keyring }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-site-worker }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-site-worker } }
      template:
        metadata: { labels: { app: platform-site-worker } }
        spec:
          terminationGracePeriodSeconds: 30
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
          containers:
            - name: platform-site-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-site-worker-database }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-site-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: site-worker }
                - { name: PLATFORM_WORKER_HEALTH_PORT, value: "4190" }
                - { name: PLATFORM_SITE_PROVIDER_REGISTRY_FILE, value: /var/run/config/kokoro/site/provider-registry.json }
                - { name: PLATFORM_AUTHORIZATION_EVENT_KEY_RING_FILE, value: /var/run/secrets/kokoro/authorization/event-key-ring.json }
                - name: PLATFORM_WORKER_ID
                  valueFrom: { fieldRef: { fieldPath: metadata.uid } }
              ports: [{ name: health, containerPort: 4190, protocol: TCP }]
              startupProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 2, failureThreshold: 30 }
              readinessProbe: { httpGet: { path: /health/ready, port: health }, periodSeconds: 2, failureThreshold: 1 }
              livenessProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 10, failureThreshold: 3 }
              volumeMounts:
                - { name: site-worker-config, mountPath: /var/run/config/kokoro/site, readOnly: true }
                - { name: site-worker-provider-secrets, mountPath: /var/run/secrets/kokoro/site/providers, readOnly: true }
                - { name: site-worker-authorization-secrets, mountPath: /var/run/secrets/kokoro/authorization, readOnly: true }
          volumes:
            - { name: site-worker-config, configMap: { name: platform-site-worker-registry } }
            - { name: site-worker-provider-secrets, secret: { secretName: platform-site-worker-provider-secrets, defaultMode: 0440 } }
            - { name: site-worker-authorization-secrets, secret: { secretName: platform-site-worker-authorization-secrets, defaultMode: 0440 } }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-asset-worker }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-asset-worker } }
      template:
        metadata: { labels: { app: platform-asset-worker } }
        spec:
          terminationGracePeriodSeconds: 30
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
          containers:
            - name: platform-asset-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-asset-worker-database }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-asset-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: asset-worker }
                - { name: PLATFORM_WORKER_HEALTH_PORT, value: "4190" }
                - { name: PLATFORM_ASSET_WORKER_SECRET_TRUST_ROOT, value: /run/secrets/kokoro/asset-worker }
                - { name: PLATFORM_ASSET_STORAGE_ROUTE_FILE, value: /run/secrets/kokoro/asset-worker/storage-routes.json }
                - { name: PLATFORM_ASSET_INSPECTION_POLICY_REGISTRY_FILE, value: /run/secrets/kokoro/asset-worker/inspection-policies.json }
                - { name: PLATFORM_ASSET_SCANNER_TOKEN_FILE, value: /run/secrets/kokoro/asset-worker/scanner-token }
                - { name: PLATFORM_ASSET_SCANNER_TLS_CA_FILE, value: /run/secrets/kokoro/asset-worker/scanner-ca.crt }
                - { name: PLATFORM_ASSET_SCANNER_TLS_CERT_FILE, value: /run/secrets/kokoro/asset-worker/scanner-client.crt }
                - { name: PLATFORM_ASSET_SCANNER_TLS_KEY_FILE, value: /run/secrets/kokoro/asset-worker/scanner-client.key }
                - name: PLATFORM_WORKER_ID
                  valueFrom: { fieldRef: { fieldPath: metadata.uid } }
              ports: [{ name: health, containerPort: 4190, protocol: TCP }]
              startupProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 2, failureThreshold: 30 }
              readinessProbe: { httpGet: { path: /health/ready, port: health }, periodSeconds: 2, failureThreshold: 1 }
              livenessProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 10, failureThreshold: 3 }
              volumeMounts:
                - { name: asset-worker-secrets, mountPath: /run/secrets/kokoro/asset-worker, readOnly: true }
          volumes:
            - { name: asset-worker-secrets, secret: { secretName: platform-asset-worker-secrets, defaultMode: 0440 } }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-admin-worker }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-admin-worker } }
      template:
        metadata: { labels: { app: platform-admin-worker } }
        spec:
          terminationGracePeriodSeconds: 30
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
          containers:
            - name: platform-admin-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-admin-worker-database }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-admin-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: admin-worker }
                - { name: PLATFORM_WORKER_HEALTH_PORT, value: "4190" }
                - name: PLATFORM_WORKER_ID
                  valueFrom: { fieldRef: { fieldPath: metadata.uid } }
              ports: [{ name: health, containerPort: 4190, protocol: TCP }]
              startupProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 2, failureThreshold: 30 }
              readinessProbe: { httpGet: { path: /health/ready, port: health }, periodSeconds: 2, failureThreshold: 1 }
              livenessProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 10, failureThreshold: 3 }

  - apiVersion: batch/v1
    kind: CronJob
    metadata: { name: platform-authorization-maintenance }
    spec:
      schedule: "17 3 * * *"
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 900
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          backoffLimit: 2
          activeDeadlineSeconds: 1800
          template:
            spec:
              restartPolicy: Never
              securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
              containers:
                - name: platform-authorization-maintenance
                  image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
                  envFrom:
                    - configMapRef: { name: platform-runtime }
                    - secretRef: { name: platform-authorization-maintenance-database }
                  env:
                    - { name: KOKORO_SERVICE_PACKAGE, value: platform-authorization-maintenance }
                    - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: authorization-maintenance }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-identity-worker }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-identity-worker } }
      template:
        metadata: { labels: { app: platform-identity-worker } }
        spec:
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: platform-identity-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-identity-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: identity-worker }
                - { name: PLATFORM_WORKER_HEALTH_PORT, value: "4190" }
                - name: DATABASE_URL_PLATFORM
                  valueFrom: { secretKeyRef: { name: platform-identity-worker-database, key: DATABASE_URL_PLATFORM } }
                - name: PLATFORM_DATABASE_EXPECTED_DATABASE
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_DATABASE_EXPECTED_DATABASE } }
                - name: PLATFORM_DATABASE_MIGRATOR_ROLE
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_DATABASE_MIGRATOR_ROLE } }
                - name: PLATFORM_DATABASE_IDENTITY_WORKER_ROLE
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_DATABASE_IDENTITY_WORKER_ROLE } }
                - name: PLATFORM_WORKER_ID
                  valueFrom: { fieldRef: { fieldPath: metadata.uid } }
                - { name: PLATFORM_IDENTITY_AUDIT_DIGEST_KEY_FILE, value: /var/run/secrets/kokoro/identity/audit-digest.key }
                - { name: PLATFORM_IDENTITY_SECRET_TRUST_ROOT, value: /var/run/secrets/kokoro/identity }
                - { name: PLATFORM_IDENTITY_DELIVERY_HMAC_SECRET_FILE, value: /var/run/secrets/kokoro/identity/delivery-hmac.key }
                - name: PLATFORM_IDENTITY_DELIVERY_ENDPOINT
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_IDENTITY_DELIVERY_ENDPOINT } }
                - name: PLATFORM_IDENTITY_DELIVERY_HMAC_KEY_ID
                  valueFrom: { configMapKeyRef: { name: platform-runtime, key: PLATFORM_IDENTITY_DELIVERY_HMAC_KEY_ID } }
              ports:
                - { name: health, containerPort: 4190, protocol: TCP }
              startupProbe:
                httpGet: { path: /health/live, port: health }
                periodSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet: { path: /health/ready, port: health }
                periodSeconds: 2
                failureThreshold: 1
              livenessProbe:
                httpGet: { path: /health/live, port: health }
                periodSeconds: 10
                failureThreshold: 3
              volumeMounts:
                - { name: platform-identity-worker-secrets, mountPath: /var/run/secrets/kokoro/identity, readOnly: true }
          volumes:
            - name: platform-identity-worker-secrets
              projected:
                defaultMode: 0440
                sources:
                  - secret:
                      name: identity-audit-digest-key
                      items: [{ key: key, path: audit-digest.key }]
                  - secret:
                      name: identity-delivery-hmac-key
                      items: [{ key: key, path: delivery-hmac.key }]

  - apiVersion: apps/v1
    kind: Deployment
