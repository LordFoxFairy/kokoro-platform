apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: platform-migrator
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: platform-migrator
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-migrator-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-migrator }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: migrator }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-api }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-api } }
      template:
        metadata: { labels: { app: platform-api } }
        spec:
          containers:
            - name: platform-api
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-api-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-api }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: api }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-admission }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-admission } }
      template:
        metadata: { labels: { app: platform-admission } }
        spec:
          containers:
            - name: platform-admission
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-admission-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-admission }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: admission }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-authorization }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-authorization } }
      template:
        metadata: { labels: { app: platform-authorization } }
        spec:
          containers:
            - name: platform-authorization
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-authorization-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-authorization }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: authorization }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-model-gateway }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-model-gateway } }
      template:
        metadata: { labels: { app: platform-model-gateway } }
        spec:
          containers:
            - name: platform-model-gateway
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-model-gateway-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-model-gateway }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: model-gateway }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-worker }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-worker } }
      template:
        metadata: { labels: { app: platform-worker } }
        spec:
          containers:
            - name: platform-worker
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-worker-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-worker }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: worker }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-admin }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-admin } }
      template:
        metadata: { labels: { app: platform-admin } }
        spec:
          containers:
            - name: platform-admin
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-admin-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-admin }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: admin }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-asset-data-plane }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-asset-data-plane } }
      template:
        metadata: { labels: { app: platform-asset-data-plane } }
        spec:
          containers:
            - name: platform-asset-data-plane
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - configMapRef: { name: platform-runtime }
                - secretRef: { name: platform-asset-data-plane-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-asset-data-plane }
                - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: asset-data-plane }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: kokoro-hub }
    spec:
      replicas: 2
      selector: { matchLabels: { app: kokoro-hub } }
      template:
        metadata: { labels: { app: kokoro-hub } }
        spec:
          containers:
            - name: kokoro-hub
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              envFrom:
                - secretRef: { name: kokoro-hub-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: "@kokoro/hub" }
                - { name: KOKORO_HUB_PORT, value: "4251" }
              ports:
                - { name: http, containerPort: 4251 }

  - apiVersion: v1
    kind: ServiceAccount
    metadata: { name: platform-hub-connect }
    automountServiceAccountToken: false

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: platform-hub-connect }
    spec:
      replicas: 2
      selector: { matchLabels: { app: platform-hub-connect } }
      strategy:
        type: RollingUpdate
        rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
      template:
        metadata: { labels: { app: platform-hub-connect } }
        spec:
          serviceAccountName: platform-hub-connect
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: platform-hub-connect
              image: ghcr.io/lordfoxfairy/kokoro-platform:RELEASE_DIGEST
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              envFrom:
                - configMapRef: { name: platform-hub-connect-runtime }
                - secretRef: { name: platform-hub-connect-secrets }
              env:
                - { name: KOKORO_SERVICE_PACKAGE, value: platform-hub-connect }
                - { name: KOKORO_HUB_CONNECT_PORT, value: "4252" }
                - { name: KOKORO_HUB_CONNECT_HEALTH_PORT, value: "4253" }
                - { name: KOKORO_WORKSPACE_CONFIG, value: /run/config/kokoro/storage.yaml }
                - { name: KOKORO_HUB_CONNECT_TRUST_ROOT, value: /run/secrets/hub-connect }
                - { name: KOKORO_HUB_CONNECT_TLS_KEY_FILE, value: /run/secrets/hub-connect/server.key }
                - { name: KOKORO_HUB_CONNECT_TLS_CERT_FILE, value: /run/secrets/hub-connect/server.crt }
                - { name: KOKORO_HUB_CONNECT_TLS_CLIENT_CA_FILE, value: /run/secrets/hub-connect/client-ca.crt }
                - { name: KOKORO_HUB_CONNECT_MTLS_PEERS_FILE, value: /run/secrets/hub-connect/inbound-peers.json }
                - { name: KOKORO_HUB_CAPABILITY_SIGNING_KEY_FILE, value: /run/secrets/hub-connect/catalog-signing.key }
                - { name: KOKORO_HUB_PLATFORM_PROJECTION_CLIENT_KEY_FILE, value: /run/secrets/hub-connect/platform-client.key }
                - { name: KOKORO_HUB_PLATFORM_PROJECTION_CLIENT_CERT_FILE, value: /run/secrets/hub-connect/platform-client.crt }
                - { name: KOKORO_HUB_PLATFORM_PROJECTION_SERVER_CA_FILE, value: /run/secrets/hub-connect/platform-ca.crt }
              ports:
                - { name: connect, containerPort: 4252 }
                - { name: health, containerPort: 4253 }
              startupProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
                failureThreshold: 30
                periodSeconds: 2
              livenessProbe:
                httpGet: { path: /health/live, port: health, scheme: HTTP }
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 3
              readinessProbe:
                httpGet: { path: /health/ready, port: health, scheme: HTTP }
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 2
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "2", memory: 1Gi }
              volumeMounts:
                - { name: hub-connect-mtls, mountPath: /run/secrets/hub-connect, readOnly: true }
                - { name: hub-storage-config, mountPath: /run/config/kokoro, readOnly: true }
          volumes:
            - name: hub-connect-mtls
              secret:
                secretName: platform-hub-connect-files
                defaultMode: 256
            - name: hub-storage-config
              configMap:
                name: platform-hub-connect-storage
                defaultMode: 292

  - apiVersion: v1
    kind: Service
    metadata: { name: platform-hub-connect }
    spec:
      selector: { app: platform-hub-connect }
      ports:
        - { name: connect, port: 4252, targetPort: connect }
