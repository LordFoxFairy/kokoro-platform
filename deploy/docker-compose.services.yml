services:
  kokoro-site:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      KOKORO_SERVICE_PACKAGE: "@kokoro/site"
      DATABASE_URL_SITE: mysql://root:kokoro_root@mysql:3306/kokoro
      KOKORO_SITE_PORT: 4201
      KOKORO_SITE_BASE_URL: http://kokoro-site:4201
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4201:4201"

  kokoro-user:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      KOKORO_SERVICE_PACKAGE: "@kokoro/user"
      DATABASE_URL_USER: mysql://root:kokoro_root@mysql:3306/kokoro
      KOKORO_SITE_BASE_URL: http://kokoro-site:4201
      KOKORO_USER_PORT: 4211
      KOKORO_USER_BASE_URL: http://kokoro-user:4211
      KOKORO_MODEL_BASE_URL: http://kokoro-model:4221
      KOKORO_CREDIT_BASE_URL: http://kokoro-credit:4231
      KOKORO_PAYMENT_BASE_URL: http://kokoro-payment:4241
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4211:4211"

  kokoro-model:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      KOKORO_SERVICE_PACKAGE: "@kokoro/model"
      DATABASE_URL_MODEL: mysql://root:kokoro_root@mysql:3306/kokoro
      KOKORO_SITE_BASE_URL: http://kokoro-site:4201
      KOKORO_MODEL_PORT: 4221
      KOKORO_USER_BASE_URL: http://kokoro-user:4211
      KOKORO_MODEL_BASE_URL: http://kokoro-model:4221
      KOKORO_CREDIT_BASE_URL: http://kokoro-credit:4231
      KOKORO_PAYMENT_BASE_URL: http://kokoro-payment:4241
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4221:4221"

  kokoro-credit:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      KOKORO_SERVICE_PACKAGE: "@kokoro/credit"
      DATABASE_URL_CREDIT: mysql://root:kokoro_root@mysql:3306/kokoro
      KOKORO_SITE_BASE_URL: http://kokoro-site:4201
      KOKORO_CREDIT_PORT: 4231
      KOKORO_USER_BASE_URL: http://kokoro-user:4211
      KOKORO_MODEL_BASE_URL: http://kokoro-model:4221
      KOKORO_CREDIT_BASE_URL: http://kokoro-credit:4231
      KOKORO_PAYMENT_BASE_URL: http://kokoro-payment:4241
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4231:4231"

  kokoro-payment:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      KOKORO_SERVICE_PACKAGE: "@kokoro/payment"
      DATABASE_URL_PAYMENT: mysql://root:kokoro_root@mysql:3306/kokoro
      KOKORO_SITE_BASE_URL: http://kokoro-site:4201
      KOKORO_PAYMENT_PORT: 4241
      KOKORO_USER_BASE_URL: http://kokoro-user:4211
      KOKORO_MODEL_BASE_URL: http://kokoro-model:4221
      KOKORO_CREDIT_BASE_URL: http://kokoro-credit:4231
      KOKORO_PAYMENT_BASE_URL: http://kokoro-payment:4241
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4241:4241"

  # 能力中台(Wave6 部署面补齐):Mongo 元数据 + MCP mutation 门缺省关(fail-closed 503)。
  # secret 主密钥/S3 凭据走 env_file 注入,不落 compose 字面。
  kokoro-hub:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      KOKORO_SERVICE_PACKAGE: "@kokoro/hub"
      KOKORO_HUB_PORT: 4251
      KOKORO_HUB_BASE_URL: http://kokoro-hub:4251
      KOKORO_HUB_MONGO_URL: mongodb://mongo:27017
      KOKORO_HUB_MONGO_DB: kokoro_hub
    ports:
      - "4251:4251"
