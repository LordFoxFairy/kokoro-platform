x-platform-service: &platform-service
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  restart: unless-stopped

services:
  platform-migrator:
    <<: *platform-service
    restart: "no"
    environment:
      KOKORO_SERVICE_PACKAGE: platform-migrator
      PLATFORM_DATABASE_CREDENTIAL_CLASS: migrator
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_MIGRATOR:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_API_ROLE: ${PLATFORM_DATABASE_API_ROLE:-platform_api}
      PLATFORM_DATABASE_ADMISSION_ROLE: ${PLATFORM_DATABASE_ADMISSION_ROLE:?required}
      PLATFORM_DATABASE_AUTHORIZATION_ROLE: ${PLATFORM_DATABASE_AUTHORIZATION_ROLE:-platform_authorization}
      PLATFORM_DATABASE_ASSET_DATA_PLANE_ROLE: ${PLATFORM_DATABASE_ASSET_DATA_PLANE_ROLE:-platform_asset_data_plane}
      PLATFORM_DATABASE_ARTIFACT_DATA_PLANE_ROLE: ${PLATFORM_DATABASE_ARTIFACT_DATA_PLANE_ROLE:-platform_artifact_data_plane}
      PLATFORM_DATABASE_MODEL_GATEWAY_ROLE: ${PLATFORM_DATABASE_MODEL_GATEWAY_ROLE:-platform_model_gateway}
      PLATFORM_DATABASE_MEMORY_PUBLIC_ROLE: ${PLATFORM_DATABASE_MEMORY_PUBLIC_ROLE:-platform_memory_public}
      PLATFORM_DATABASE_MEMORY_RUNTIME_ROLE: ${PLATFORM_DATABASE_MEMORY_RUNTIME_ROLE:-platform_memory_runtime}
      PLATFORM_DATABASE_MEMORY_WORKER_ROLE: ${PLATFORM_DATABASE_MEMORY_WORKER_ROLE:-platform_memory_worker}
      PLATFORM_DATABASE_COMMERCE_WORKER_ROLE: ${PLATFORM_DATABASE_COMMERCE_WORKER_ROLE:-platform_commerce_worker}
      PLATFORM_DATABASE_SITE_WORKER_ROLE: ${PLATFORM_DATABASE_SITE_WORKER_ROLE:-platform_site_worker}
      PLATFORM_DATABASE_ASSET_WORKER_ROLE: ${PLATFORM_DATABASE_ASSET_WORKER_ROLE:-platform_asset_worker}
      PLATFORM_DATABASE_ADMIN_WORKER_ROLE: ${PLATFORM_DATABASE_ADMIN_WORKER_ROLE:-platform_admin_worker}
      PLATFORM_DATABASE_IDENTITY_WORKER_ROLE: ${PLATFORM_DATABASE_IDENTITY_WORKER_ROLE:-platform_identity_worker}
      PLATFORM_DATABASE_MODEL_IMAGE_WORKER_ROLE: ${PLATFORM_DATABASE_MODEL_IMAGE_WORKER_ROLE:-platform_model_image_worker}
      PLATFORM_DATABASE_AUTHORIZATION_MAINTENANCE_ROLE: ${PLATFORM_DATABASE_AUTHORIZATION_MAINTENANCE_ROLE:-platform_authorization_maintenance}
      PLATFORM_DATABASE_ADMIN_ROLE: ${PLATFORM_DATABASE_ADMIN_ROLE:-platform_admin}

  platform-api:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-api
      PLATFORM_DATABASE_CREDENTIAL_CLASS: api
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_API:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_API_ROLE: ${PLATFORM_DATABASE_API_ROLE:-platform_api}
      PLATFORM_API_PORT: 4100
      PLATFORM_API_HEALTH_PORT: 4101
      PLATFORM_API_FILE_TRUST_ROOT: /run/secrets/platform-api
      PLATFORM_PRODUCT_WORKLOAD_REGISTRY_FILE: /run/secrets/platform-api/product-workloads.json
      PLATFORM_SESSION_ACCESS_KEY_RING_FILE: /run/secrets/platform-api/session-access-keys.json
      PLATFORM_AUTHORIZATION_EVENT_KEY_RING_FILE: /run/secrets/platform-api/authorization-event-keys.json
      PLATFORM_PUBLIC_TLS_KEY_FILE: /run/secrets/platform-api/public-tls.key
      PLATFORM_PUBLIC_TLS_CERT_FILE: /run/secrets/platform-api/public-tls.crt
      PLATFORM_PUBLIC_TLS_CLIENT_CA_FILE: /run/secrets/platform-api/public-client-ca.crt
      PLATFORM_COMMERCE_REDEMPTION_KEY_RING_FILE: /run/secrets/platform-api/commerce-redemption-keys.json
      PLATFORM_ASSET_UPLOAD_POLICY_REGISTRY_FILE: /run/secrets/platform-api/asset-upload-policies.json
      PLATFORM_ASSET_UPLOAD_CAPABILITY_KEY_RING_FILE: /run/secrets/platform-api/asset-upload-capability-keys.json
      PLATFORM_ARTIFACT_DELIVERY_CAPABILITY_KEY_FILE: /run/secrets/platform-api/artifact-delivery-capability-key.json
      PLATFORM_ARTIFACT_OWNER_CURSOR_KEY_FILE: /run/secrets/platform-api/artifact-owner-cursor-key.json
      PLATFORM_IDENTITY_PASSWORD_PEPPER_RING_FILE: /run/secrets/platform-api/identity-password-peppers.json
      PLATFORM_IDENTITY_VERIFICATION_DIGEST_KEY_FILE: /run/secrets/platform-api/identity-verification-digest.key
      PLATFORM_IDENTITY_SESSION_DIGEST_KEY_FILE: /run/secrets/platform-api/identity-session-digest.key
      PLATFORM_IDENTITY_REFRESH_DIGEST_KEY_FILE: /run/secrets/platform-api/identity-refresh-digest.key
      PLATFORM_IDENTITY_REAUTH_DIGEST_KEY_FILE: /run/secrets/platform-api/identity-reauth-digest.key
      PLATFORM_IDENTITY_AUDIT_DIGEST_KEY_FILE: /run/secrets/platform-api/identity-audit-digest.key
      PLATFORM_IDENTITY_DELIVERY_KEY_FILE: /run/secrets/platform-api/identity-delivery.key
      PLATFORM_IDENTITY_TOTP_KEY_RING_FILE: /run/secrets/platform-api/identity-totp-keys.json
    ports:
      - "4100:4100"
    volumes:
      - { type: bind, source: "${PLATFORM_PRODUCT_WORKLOAD_REGISTRY_FILE:?required}", target: /run/secrets/platform-api/product-workloads.json, read_only: true }
      - { type: bind, source: "${PLATFORM_SESSION_ACCESS_KEY_RING_FILE:?required}", target: /run/secrets/platform-api/session-access-keys.json, read_only: true }
      - { type: bind, source: "${PLATFORM_AUTHORIZATION_EVENT_KEY_RING_FILE:?required}", target: /run/secrets/platform-api/authorization-event-keys.json, read_only: true }
      - { type: bind, source: "${PLATFORM_PUBLIC_TLS_KEY_FILE:?required}", target: /run/secrets/platform-api/public-tls.key, read_only: true }
      - { type: bind, source: "${PLATFORM_PUBLIC_TLS_CERT_FILE:?required}", target: /run/secrets/platform-api/public-tls.crt, read_only: true }
      - { type: bind, source: "${PLATFORM_PUBLIC_TLS_CLIENT_CA_FILE:?required}", target: /run/secrets/platform-api/public-client-ca.crt, read_only: true }
      - { type: bind, source: "${PLATFORM_COMMERCE_REDEMPTION_KEY_RING_FILE:?required}", target: /run/secrets/platform-api/commerce-redemption-keys.json, read_only: true }
      - { type: bind, source: "${PLATFORM_ASSET_UPLOAD_POLICY_REGISTRY_FILE:?required}", target: /run/secrets/platform-api/asset-upload-policies.json, read_only: true }
      - { type: bind, source: "${PLATFORM_ASSET_UPLOAD_CAPABILITY_KEY_RING_FILE:?required}", target: /run/secrets/platform-api/asset-upload-capability-keys.json, read_only: true }
      - { type: bind, source: "${PLATFORM_ARTIFACT_DELIVERY_CAPABILITY_KEY_FILE:?required}", target: /run/secrets/platform-api/artifact-delivery-capability-key.json, read_only: true }
      - { type: bind, source: "${PLATFORM_ARTIFACT_OWNER_CURSOR_KEY_FILE:?required}", target: /run/secrets/platform-api/artifact-owner-cursor-key.json, read_only: true }
      - { type: bind, source: "${PLATFORM_IDENTITY_PASSWORD_PEPPER_RING_FILE:?required}", target: /run/secrets/platform-api/identity-password-peppers.json, read_only: true }
      - { type: bind, source: "${PLATFORM_IDENTITY_VERIFICATION_DIGEST_KEY_FILE:?required}", target: /run/secrets/platform-api/identity-verification-digest.key, read_only: true }
      - { type: bind, source: "${PLATFORM_IDENTITY_SESSION_DIGEST_KEY_FILE:?required}", target: /run/secrets/platform-api/identity-session-digest.key, read_only: true }
      - { type: bind, source: "${PLATFORM_IDENTITY_REFRESH_DIGEST_KEY_FILE:?required}", target: /run/secrets/platform-api/identity-refresh-digest.key, read_only: true }
      - { type: bind, source: "${PLATFORM_IDENTITY_REAUTH_DIGEST_KEY_FILE:?required}", target: /run/secrets/platform-api/identity-reauth-digest.key, read_only: true }
      - { type: bind, source: "${PLATFORM_IDENTITY_AUDIT_DIGEST_KEY_FILE:?required}", target: /run/secrets/platform-api/identity-audit-digest.key, read_only: true }
      - { type: bind, source: "${PLATFORM_IDENTITY_DELIVERY_KEY_FILE:?required}", target: /run/secrets/platform-api/identity-delivery.key, read_only: true }
      - { type: bind, source: "${PLATFORM_IDENTITY_TOTP_KEY_RING_FILE:?required}", target: /run/secrets/platform-api/identity-totp-keys.json, read_only: true }
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "${PLATFORM_RUNTIME_UID:-1000}:${PLATFORM_RUNTIME_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  platform-admission:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-admission
      PLATFORM_DATABASE_CREDENTIAL_CLASS: admission
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_ADMISSION:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_ADMISSION_ROLE: ${PLATFORM_DATABASE_ADMISSION_ROLE:?required}

  platform-authorization:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-authorization
      PLATFORM_DATABASE_CREDENTIAL_CLASS: authorization
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_AUTHORIZATION:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_AUTHORIZATION_ROLE: ${PLATFORM_DATABASE_AUTHORIZATION_ROLE:-platform_authorization}

  platform-model-gateway:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-model-gateway
      PLATFORM_DATABASE_CREDENTIAL_CLASS: model-gateway
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_MODEL_GATEWAY:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_MODEL_GATEWAY_ROLE: ${PLATFORM_DATABASE_MODEL_GATEWAY_ROLE:-platform_model_gateway}
      PLATFORM_MODEL_GATEWAY_PORT: ${PLATFORM_MODEL_GATEWAY_PORT:-4247}
      PLATFORM_MODEL_GATEWAY_PROVIDER_TIMEOUT_MS: ${PLATFORM_MODEL_GATEWAY_PROVIDER_TIMEOUT_MS:-30000}
      PLATFORM_MODEL_GATEWAY_AGENT_CALLER_SAN_URI: ${PLATFORM_MODEL_GATEWAY_AGENT_CALLER_SAN_URI:?required}
      PLATFORM_MODEL_GATEWAY_TLS_KEY_FILE: /run/secrets/platform-model-gateway/server.key
      PLATFORM_MODEL_GATEWAY_TLS_CERT_FILE: /run/secrets/platform-model-gateway/server.crt
      PLATFORM_MODEL_GATEWAY_TLS_CLIENT_CA_FILE: /run/secrets/platform-model-gateway/client-ca.crt
      PLATFORM_MODEL_GATEWAY_MTLS_PEERS_FILE: /run/secrets/platform-model-gateway/inbound-peers.json
      PLATFORM_MODEL_GATEWAY_RESPONSE_KEY_RING_FILE: /run/secrets/platform-model-gateway/response-key-ring.json
      PLATFORM_MODEL_GATEWAY_DIRECT_ENDPOINT: ${PLATFORM_MODEL_GATEWAY_DIRECT_ENDPOINT:?required}
      PLATFORM_MODEL_GATEWAY_DIRECT_API_KEY_FILE: /run/secrets/platform-model-gateway/direct-api-key
    volumes:
      - type: bind
        source: ${PLATFORM_MODEL_GATEWAY_SECRET_DIRECTORY:?required}
        target: /run/secrets/platform-model-gateway
        read_only: true

  platform-commerce-worker:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-commerce-worker
      PLATFORM_DATABASE_CREDENTIAL_CLASS: commerce-worker
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_COMMERCE_WORKER:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_COMMERCE_WORKER_ROLE: ${PLATFORM_DATABASE_COMMERCE_WORKER_ROLE:-platform_commerce_worker}
      PLATFORM_WORKER_ID: ${PLATFORM_COMMERCE_WORKER_ID:?required}
      PLATFORM_WORKER_HEALTH_PORT: ${PLATFORM_COMMERCE_WORKER_HEALTH_PORT:-4190}
      PLATFORM_OUTBOX_DELIVERY_ENDPOINT: ${PLATFORM_OUTBOX_DELIVERY_ENDPOINT:?required}
      PLATFORM_OUTBOX_DELIVERY_KEY_ID: ${PLATFORM_OUTBOX_DELIVERY_KEY_ID:?required}
      PLATFORM_COMMERCE_WORKER_SECRET_TRUST_ROOT: /run/secrets/kokoro/commerce-worker
      PLATFORM_COMMERCE_OUTBOX_DELIVERY_SECRET_FILE: /run/secrets/kokoro/commerce-worker/delivery-hmac.key
      PLATFORM_OUTBOX_DELIVERY_TIMEOUT_MS: ${PLATFORM_OUTBOX_DELIVERY_TIMEOUT_MS:-10000}
    volumes:
      - ${PLATFORM_COMMERCE_OUTBOX_DELIVERY_SECRET_FILE:?required}:/run/secrets/kokoro/commerce-worker/delivery-hmac.key:ro
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "--eval", "fetch(`http://127.0.0.1:$${process.env.PLATFORM_WORKER_HEALTH_PORT}/health/ready`).then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  platform-model-image-worker:
    <<: *platform-service
    profiles: [model-image-worker]
    environment:
      KOKORO_SERVICE_PACKAGE: platform-model-image-worker
      PLATFORM_DATABASE_CREDENTIAL_CLASS: model-image-worker
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_MODEL_IMAGE_WORKER:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_MODEL_IMAGE_WORKER_ROLE: ${PLATFORM_DATABASE_MODEL_IMAGE_WORKER_ROLE:-platform_model_image_worker}
      PLATFORM_WORKER_ID: ${PLATFORM_MODEL_IMAGE_WORKER_ID:?required}
      PLATFORM_WORKER_HEALTH_PORT: ${PLATFORM_MODEL_IMAGE_WORKER_HEALTH_PORT:-4190}
      PLATFORM_MODEL_IMAGE_WORKER_SECRET_TRUST_ROOT: /run/secrets/kokoro/model-image-worker
      PLATFORM_MODEL_IMAGE_WORKER_PROVIDER_REGISTRY_FILE: /run/secrets/kokoro/model-image-worker/providers.json
      PLATFORM_MODEL_IMAGE_WORKER_RESPONSE_KEY_RING_FILE: /run/secrets/kokoro/model-image-worker/response-keys.json
      PLATFORM_MODEL_IMAGE_WORKER_LEASE_MILLISECONDS: ${PLATFORM_MODEL_IMAGE_WORKER_LEASE_MILLISECONDS:-30000}
    volumes:
      - ${PLATFORM_MODEL_IMAGE_WORKER_PROVIDER_REGISTRY_FILE:?required}:/run/secrets/kokoro/model-image-worker/providers.json:ro
      - ${PLATFORM_MODEL_IMAGE_WORKER_RESPONSE_KEY_RING_FILE:?required}:/run/secrets/kokoro/model-image-worker/response-keys.json:ro
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "--eval", "fetch(`http://127.0.0.1:$${process.env.PLATFORM_WORKER_HEALTH_PORT}/health/ready`).then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  platform-site-worker:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-site-worker
      PLATFORM_DATABASE_CREDENTIAL_CLASS: site-worker
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_SITE_WORKER:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_SITE_WORKER_ROLE: ${PLATFORM_DATABASE_SITE_WORKER_ROLE:-platform_site_worker}
      PLATFORM_WORKER_ID: ${PLATFORM_SITE_WORKER_ID:?required}
      PLATFORM_WORKER_HEALTH_PORT: ${PLATFORM_SITE_WORKER_HEALTH_PORT:-4190}
      PLATFORM_SITE_PROVIDER_REGISTRY_FILE: /run/config/kokoro/site/provider-registry.json
      PLATFORM_AUTHORIZATION_EVENT_KEY_RING_FILE: /run/secrets/kokoro/authorization/event-key-ring.json
    volumes:
      - ${PLATFORM_SITE_PROVIDER_REGISTRY_FILE:?required}:/run/config/kokoro/site/provider-registry.json:ro
      - ${PLATFORM_SITE_PROVIDER_SECRETS_DIRECTORY:?required}:/run/secrets/kokoro/site/providers:ro
      - ${PLATFORM_AUTHORIZATION_EVENT_KEY_RING_FILE:?required}:/run/secrets/kokoro/authorization/event-key-ring.json:ro
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "--eval", "fetch(`http://127.0.0.1:$${process.env.PLATFORM_WORKER_HEALTH_PORT}/health/ready`).then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  platform-asset-worker:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-asset-worker
      PLATFORM_DATABASE_CREDENTIAL_CLASS: asset-worker
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_ASSET_WORKER:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_ASSET_WORKER_ROLE: ${PLATFORM_DATABASE_ASSET_WORKER_ROLE:-platform_asset_worker}
      PLATFORM_WORKER_ID: ${PLATFORM_ASSET_WORKER_ID:?required}
      PLATFORM_WORKER_HEALTH_PORT: ${PLATFORM_ASSET_WORKER_HEALTH_PORT:-4190}
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT:-production}
      PLATFORM_REGION: ${PLATFORM_REGION:?required}
      PLATFORM_ASSET_WORKER_SECRET_TRUST_ROOT: /run/secrets/kokoro/asset-worker
      PLATFORM_ASSET_STORAGE_ROUTE_FILE: /run/secrets/kokoro/asset-worker/storage-routes.json
      PLATFORM_ASSET_INSPECTION_POLICY_REGISTRY_FILE: /run/secrets/kokoro/asset-worker/inspection-policies.json
      PLATFORM_ASSET_SCANNER_ENDPOINT: ${PLATFORM_ASSET_SCANNER_ENDPOINT:?required}
      PLATFORM_ASSET_SCANNER_AUDIENCE: ${PLATFORM_ASSET_SCANNER_AUDIENCE:?required}
      PLATFORM_ASSET_SCANNER_TOKEN_FILE: /run/secrets/kokoro/asset-worker/scanner-token
      PLATFORM_ASSET_SCANNER_TLS_CA_FILE: /run/secrets/kokoro/asset-worker/scanner-ca.crt
      PLATFORM_ASSET_SCANNER_TLS_CERT_FILE: /run/secrets/kokoro/asset-worker/scanner-client.crt
      PLATFORM_ASSET_SCANNER_TLS_KEY_FILE: /run/secrets/kokoro/asset-worker/scanner-client.key
    volumes:
      - ${PLATFORM_ASSET_WORKER_SECRET_DIRECTORY:?required}:/run/secrets/kokoro/asset-worker:ro
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "--eval", "fetch(`http://127.0.0.1:$${process.env.PLATFORM_WORKER_HEALTH_PORT}/health/ready`).then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  platform-admin-worker:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-admin-worker
      PLATFORM_DATABASE_CREDENTIAL_CLASS: admin-worker
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_ADMIN_WORKER:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_ADMIN_WORKER_ROLE: ${PLATFORM_DATABASE_ADMIN_WORKER_ROLE:-platform_admin_worker}
      PLATFORM_WORKER_ID: ${PLATFORM_ADMIN_WORKER_ID:?required}
      PLATFORM_WORKER_HEALTH_PORT: ${PLATFORM_ADMIN_WORKER_HEALTH_PORT:-4190}
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "--eval", "fetch(`http://127.0.0.1:$${process.env.PLATFORM_WORKER_HEALTH_PORT}/health/ready`).then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  platform-authorization-maintenance:
    <<: *platform-service
    restart: "no"
    environment:
      KOKORO_SERVICE_PACKAGE: platform-authorization-maintenance
      PLATFORM_DATABASE_CREDENTIAL_CLASS: authorization-maintenance
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_AUTHORIZATION_MAINTENANCE:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_AUTHORIZATION_MAINTENANCE_ROLE: ${PLATFORM_DATABASE_AUTHORIZATION_MAINTENANCE_ROLE:-platform_authorization_maintenance}
      PLATFORM_AUTHORIZATION_EVENT_RETENTION_DAYS: ${PLATFORM_AUTHORIZATION_EVENT_RETENTION_DAYS:-7}

  platform-identity-worker:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-identity-worker
      PLATFORM_DATABASE_CREDENTIAL_CLASS: identity-worker
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_IDENTITY_WORKER:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_IDENTITY_WORKER_ROLE: ${PLATFORM_DATABASE_IDENTITY_WORKER_ROLE:-platform_identity_worker}
      PLATFORM_WORKER_ID: ${PLATFORM_IDENTITY_WORKER_ID:?required}
      PLATFORM_WORKER_HEALTH_PORT: ${PLATFORM_IDENTITY_WORKER_HEALTH_PORT:-4190}
      PLATFORM_IDENTITY_AUDIT_DIGEST_KEY_FILE: /run/secrets/kokoro/identity/audit-digest.key
      PLATFORM_IDENTITY_SECRET_TRUST_ROOT: /run/secrets/kokoro/identity
      PLATFORM_IDENTITY_DELIVERY_ENDPOINT: ${PLATFORM_IDENTITY_DELIVERY_ENDPOINT:?required}
      PLATFORM_IDENTITY_DELIVERY_HMAC_KEY_ID: ${PLATFORM_IDENTITY_DELIVERY_HMAC_KEY_ID:?required}
      PLATFORM_IDENTITY_DELIVERY_HMAC_SECRET_FILE: /run/secrets/kokoro/identity/delivery-hmac.key
      PLATFORM_IDENTITY_DELIVERY_TIMEOUT_MS: ${PLATFORM_IDENTITY_DELIVERY_TIMEOUT_MS:-10000}
    volumes:
      - ${PLATFORM_IDENTITY_AUDIT_DIGEST_KEY_FILE:?required}:/run/secrets/kokoro/identity/audit-digest.key:ro
      - ${PLATFORM_IDENTITY_DELIVERY_HMAC_SECRET_FILE:?required}:/run/secrets/kokoro/identity/delivery-hmac.key:ro
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "--eval", "fetch(`http://127.0.0.1:$${process.env.PLATFORM_WORKER_HEALTH_PORT}/health/ready`).then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  platform-admin:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-admin
      PLATFORM_DATABASE_CREDENTIAL_CLASS: admin
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_ADMIN:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_ADMIN_ROLE: ${PLATFORM_DATABASE_ADMIN_ROLE:-platform_admin}
      PLATFORM_COMMERCE_REDEMPTION_KEY_RING_FILE: /run/secrets/platform-admin/commerce-redemption-keys.json
    volumes:
      - { type: bind, source: "${PLATFORM_COMMERCE_REDEMPTION_KEY_RING_FILE:?required}", target: /run/secrets/platform-admin/commerce-redemption-keys.json, read_only: true }

  platform-asset-data-plane:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-asset-data-plane
      PLATFORM_DATABASE_CREDENTIAL_CLASS: asset-data-plane
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_ASSET_DATA_PLANE:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_ASSET_DATA_PLANE_ROLE: ${PLATFORM_DATABASE_ASSET_DATA_PLANE_ROLE:-platform_asset_data_plane}

  platform-artifact-data-plane:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: platform-artifact-data-plane
      PLATFORM_ARTIFACT_DATA_PLANE_PORT: "4248"
      PLATFORM_ARTIFACT_DATA_PLANE_OWNER_ADAPTER_REVISION: postgres-s3-v1
      PLATFORM_DATABASE_CREDENTIAL_CLASS: artifact-data-plane
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_ARTIFACT_DATA_PLANE:?required}
      PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
      PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
      PLATFORM_DATABASE_ARTIFACT_DATA_PLANE_ROLE: ${PLATFORM_DATABASE_ARTIFACT_DATA_PLANE_ROLE:-platform_artifact_data_plane}
      PLATFORM_ARTIFACT_DATA_PLANE_FILE_TRUST_ROOT: /run/secrets/platform-artifact-data-plane
      PLATFORM_ARTIFACT_DATA_PLANE_PRODUCT_WORKLOAD_REGISTRY_FILE: /run/secrets/platform-artifact-data-plane/product-workloads.json
      PLATFORM_ARTIFACT_DELIVERY_CAPABILITY_KEY_FILE: /run/secrets/platform-artifact-data-plane/capability-key.json
      PLATFORM_ARTIFACT_PRIVATE_OBJECT_ROUTE_FILE: /run/secrets/platform-artifact-data-plane/object-route.json
      PLATFORM_ARTIFACT_DATA_PLANE_TLS_KEY_FILE: /run/secrets/platform-artifact-data-plane/tls.key
      PLATFORM_ARTIFACT_DATA_PLANE_TLS_CERT_FILE: /run/secrets/platform-artifact-data-plane/tls.crt
      PLATFORM_ARTIFACT_DATA_PLANE_TLS_CLIENT_CA_FILE: /run/secrets/platform-artifact-data-plane/client-ca.crt
    volumes:
      - { type: bind, source: "${PLATFORM_ARTIFACT_PRODUCT_WORKLOAD_REGISTRY_FILE:?required}", target: /run/secrets/platform-artifact-data-plane/product-workloads.json, read_only: true }
      - { type: bind, source: "${PLATFORM_ARTIFACT_DELIVERY_CAPABILITY_KEY_FILE:?required}", target: /run/secrets/platform-artifact-data-plane/capability-key.json, read_only: true }
      - { type: bind, source: "${PLATFORM_ARTIFACT_PRIVATE_OBJECT_ROUTE_FILE:?required}", target: /run/secrets/platform-artifact-data-plane/object-route.json, read_only: true }
      - { type: bind, source: "${PLATFORM_ARTIFACT_DATA_PLANE_TLS_KEY_FILE:?required}", target: /run/secrets/platform-artifact-data-plane/tls.key, read_only: true }
      - { type: bind, source: "${PLATFORM_ARTIFACT_DATA_PLANE_TLS_CERT_FILE:?required}", target: /run/secrets/platform-artifact-data-plane/tls.crt, read_only: true }
      - { type: bind, source: "${PLATFORM_ARTIFACT_DATA_PLANE_TLS_CLIENT_CA_FILE:?required}", target: /run/secrets/platform-artifact-data-plane/client-ca.crt, read_only: true }

  kokoro-hub:
    <<: *platform-service
    environment:
      KOKORO_SERVICE_PACKAGE: "@kokoro/hub"
      KOKORO_HUB_PORT: 4251
      KOKORO_HUB_MONGO_URL: ${KOKORO_HUB_MONGO_URL:?required}
      KOKORO_HUB_MONGO_DB: ${KOKORO_HUB_MONGO_DB:-kokoro_hub}
    ports:
      - "4251:4251"

  platform-hub-connect:
    <<: *platform-service
    depends_on:
      platform-admission:
        condition: service_started
    environment:
      KOKORO_SERVICE_PACKAGE: platform-hub-connect
      KOKORO_HUB_CONNECT_PORT: 4252
      KOKORO_HUB_CONNECT_HEALTH_PORT: 4253
      KOKORO_HUB_MONGO_URL: ${KOKORO_HUB_MONGO_URL:?required}
      KOKORO_HUB_MONGO_DB: ${KOKORO_HUB_MONGO_DB:-kokoro_hub}
      KOKORO_WORKSPACE_CONFIG: /run/config/kokoro/storage.yaml
      KOKORO_WORKSPACE_S3_ACCESS_KEY: ${KOKORO_WORKSPACE_S3_ACCESS_KEY:?required}
      KOKORO_WORKSPACE_S3_SECRET_KEY: ${KOKORO_WORKSPACE_S3_SECRET_KEY:?required}
      KOKORO_HUB_SECRET_MASTER_KEY: ${KOKORO_HUB_SECRET_MASTER_KEY:?required}
      KOKORO_HUB_CONNECT_TRUST_ROOT: /run/secrets/hub-connect-inbound
      KOKORO_HUB_CONNECT_TLS_KEY_FILE: /run/secrets/hub-connect-inbound/server.key
      KOKORO_HUB_CONNECT_TLS_CERT_FILE: /run/secrets/hub-connect-inbound/server.crt
      KOKORO_HUB_CONNECT_TLS_CLIENT_CA_FILE: /run/secrets/hub-connect-inbound/client-ca.crt
      KOKORO_HUB_CONNECT_MTLS_PEERS_FILE: /run/secrets/hub-connect-inbound/inbound-peers.json
      KOKORO_HUB_CATALOG_PLATFORM_CALLER_SAN_URI: ${KOKORO_HUB_CATALOG_PLATFORM_CALLER_SAN_URI:-spiffe://kokoro.internal/platform}
      KOKORO_HUB_RUNTIME_AGENT_CALLER_SAN_URI: ${KOKORO_HUB_RUNTIME_AGENT_CALLER_SAN_URI:-spiffe://kokoro.internal/agent}
      KOKORO_HUB_CAPABILITY_SIGNING_KEY_REF: ${KOKORO_HUB_CAPABILITY_SIGNING_KEY_REF:?required}
      KOKORO_HUB_CAPABILITY_SIGNING_TRUST_ROOT: /run/secrets/hub-capability-signing
      KOKORO_HUB_CAPABILITY_SIGNING_KEY_FILE: /run/secrets/hub-capability-signing/catalog-signing.key
      KOKORO_HUB_PLATFORM_PROJECTION_BASE_URL: ${KOKORO_HUB_PLATFORM_PROJECTION_BASE_URL:-https://platform-admission:4244}
      KOKORO_HUB_PLATFORM_PROJECTION_SERVER_NAME: ${KOKORO_HUB_PLATFORM_PROJECTION_SERVER_NAME:?required}
      KOKORO_HUB_PLATFORM_PROJECTION_TRUST_ROOT: /run/secrets/hub-platform-projection
      KOKORO_HUB_PLATFORM_PROJECTION_CLIENT_KEY_FILE: /run/secrets/hub-platform-projection/platform-client.key
      KOKORO_HUB_PLATFORM_PROJECTION_CLIENT_CERT_FILE: /run/secrets/hub-platform-projection/platform-client.crt
      KOKORO_HUB_PLATFORM_PROJECTION_SERVER_CA_FILE: /run/secrets/hub-platform-projection/platform-ca.crt
    ports:
      - "4252:4252"
    volumes:
      - type: bind
        source: ${KOKORO_HUB_CONNECT_INBOUND_SECRETS_DIRECTORY:?required}
        target: /run/secrets/hub-connect-inbound
        read_only: true
      - type: bind
        source: ${KOKORO_HUB_CAPABILITY_SIGNING_SECRETS_DIRECTORY:?required}
        target: /run/secrets/hub-capability-signing
        read_only: true
      - type: bind
        source: ${KOKORO_HUB_PLATFORM_PROJECTION_SECRETS_DIRECTORY:?required}
        target: /run/secrets/hub-platform-projection
        read_only: true
      - type: bind
        source: ${KOKORO_WORKSPACE_CONFIG_FILE:?required}
        target: /run/config/kokoro/storage.yaml
        read_only: true
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:4253/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
