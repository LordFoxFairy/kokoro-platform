name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: generate database clients
        run: pnpm db:generate
      - name: production dependency audit
        run: pnpm audit --prod
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: unit, Identity, and security tests
        run: pnpm test

  hub-integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      KOKORO_HUB_MONGO_URL: mongodb://127.0.0.1:27017
      KOKORO_TEST_MINIO_URL: http://127.0.0.1:9100
      MINIO_ROOT_USER: example-minio
      MINIO_ROOT_PASSWORD: example-minio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: start minio
        run: >-
          docker run --detach --name kokoro-ci-minio -p 9100:9100
          -e MINIO_ROOT_USER=example-minio -e MINIO_ROOT_PASSWORD=example-minio-secret
          minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          server /data --address :9100
      - name: wait for minio
        run: >-
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:9100/minio/health/live && exit 0;
          sleep 2; done; exit 1
      - name: Hub integration tests
        run: pnpm test:integration

  platform-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PGPASSWORD: postgres-ci-bootstrap
      DATABASE_URL_PLATFORM: postgresql://platform_migrator:platform-migrator-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_MIGRATOR_TEST: postgresql://platform_migrator:platform-migrator-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_BOOTSTRAP_TEST: postgresql://postgres:postgres-ci-bootstrap@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_API_TEST: postgresql://platform_api:platform-api-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_ADMISSION_TEST: postgresql://platform_admission:platform-admission-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_ASSET_DATA_PLANE_TEST: postgresql://platform_asset_data_plane:platform-asset-data-plane-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_ARTIFACT_DATA_PLANE_TEST: postgresql://platform_artifact_data_plane:platform-artifact-data-plane-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_COMMERCE_WORKER_TEST: postgresql://platform_commerce_worker:platform-commerce-worker-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_SITE_WORKER_TEST: postgresql://platform_site_worker:platform-site-worker-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_ASSET_WORKER_TEST: postgresql://platform_asset_worker:platform-asset-worker-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_ADMIN_WORKER_TEST: postgresql://platform_admin_worker:platform-admin-worker-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_IDENTITY_WORKER_TEST: postgresql://platform_identity_worker:platform-identity-worker-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_AUTHORIZATION_MAINTENANCE_TEST: postgresql://platform_authorization_maintenance:platform-authorization-maintenance-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_ADMIN_TEST: postgresql://platform_admin:platform-admin-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_MODEL_GATEWAY_TEST: postgresql://platform_model_gateway:platform-model-gateway-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_MODEL_IMAGE_WORKER_TEST: postgresql://platform_model_image_worker:platform-model-image-worker-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_MEMORY_PUBLIC_TEST: postgresql://platform_memory_public:platform-memory-public-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_MEMORY_RUNTIME_TEST: postgresql://platform_memory_runtime:platform-memory-runtime-ci@127.0.0.1:5432/kokoro_test_platform
      DATABASE_URL_PLATFORM_MEMORY_WORKER_TEST: postgresql://platform_memory_worker:platform-memory-worker-ci@127.0.0.1:5432/kokoro_test_platform
      PLATFORM_DATABASE_CREDENTIAL_CLASS: migrator
      PLATFORM_DATABASE_EXPECTED_DATABASE: kokoro_test_platform
      PLATFORM_DATABASE_MIGRATOR_ROLE: platform_migrator
      PLATFORM_DATABASE_API_ROLE: platform_api
      PLATFORM_DATABASE_ADMISSION_ROLE: platform_admission
      PLATFORM_DATABASE_AUTHORIZATION_ROLE: platform_authorization
      PLATFORM_DATABASE_ASSET_DATA_PLANE_ROLE: platform_asset_data_plane
      PLATFORM_DATABASE_ARTIFACT_DATA_PLANE_ROLE: platform_artifact_data_plane
      PLATFORM_DATABASE_COMMERCE_WORKER_ROLE: platform_commerce_worker
      PLATFORM_DATABASE_SITE_WORKER_ROLE: platform_site_worker
      PLATFORM_DATABASE_ASSET_WORKER_ROLE: platform_asset_worker
      PLATFORM_DATABASE_ADMIN_WORKER_ROLE: platform_admin_worker
      PLATFORM_DATABASE_IDENTITY_WORKER_ROLE: platform_identity_worker
      PLATFORM_DATABASE_AUTHORIZATION_MAINTENANCE_ROLE: platform_authorization_maintenance
      PLATFORM_DATABASE_ADMIN_ROLE: platform_admin
      PLATFORM_DATABASE_MODEL_GATEWAY_ROLE: platform_model_gateway
      PLATFORM_DATABASE_MODEL_IMAGE_WORKER_ROLE: platform_model_image_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: provision least-privilege Platform database roles
        run: >-
          psql --host 127.0.0.1 --username postgres --dbname postgres
          --set ON_ERROR_STOP=1 --file scripts/ci/provision-platform-postgres.sql
      - name: build Platform migrator
        run: pnpm build:runtime
      - name: apply Platform migrations
        run: pnpm db:migrate
      - name: Platform PostgreSQL component tests
        run: pnpm test:component:postgres

  artifact:
    needs: [gates, hub-integration, platform-postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build deployment image
        run: >-
          docker build --file deploy/docker/Dockerfile
          --tag kokoro-platform:${{ github.sha }} .
